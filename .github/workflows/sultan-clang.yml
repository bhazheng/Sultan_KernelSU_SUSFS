name: Sultan (Clang)
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      codename:
        description: "Device codename (e.g. gs201)"
        required: true
        default: "gs201"
        type: string
      variants:
        description: "Varian yang di-build"
        required: false
        default: '["KernelSU-Next"]'
        type: choice
        options:
          - '["KernelSU-Next"]'
          - '["KernelSU-Next", "NoRoot"]'
          - '["NoRoot"]'
      build_nomount:
        description: "Build & upload NoMount metamodule (sekali, di job matrix pertama)"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      codename:
        required: true
        type: string
      variants:
        description: "Varian yang di-build (JSON array)"
        required: false
        type: string
        default: '["KernelSU-Next"]'
      build_nomount:
        description: "Build & upload NoMount metamodule (sekali, di job matrix pertama)"
        required: false
        type: boolean
        default: true

jobs:
  build-kernel-sultan-kernelsu-susfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      # Pin upstream. Patch di patches/ divalidasi (0 fuzz/0 offset/0 reject) terhadap SHA ini;
      # bump SHA bersamaan dengan regenerasi patch. Harus SHA LENGKAP (40 hex): fetch-by-SHA
      # tidak menerima singkatan. Pin menjaga build tetap reproducible walau upstream
      # force-push (pershoot/KernelSU-Next dev-susfs pernah di-rebase).
      SUSFS_COMMIT: "f76b81f2a6bf98e4029cc0c823c054edbec29803"
      KSUN_COMMIT: "39b15dead6fa806cb3582f866b081fa1d9e1c9e4"
      # NoMount (maxsteeel/nomount): dulu mengikuti tip branch dev + menjalankan setup.sh mentah
      # dari dev -> kode tak ter-review langsung masuk kernel. Kini setup.sh dan source di-pin.
      NOMOUNT_PIN: "f83db94afa3e480584ee57045fc7f5efdde83040"
      # lkmloader (maxsteeel/lkmloader): customize.sh NoMount memindahkan bin/lkmloader-$ARCH ke
      # lkm/lkmloader; tanpanya instalasi modul mencetak error mv/set_perm.
      LKMLOADER_PIN: "03fa70ea33f90fa21729d4dd26da7920ee370b71"
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}

    steps:
      - name: Validate Inputs
        shell: bash
        env:
          # Lewat env, bukan interpolasi ${{ }} langsung di script (anti script-injection).
          CODENAME: ${{ inputs.codename }}
        run: |
          # Validasi awal: tree kernel bhazheng hanya untuk gs201.
          # Gagal cepat sebelum runner mengunduh toolchain bila codename salah.
          case "$CODENAME" in
            gs201)
              echo "[+] Codename gs201 valid (tree bhazheng gs201-only)."
              ;;
            *)
              echo "::error::Codename '$CODENAME' tidak didukung! Tree kernel bhazheng hanya untuk gs201."
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner (background)
        shell: bash
        run: |
          # Dulu ~2 menit MEMBLOKIR job (run 40617356741: 1m53s / 2m13s) sebelum apa pun bisa jalan.
          # Kini jalan di background, paralel dengan apt/toolchain/clone; step "Wait for disk
          # cleanup" menunggu sebelum build (satu-satunya tahap yang butuh ruang besar).
          # Proses background dari satu step tetap hidup hingga job selesai.
          df -h / | tail -1
          nohup sudo sh -c 'rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift; docker image prune --all --force' \
            > /tmp/disk-cleanup.log 2>&1 &
          echo $! > /tmp/disk-cleanup.pid
          echo "[+] Disk cleanup dimulai di background (pid $(cat /tmp/disk-cleanup.pid))"

      - name: Install Essential Build Tools
        shell: bash
        run: |
          sudo apt-get update
          # ccache: cache kompilasi (dipasang di sini, dipakai langkah Build).
          sudo apt-get install -y --no-install-recommends libssl-dev libelf-dev bc bison flex perl lz4 ccache zlib1g-dev binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi cmake zstd

      - name: Download and extract Neutron Clang (06092026)
        shell: bash
        run: |
          set -euo pipefail
          echo "Fetching Neutron Clang 06092026 (Neutron-Toolchains/clang-build-catalogue)..."
          mkdir -p $GITHUB_WORKSPACE/clang
          CLANG_URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst"
          CLANG_SHA256="531083928c8e37f6b31e324dbfd0b5a8323f989b1c57ff2c1368b889b5b1bd30"
          for i in 1 2 3; do
            echo "Attempt $i: $CLANG_URL"
            HTTP_CODE="$(curl -sSL -o /tmp/clang.tar.zst -w "%{http_code}" "$CLANG_URL" || true)"
            echo "HTTP code: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] && [ -s /tmp/clang.tar.zst ]; then
              # Magic zstd: 28 b5 2f fd
              if head -c 4 /tmp/clang.tar.zst | od -An -tx1 | grep -qi "28 b5 2f fd"; then
                if echo "$CLANG_SHA256  /tmp/clang.tar.zst" | sha256sum -c --quiet - && tar -I zstd -tf /tmp/clang.tar.zst >/dev/null 2>&1; then
                  tar -I zstd -xf /tmp/clang.tar.zst -C $GITHUB_WORKSPACE/clang
                  rm -f /tmp/clang.tar.zst
                  echo "[+] Neutron Clang extracted successfully"
                  break
                else
                  echo "Checksum SHA-256 / arsip zst tidak valid, retry..." >&2
                fi
              else
                echo "File bukan zstd valid (awal):" >&2
                head -c 200 /tmp/clang.tar.zst >&2 || true
              fi
            else
              echo "retry $i failed (http=$HTTP_CODE)" >&2
            fi
            rm -f /tmp/clang.tar.zst
            sleep 5
            if [ "$i" -eq 3 ]; then
              echo "::error::Failed to download Neutron Clang after 3 attempts"
              exit 1
            fi
          done
          chmod +x $GITHUB_WORKSPACE/clang/bin/* 2>/dev/null || true
          $GITHUB_WORKSPACE/clang/bin/clang --version
          $GITHUB_WORKSPACE/clang/bin/ld.lld --version

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          # Cache compiler: key per codename+varian+toolchain agar
          # tidak tercampur; restore-keys sebagai fallback prefix codename.
          path: ~/.cache/ccache
          key: ccache-${{ inputs.codename }}-${{ matrix.variant }}-clang-v1-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.codename }}-${{ matrix.variant }}-clang-
            ccache-${{ inputs.codename }}-clang-

      # NoMount metamodule = userspace murni, identik untuk semua kernel & varian -> cukup SATU
      # build + upload per run: hanya job matrix pertama, dan build-kernel-release.yml menyalakan
      # build_nomount di satu workflow kernel saja.
      - name: Set up Zig Compiler
        if: ${{ inputs.build_nomount && strategy.job-index == 0 }}
        uses: jetsung/setup-zig@ece60a5f01428e90311476245667dc49e3f84513 # v0.0.4
        with:
          # Upstream NoMount membangun dengan Zig master; 0.13.0 gagal untuk flag mereka
          # (-mcmodel=tiny + musl static: 'unknown relocation'; arm-linux tanpa musl default).
          version: 0.17.1

      - name: Set CONFIG Environment Variable
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="android_kernel_google_tensynos"
          echo "CONFIG=$CONFIG" >> "$GITHUB_ENV"

      - name: Clone AnyKernel3 and Dependencies (Parallel)
        shell: bash
        run: |
          set -euo pipefail
          echo "[+] Cloning dependencies in parallel (shallow + partial)..."
          KERNEL_BRANCH="android14-6.1.145"
          echo "[+] Target kernel branch: $KERNEL_BRANCH"

          clone_kernel() {
            local n=0
            until [ "$n" -ge 2 ]; do
              if git -c protocol.version=2 clone --depth=1 --single-branch --no-tags --filter=blob:none https://github.com/bhazheng/android_kernel_google_tensynos -b "$KERNEL_BRANCH" android_kernel_google_tensynos; then
                return 0
              fi
              n=$((n+1))
              echo "retry $n/2 partial clone kernel gagal, membersihkan..." >&2
              rm -rf android_kernel_google_tensynos
              sleep 5
            done
            echo "[*] Partial clone ditolak server — fallback ke shallow penuh." >&2
            git -c protocol.version=2 clone --depth=1 --single-branch --no-tags https://github.com/bhazheng/android_kernel_google_tensynos -b "$KERNEL_BRANCH" android_kernel_google_tensynos
          }
          git -c protocol.version=2 clone --depth=1 --single-branch --no-tags https://github.com/TheWildJames/AnyKernel3.git -b "sultan-${{ inputs.codename }}" AnyKernel3 &

          clone_kernel &

          # SuSFS upstream dari fork pershoot (branch gki-android14-6.1), di-pin ke SUSFS_COMMIT
          # (SuSFS v2.4.0) -- cocok dengan patches/50_add_susfs_in_gki-android14-6.1-sultan.patch.
          # Ambil commit PERSIS (bukan tip branch): init + fetch --depth=1 <sha> + checkout.
          # Dicoba lagi 3x untuk gangguan jaringan; gagal keras bila SHA tidak ada/ditolak.
          fetch_pinned() {
            local url="$1" sha="$2" dir="$3" n=0
            rm -rf "$dir"
            git init -q "$dir" || return 1
            git -C "$dir" remote add origin "$url" || return 1
            until git -C "$dir" fetch -q --depth=1 origin "$sha"; do
              n=$((n+1))
              [ "$n" -lt 3 ] || { echo "::error::fetch $sha dari $url gagal setelah 3x." >&2; return 1; }
              echo "retry $n/3 fetch $dir..." >&2
              sleep 5
            done
            git -C "$dir" checkout -q --detach FETCH_HEAD || return 1
            [ "$(git -C "$dir" rev-parse HEAD)" = "$sha" ] || { echo "::error::$dir tidak di $sha." >&2; return 1; }
          }
          fetch_pinned https://gitlab.com/pershoot/susfs4ksu.git "$SUSFS_COMMIT" susfs4ksu &

          # Tunggu semua clone paralel selesai sebelum langkah berikut.
          for pid in $(jobs -p); do
            wait "$pid"
          done
          echo "[+] susfs4ksu pinned at $(git -C susfs4ksu rev-parse HEAD)"

      - name: Add Root Implementation & Version Anchoring
        if: ${{ matrix.variant == 'KernelSU-Next' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"

          # Bersihkan sisa direktori/symlink usang
          rm -rf KernelSU KernelSU-Next drivers/kernelsu drivers/KernelSU
          sed -i '/kernelsu/d' drivers/Makefile 2>/dev/null || true
          sed -i '/kernelsu/d' drivers/Kconfig 2>/dev/null || true

          # Fungsi retry jaringan
          retry() {
            local n=0
            until [ "$n" -ge 5 ]; do
              "$@" && return 0
              n=$((n+1))
              echo "retry $n/5 failed for: $*" >&2
              sleep 5
            done
            return 1
          }

          if [ "${{ matrix.variant }}" == "KernelSU-Next" ]; then
            echo "[+] Adding KernelSU-Next dari fork pershoot (branch dev-susfs)..."
            # Pin ke KSUN_COMMIT (env job): patch 02_ksun & kontrak SUSFS divalidasi ke SHA ini.
            # Kbuild KernelSU-Next menghitung KSU_VERSION = 30000 + jumlah commit, memakai NAMA branch
            # (dev-susfs -> dev) dan menjalankan `git fetch --unshallow` saat make bila repo shallow.
            # Pin dengan HEAD terlepas + --depth=1 menghasilkan 33554, bukan 33568 seperti clone
            # -b dev-susfs (Kbuild menarik semua branch lalu merge-base ke origin/dev). Maka:
            # lacak hanya dev-susfs (-t), ambil riwayat PENUH + tag di sini, checkout sebagai branch
            # dev-susfs -> versi identik dengan clone lama, dan make tidak butuh jaringan.
            rm -rf KernelSU-Next
            git init -q KernelSU-Next
            git -C KernelSU-Next remote add -t dev-susfs origin https://github.com/pershoot/KernelSU-Next.git
            retry git -C KernelSU-Next fetch -q --tags origin "$KSUN_COMMIT"
            git -C KernelSU-Next checkout -q -B dev-susfs FETCH_HEAD
            [ "$(git -C KernelSU-Next rev-parse HEAD)" = "$KSUN_COMMIT" ] || {
              echo "::error::KernelSU-Next tidak berada di $KSUN_COMMIT."
              exit 1
            }
            [ ! -f KernelSU-Next/.git/shallow ] || { echo "::error::KernelSU-Next masih shallow — KSU_VERSION akan salah."; exit 1; }
            echo "[+] KernelSU-Next $(git -C KernelSU-Next describe --tags --abbrev=0 2>/dev/null || echo '?') @ ${KSUN_COMMIT:0:12} -> KSU_VERSION=$((30000 + $(git -C KernelSU-Next rev-list --count HEAD)))"
            ln -sf ../KernelSU-Next/kernel drivers/kernelsu

            echo "[+] Menerapkan patch KernelSU-Next untuk kernel Sultan non-modular..."
            patch -p1 -d KernelSU-Next < "$GITHUB_WORKSPACE/patches/02_ksun_sultan.patch"
          fi

          # Pastikan registrasi ke Kconfig dan Makefile rapi
          if ! grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
            sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi
          if ! grep -q 'kernelsu' drivers/Makefile; then
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          fi

          # Matikan warning misleading-indentation di tree KernelSU untuk mencegah
          # compiler memperlakukannya sebagai fatal error (-Werror)
          for kf in KernelSU-Next/kernel/Kbuild KernelSU-Next/kernel/Makefile; do
            if [ -f "$kf" ] && ! grep -q "Wno-misleading-indentation" "$kf"; then
              echo "subdir-ccflags-y += -Wno-misleading-indentation" >> "$kf"
            fi
          done

          # Validasi
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || {
            echo "::error::Gagal mendaftarkan drivers/kernelsu/Kconfig ke drivers/Kconfig!"
            exit 1
          }
          test -e drivers/kernelsu
          test -f drivers/kernelsu/Kconfig || {
            echo "::error::File drivers/kernelsu/Kconfig tidak ditemukan!"
            exit 1
          }

      - name: Apply SUSFS Patches
        if: ${{ matrix.variant == 'KernelSU-Next' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"

          SUSFS_DIR="../susfs4ksu/kernel_patches"
          KSUN_DIR="KernelSU-Next"

          # SUSFS Common (libs)
          cp "$SUSFS_DIR/fs/"* ./fs/
          cp "$SUSFS_DIR/include/linux/"* ./include/linux/

          # Terapkan patch SuSFS adaptasi Sultan untuk tree kernel (50_add)
          SULTAN_PATCH="$GITHUB_WORKSPACE/patches/50_add_susfs_in_gki-android14-6.1-sultan.patch"
          APPLIED_PATCH="$SULTAN_PATCH"
          [ -f "$APPLIED_PATCH" ] || APPLIED_PATCH="$SUSFS_DIR/50_add_susfs_in_gki-android14-6.1.patch"
          if [ -f "$SULTAN_PATCH" ]; then
            echo "[+] Menerapkan patch SuSFS adaptasi Sultan (50_add)..."
            patch -p1 < "$SULTAN_PATCH" || {
              echo "::error::Patch SuSFS adaptasi Sultan gagal diterapkan!"
              exit 1
            }
          else
            echo "[-] Patch lokal tidak ditemukan, fallback ke patch upstream pershoot..."
            patch -p1 < "$SUSFS_DIR/50_add_susfs_in_gki-android14-6.1.patch" || {
              echo "::error::Patch SuSFS upstream gagal diterapkan!"
              exit 1
            }
          fi

          # Catatan: pershoot/KernelSU-Next branch dev-susfs sudah memiliki integrasi SuSFS secara native,
          # sehingga 10_enable_susfs_for_ksu.patch dan next-susfs-fixup.patch TIDAK DIPERLUKAN lagi.

          # Cetak daftar file .rej jika ada
          echo "=== Pemeriksaan file .rej ==="
          REJ_COUNT=$(find . -name "*.rej" | wc -l)
          if [ "$REJ_COUNT" -gt 0 ]; then
            echo "::error::Ditemukan $REJ_COUNT file .rej pasca-patch SuSFS!"
            find . -name "*.rej" -print
            exit 1
          fi

          # Gerbang verifikasi konsistensi SUSFS/KSU:
          echo "=== Verifikasi kontrak SUSFS <-> KernelSU-Next ==="
          # Gerbang lama (grep susfs_init di KernelSU-Next/kernel) SELALU lolos: core/init.c
          # memanggilnya dan susfs/susfs_main.c (varian LKM) mendefinisikannya -- tanpa bukti
          # bahwa sisi kernel (fs/susfs.c) menyediakan API yang dipanggil KernelSU-Next.
          # Gerbang ini: setiap susfs_*() yang dipanggil supercall/dispatch.c WAJIB terdefinisi
          # di fs/susfs.c. (Terbukti menolak lib v2.3.0 yang tidak punya *_uid_filter.)
          for f in fs/susfs.c include/linux/susfs.h "$KSUN_DIR/kernel/supercall/dispatch.c"; do
            [ -f "$f" ] || { echo "::error::$f tidak ditemukan — wiring SUSFS hilang."; exit 1; }
          done
          grep -qE '^void susfs_init\(' fs/susfs.c || {
            echo "::error::susfs_init() tidak didefinisikan di fs/susfs.c."
            exit 1
          }
          SUSFS_FNS="$(grep -ohE '\bsusfs_[a-z0-9_]+\(arg\)' "$KSUN_DIR/kernel/supercall/dispatch.c" | sed 's/(arg)$//' | sort -u)"
          [ -n "$SUSFS_FNS" ] || {
            echo "::error::Tidak ada panggilan susfs_*() terdeteksi di dispatch.c (format berubah?) — gerbang tak bisa memverifikasi."
            exit 1
          }
          GATE_FAIL=0
          for fn in $SUSFS_FNS; do
            if ! grep -qE "^[a-z_ ]+[ *]${fn}\(" fs/susfs.c; then
              echo "::error::KernelSU-Next memanggil ${fn}() tetapi fs/susfs.c tidak mendefinisikannya (versi SUSFS tidak cocok?)."
              GATE_FAIL=1
            fi
          done
          [ "$GATE_FAIL" -eq 0 ] || exit 1
          echo "[+] Kontrak OK: $(echo "$SUSFS_FNS" | wc -l) fungsi susfs_*() terpenuhi (SUSFS $(sed -n 's/^#define SUSFS_VERSION "\(.*\)"/\1/p' include/linux/susfs.h))."

          # Gerbang link: setiap simbol yang dideklarasikan `extern` oleh patch SUSFS harus punya
          # definisi (fs/susfs.c, file ter-patch, atau KernelSU-Next). Riwayat CI: dua run gagal di
          # link akhir ('undefined symbol: susfs_open_redirect_spoof_*') setelah ~25 menit.
          python3 "$GITHUB_WORKSPACE/scripts/check_susfs_externs.py" "$APPLIED_PATCH" "$KSUN_DIR/kernel"

      - name: Apply Optimization & Network Patches
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"

          # Toleran by-design (drift upstream tidak boleh mematikan build), tetapi TIDAK diam:
          # kegagalan jadi ::warning:: dan .rej ikut ke artifact rej-*.
          apply_tolerant() {
            if ! patch -p1 -F3 --forward < "$1"; then
              echo "::warning::Patch $(basename "$1") gagal/sebagian diterapkan — cek artifact rej-*."
            fi
          }

          # Terapkan patch BBRv3 dari GKID-Kernels (cherry-pick resmi google/bbr)
          echo "[+] Menerapkan patch BBRv3 dari GKID-Kernels..."
          apply_tolerant "$GITHUB_WORKSPACE/patches/bbrv3.patch"

          # Terapkan patch optimasi sistem non-RAM dari GKID-Kernels
          echo "[+] Menerapkan patch optimasi dari GKID-Kernels..."
          for p in "$GITHUB_WORKSPACE"/patches/gkid/*.patch; do
            echo "Applying $(basename "$p")..."
            apply_tolerant "$p"
          done

      - name: Integrate NoMount
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          KERNEL_DIR="$(pwd)"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/maxsteeel/nomount/${NOMOUNT_PIN}/kernel/setup.sh" | bash -s "$NOMOUNT_PIN"
          actual_commit="$(git -C "$KERNEL_DIR/NoMount" rev-parse HEAD)"
          [ "$actual_commit" = "$NOMOUNT_PIN" ] || {
            echo "::error::NoMount berada di $actual_commit, bukan pin $NOMOUNT_PIN."
            exit 1
          }
          [ -L "$KERNEL_DIR/fs/nomount" ] || { echo "::error::Symlink fs/nomount tidak dibuat oleh setup.sh NoMount."; exit 1; }
          echo "NOMOUNT_COMMIT=$actual_commit" >> "$GITHUB_ENV"

      - name: Build and Package NoMount Metamodule
        if: ${{ inputs.build_nomount && strategy.job-index == 0 }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          COMMIT_HASH="$NOMOUNT_PIN"
          SRC_DIR="nomount_src"
          MOD_DIR="nomount_mod"
          ZIP_OUT="NoMount.zip"

          rm -rf "$SRC_DIR" "$MOD_DIR"
          git init -q "$SRC_DIR"
          git -C "$SRC_DIR" remote add origin https://github.com/maxsteeel/nomount.git
          git -C "$SRC_DIR" fetch -q --depth=1 origin "$COMMIT_HASH"
          git -C "$SRC_DIR" checkout -q --detach FETCH_HEAD

          LKML_DIR="lkmloader_src"
          rm -rf "$LKML_DIR"
          git init -q "$LKML_DIR"
          git -C "$LKML_DIR" remote add origin https://github.com/maxsteeel/lkmloader.git
          git -C "$LKML_DIR" fetch -q --depth=1 origin "$LKMLOADER_PIN"
          git -C "$LKML_DIR" checkout -q --detach FETCH_HEAD

          # Flag = .github/workflows/build.yml upstream pada pin ini. nm.c kini memakai header libc
          # (unistd.h, dirent.h, ...) -> link statis ke musl bawaan Zig; -nostdlib/_start lama
          # gagal dengan "'unistd.h' file not found".
          mkdir -p "$SRC_DIR/bin" "$MOD_DIR/bin" "$MOD_DIR/lkm"
          (
            cd "$SRC_DIR/userspace/src"
            zig cc -target aarch64-linux -Oz -mcmodel=tiny -static -ffreestanding -fno-unwind-tables -fno-ident -Wno-invalid-noreturn \
              -mllvm -enable-machine-outliner=always nm.c -o ../../bin/nm-arm64
            zig cc -target arm-linux -Oz -static -ffreestanding -fno-unwind-tables -fno-ident -Wno-invalid-noreturn \
              -ffunction-sections -fdata-sections -Wl,--gc-sections nm.c -o ../../bin/nm-arm
          )
          (
            cd "$LKML_DIR"
            zig cc -target aarch64-linux -Oz -mcmodel=tiny -static -Wl,--gc-sections,-z,norelro -fno-unwind-tables \
              -fno-ident -flto -fmerge-all-constants -fomit-frame-pointer -mllvm -enable-machine-outliner=always \
              src/lkmloader.c -o "../$SRC_DIR/bin/lkmloader-arm64"
            zig cc -target arm-linux -Oz -static -Wl,--gc-sections,-z,norelro -fno-unwind-tables \
              -fno-ident -flto -fmerge-all-constants -fomit-frame-pointer src/lkmloader.c -o "../$SRC_DIR/bin/lkmloader-arm"
          )
          cp -a "$SRC_DIR/module/." "$MOD_DIR/"
          for b in nm-arm64 nm-arm lkmloader-arm64 lkmloader-arm; do
            install -m 0755 "$SRC_DIR/bin/$b" "$MOD_DIR/bin/$b"
          done
          # Biner harus ELF ARM statis (tanpa interpreter): perangkat tidak punya musl.
          file "$MOD_DIR"/bin/*
          for b in "$MOD_DIR"/bin/*; do
            file -b "$b" | grep -q 'statically linked' || { echo "::error::$(basename "$b") bukan biner statis."; exit 1; }
          done
          case "$(file -b "$MOD_DIR/bin/nm-arm64")" in *aarch64*) ;; *) echo "::error::nm-arm64 bukan aarch64."; exit 1 ;; esac
          printf '%s\n' "$LKMLOADER_PIN" > "$MOD_DIR/LKMLOADER_SOURCE_COMMIT"
          sed -i "s/^versionCode=.*/versionCode=1/" "$MOD_DIR/module.prop"
          printf '%s\n' "$COMMIT_HASH" > "$MOD_DIR/NOMOUNT_SOURCE_COMMIT"
          (cd "$MOD_DIR" && zip -qr9 "../$ZIP_OUT" .)
          sha256sum "$ZIP_OUT" > "${ZIP_OUT}.sha256"
          unzip -l "$ZIP_OUT"
          rm -rf "$SRC_DIR" "$MOD_DIR" "$LKML_DIR"

      - name: Apply Kernel Defconfig Flags
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          
          # ---------------------------------------------------------
          # MANUALLY INJECT DEFCONFIG MENGGUNAKAN BLOK ECHO
          # (Mencegah YAML menambahkan spasi di depan kata "CONFIG_")
          # ---------------------------------------------------------
          # Sultan defconfig secara default menyetel CONFIG_LTO_GCC=y.
          # Untuk Clang, GCC LTO wajib dimatikan dan diganti dengan
          # CONFIG_LTO_CLANG_THIN=y (ThinLTO standar GKI — LTO_NONE tak bisa
          # me-link tree ini: dead code ECT tak ter-GC) agar Makefile Sultan
          # tidak meng-override AR/NM ke gcc-ar/gcc-nm dan tidak memicu
          # loop dependensi konfigurasi Kbuild.
          sed -i 's/CONFIG_LTO_GCC=y/# CONFIG_LTO_GCC is not set/' "./arch/arm64/configs/${{ inputs.codename }}_defconfig"
          {
            echo "CONFIG_LTO_CLANG_THIN=y"
            echo "CONFIG_TMPFS_XATTR=y"
            echo "CONFIG_TMPFS_POSIX_ACL=y"
            echo "CONFIG_IP_NF_TARGET_TTL=y"
            echo "CONFIG_IP6_NF_TARGET_HL=y"
            echo "CONFIG_IP6_NF_MATCH_HL=y"
            echo "CONFIG_NET_ACT_CONNMARK=y"
            echo "CONFIG_IP_SET=y"
            echo "CONFIG_IP_SET_MAX=65534"
            echo "CONFIG_IP_SET_BITMAP_IP=y"
            echo "CONFIG_IP_SET_BITMAP_IPMAC=y"
            echo "CONFIG_IP_SET_BITMAP_PORT=y"
            echo "CONFIG_IP_SET_HASH_IP=y"
            echo "CONFIG_IP_SET_HASH_IPMARK=y"
            echo "CONFIG_IP_SET_HASH_IPPORT=y"
            echo "CONFIG_IP_SET_HASH_IPPORTIP=y"
            echo "CONFIG_IP_SET_HASH_IPPORTNET=y"
            echo "CONFIG_IP_SET_HASH_IPMAC=y"
            echo "CONFIG_IP_SET_HASH_MAC=y"
            echo "CONFIG_IP_SET_HASH_NETPORTNET=y"
            echo "CONFIG_IP_SET_HASH_NET=y"
            echo "CONFIG_IP_SET_HASH_NETNET=y"
            echo "CONFIG_IP_SET_HASH_NETPORT=y"
            echo "CONFIG_IP_SET_HASH_NETIFACE=y"
            echo "CONFIG_IP_SET_LIST_SET=y"
            echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
            echo "CONFIG_NETFILTER_XT_SET=y"
            echo "CONFIG_NETFILTER_XT_TARGET_LOG=y"
            echo "CONFIG_NETFILTER_XT_MATCH_RECENT=y"
            echo "CONFIG_IP6_NF_NAT=y"
            echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y"
            # Netfilter/Xtables Targets & Matches (GKID compat.config)
            echo "CONFIG_NETFILTER_XT_TARGET_HMARK=y"
            echo "CONFIG_NETFILTER_XT_TARGET_CLASSIFY=y"
            echo "CONFIG_NETFILTER_XT_TARGET_CONNSECMARK=y"
            echo "CONFIG_NETFILTER_XT_TARGET_DSCP=y"
            echo "CONFIG_NETFILTER_XT_TARGET_IDLETIMER=y"
            echo "CONFIG_NETFILTER_XT_TARGET_MARK=y"
            echo "CONFIG_NETFILTER_XT_TARGET_NFLOG=y"
            echo "CONFIG_NETFILTER_XT_MATCH_ECN=y"
            echo "CONFIG_NETFILTER_XT_MATCH_HL=y"
            echo "CONFIG_NETFILTER_XT_MATCH_LENGTH=y"
            echo "CONFIG_NETFILTER_XT_MATCH_LIMIT=y"
            echo "CONFIG_NETFILTER_XT_MATCH_MAC=y"
            echo "CONFIG_NETFILTER_XT_MATCH_MARK=y"
            echo "CONFIG_NETFILTER_XT_MATCH_POLICY=y"
            echo "CONFIG_NETFILTER_XT_MATCH_PKTTYPE=y"
            echo "CONFIG_NETFILTER_XT_MATCH_QUOTA=y"
            echo "CONFIG_NETFILTER_XT_MATCH_SOCKET=y"
            echo "CONFIG_NETFILTER_XT_MATCH_STATE=y"
            echo "CONFIG_NETFILTER_XT_MATCH_STATISTIC=y"
            echo "CONFIG_NETFILTER_XT_MATCH_STRING=y"
            echo "CONFIG_NETFILTER_XT_MATCH_TCPMSS=y"
            echo "CONFIG_NETFILTER_XT_MATCH_TIME=y"
            echo "CONFIG_NETFILTER_XT_MATCH_U32=y"
            # Traffic Control & Classification (GKID compat.config)
            echo "CONFIG_NET_CLS_BASIC=y"
            echo "CONFIG_NET_CLS_FW=y"
            echo "CONFIG_NET_CLS_U32=y"
            echo "CONFIG_NET_CLS_FLOW=y"
            echo "CONFIG_NET_CLS_BPF=y"
            echo "CONFIG_NET_EMATCH=y"
            echo "CONFIG_NET_EMATCH_CMP=y"
            echo "CONFIG_NET_EMATCH_NBYTE=y"
            echo "CONFIG_NET_EMATCH_U32=y"
            echo "CONFIG_NET_EMATCH_META=y"
            echo "CONFIG_NET_EMATCH_TEXT=y"
            # IPv4 Netfilter Targets (GKID compat.config)
            echo "CONFIG_IP_NF_TARGET_REDIRECT=y"
            echo "CONFIG_IP_NF_MANGLE=y"
            echo "CONFIG_IP_NF_RAW=y"
            echo "CONFIG_IP_NF_SECURITY=y"
            echo "CONFIG_IP_NF_ARPTABLES=y"
            # IPsec & VTI (GKID compat.config)
            echo "CONFIG_NET_IPVTI=y"
            echo "CONFIG_INET_ESP=y"
            # Advanced IPv6 Routing (GKID compat.config)
            echo "CONFIG_IPV6_ROUTER_PREF=y"
            echo "CONFIG_IPV6_ROUTE_INFO=y"
            echo "CONFIG_IPV6_OPTIMISTIC_DAD=y"
            echo "CONFIG_IPV6_MULTIPLE_TABLES=y"
            echo "CONFIG_IPV6_SUBTREES=y"
            echo "CONFIG_IPV6_MROUTE=y"
            echo "CONFIG_IPV6_MROUTE_MULTIPLE_TABLES=y"
            echo "CONFIG_IPV6_PIMSM_V2=y"
            # Diagnostics (GKID compat.config)
            echo "CONFIG_INET_UDP_DIAG=y"
            echo "CONFIG_INET_DIAG_DESTROY=y"
            echo "CONFIG_WIREGUARD=y"
            echo "CONFIG_TCP_CONG_ADVANCED=y"
            echo "CONFIG_TCP_CONG_BBR=y"
            echo "CONFIG_TCP_CONG_CUBIC=y"
            echo "CONFIG_TCP_CONG_BIC=y"
            echo "CONFIG_TCP_CONG_WESTWOOD=y"
            echo "CONFIG_TCP_CONG_HTCP=y"
            echo "CONFIG_DEFAULT_BBR=y"
            echo "CONFIG_DEFAULT_TCP_CONG=\"bbr\""
            echo "CONFIG_NET_SCH_FQ=y"
            echo "CONFIG_NET_SCH_FQ_CODEL=y"
            echo "CONFIG_NET_SCH_CAKE=y"
            echo "CONFIG_NETWORK_FILESYSTEMS=y"
            echo "CONFIG_NETFS_SUPPORT=y"
            echo "CONFIG_KEYS=y"
            echo "CONFIG_CIFS=y"
            echo "CONFIG_CIFS_XATTR=y"
            echo "CONFIG_CIFS_POSIX=y"
            echo "CONFIG_NTSYNC=y"
            # NOTE (Sultan): KPROBES sengaja TIDAK diset. gs201_defconfig
            # memuat CONFIG_INTEGRATE_MODULES=y, dan kernel/module/Kconfig
            # memaksa `menuconfig MODULES depends on !INTEGRATE_MODULES`,
            # sedangkan arch/Kconfig memaksa `config KPROBES depends on MODULES`.
            # Jadi KPROBES tak pernah bisa aktif di kernel ini dan olddefconfig
            # selalu mencoretnya. KernelSU-Next tidak butuh KPROBES:
            # 10_enable_susfs_for_ksu.patch upstream menghapus depends KPROBES
            # dari Kconfig KSU, dan fix v2.2.0 memaksa mode Inline (SuSFS).
            # Jangan mengembalikan baris KPROBES di sini.
            echo "CONFIG_THREAD_INFO_IN_TASK=y"
            echo "CONFIG_DEBUG_KERNEL=y"
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
            echo "CONFIG_OVERLAY_FS=y"
            echo "CONFIG_FUSE_FS=y"
            echo "CONFIG_BPF_SYSCALL=y"
            echo "CONFIG_FUSE_BPF=y"
          } >> "./arch/arm64/configs/${{ inputs.codename }}_defconfig"

          # NoMount nol dependensi KSU/SUSFS (nomount.c + customize.sh modding) —
          # aktif untuk SEMUA varian termasuk NoRoot.
          {
            echo "CONFIG_NOMOUNT=y"
          } >> "./arch/arm64/configs/${{ inputs.codename }}_defconfig"
          # Simbol KSU/SUSFS — hanya untuk KernelSU-Next
          # (NoRoot tidak membawa drivers/kernelsu maupun patch SUSFS):
          # KSU + SUSFS aktif, sisanya default upstream (SUS_SU sudah tidak ada di Kconfig KernelSU-Next).
          if [ "${{ matrix.variant }}" == "KernelSU-Next" ]; then
            {
              echo "CONFIG_KSU=y"
              echo "CONFIG_KSU_SUSFS=y"
            } >> "./arch/arm64/configs/${{ inputs.codename }}_defconfig"
          else
            echo "[*] Varian ${{ matrix.variant }} — injeksi KSU/SUSFS dilewati (tanpa KSU)."
          fi

          # Nama kernel (uname -r) = bawaan tree: CONFIG_LOCALVERSION dari defconfig dibiarkan apa adanya.
          echo "[+] Menerapkan patch perbaikan kernel Sultan..."
          patch -p1 < "$GITHUB_WORKSPACE/patches/00_sultan_kernel_fixes.patch"


      - name: Wait for disk cleanup
        shell: bash
        run: |
          set -euo pipefail
          pid="$(cat /tmp/disk-cleanup.pid 2>/dev/null || true)"
          if [ -n "$pid" ]; then
            SECONDS=0
            while [ -d "/proc/$pid" ]; do sleep 2; done
            echo "[+] Disk cleanup selesai (menunggu ${SECONDS}s di sini)."
          fi
          tail -3 /tmp/disk-cleanup.log 2>/dev/null || true
          df -h / | tail -1
          avail_gb=$(( $(df --output=avail -k / | tail -1) / 1024 / 1024 ))
          [ "$avail_gb" -ge 15 ] || echo "::warning::Ruang disk tersisa hanya ${avail_gb}G sebelum build."

      - name: Build the Kernel
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"

          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          unset CLANG_FLAGS
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          if [ -d "$GITHUB_WORKSPACE/clang/aarch64-linux-gnu/bin" ]; then
            export PATH="$GITHUB_WORKSPACE/clang/aarch64-linux-gnu/bin:$PATH"
          fi
          # ccache: bungkus clang via wrapper + PATH precedence
          # (kbuild memanggil `clang` via PATH; wrapper men-shadow sebelum clang asli).
          # Wrapper script (bukan CC="ccache ..." di MAKE_ARGS) karena spasi dalam
          # string MAKE_ARGS tidak dikutip ulang saat ekspansi `make $MAKE_ARGS`.
          export CCACHE_DIR="$HOME/.cache/ccache"
          export CCACHE_MAXSIZE=2G
          mkdir -p "$HOME/.ccache-bin"
          printf '#!/bin/sh\nexec ccache "%s" -Qunused-arguments "$@"\n' "$GITHUB_WORKSPACE/clang/bin/clang" > "$HOME/.ccache-bin/clang"
          printf '#!/bin/sh\nexec ccache "%s" -Qunused-arguments "$@"\n' "$GITHUB_WORKSPACE/clang/bin/clang++" > "$HOME/.ccache-bin/clang++"
          chmod +x "$HOME/.ccache-bin/clang" "$HOME/.ccache-bin/clang++"
          export PATH="$HOME/.ccache-bin:$PATH"
          ccache -z >/dev/null 2>&1 || true  # reset statistik agar `ccache -s` akhir = run ini saja
          export KCFLAGS="-Wno-c2x-extensions -Wno-error=c2x-extensions -Wno-c23-extensions -Wno-error=c23-extensions -Wno-unknown-warning-option"
          MAKE_ARGS="LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- WERROR=0"

          # Bersihkan file .config di root source tree agar out-of-tree build Sultan (out/) tidak melempar error mrproper
          rm -f .config

          # 1. Defconfig dasar (Sultan Makefile otomatis mengarahkan output build ke out/)
          make $MAKE_ARGS -j$(nproc --all) ${{ inputs.codename }}_defconfig

          # Deteksi file config aktif (Sultan Makefile menaruhnya di out/.config)
          CONFIG_FILE="out/.config"
          if [ ! -f "$CONFIG_FILE" ]; then
            CONFIG_FILE=".config"
          fi

          # 2. Injeksi mutlak konfigurasi ke target config yang aktif
          # (tanpa KPROBES/HAVE_KPROBES/KRETPROBES/KPROBE_EVENTS — lihat NOTE di atas;
          # HAVE_KPROBES adalah simbol select-only milik arch, bukan untuk diset manual.
          # Blok KSU: paksa KSU + SUSFS aktif
          # (koheren dengan blok defconfig minimal di atas; sisanya default upstream).
          # Blok KSU hanya untuk varian root — NoRoot tidak ada drivers/kernelsu di tree.)
          if [ "${{ matrix.variant }}" == "KernelSU-Next" ]; then
            ./scripts/config --file "$CONFIG_FILE" \
              -e CONFIG_KSU \
              -e CONFIG_KSU_SUSFS
          else
            echo "[*] Varian ${{ matrix.variant }} — injeksi CONFIG_KSU dilewati (tanpa root)."
          fi
          ./scripts/config --file "$CONFIG_FILE" \
            -d CONFIG_WERROR \
            -d CONFIG_LTO_GCC \
            -d CONFIG_LTO_NONE \
            -e CONFIG_LTO_CLANG_THIN \
            -e CONFIG_THREAD_INFO_IN_TASK \
            -e CONFIG_DEBUG_KERNEL \
            -e CONFIG_KALLSYMS \
            -e CONFIG_KALLSYMS_ALL \
            -e CONFIG_OVERLAY_FS \
            -e CONFIG_FUSE_FS \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_FUSE_BPF
          # ThinLTO untuk SEMUA varian Clang (bukan NONE): tanpa LTO, dead
          # code gs_tmu_throt_freq yang mereferensikan exynos_acme_ect_freq
          # (simbol absen di tree, skew import 56cf922a) dipertahankan
          # linker lalu gagal (undefined reference) — ini menimpa NoRoot
          # maupun Next. ThinLTO adalah standar GKI Android dan
          # kombinasi yang terbukti dengan KernelSU-Next di Pixel.

          echo "=== CONFIG_KSU (& status KPROBES/MODULES) sebelum olddefconfig ==="
          grep -E "CONFIG_(KSU|KPROBES|KRETPROBES|MODULES|INTEGRATE_MODULES)" "$CONFIG_FILE" || true

          # Pastikan tidak ada file .config di root source tree sebelum make dipanggil
          if [ "$CONFIG_FILE" != ".config" ]; then
            rm -f .config
          fi

          make $MAKE_ARGS olddefconfig 2>&1 | tee /tmp/olddefconfig.log

          echo "=== CONFIG_KSU (& status KPROBES/MODULES) setelah olddefconfig ==="
          grep -E "CONFIG_(KSU|KPROBES|KRETPROBES|MODULES|INTEGRATE_MODULES)" "$CONFIG_FILE" || true

          # Fail-fast ThinLTO: olddefconfig diam-diam mengembalikan LTO_NONE
          # bila dependensi tak terpenuhi (versi LLVM/lld). Tanpa ThinLTO,
          # link pasti gagal di exynos_acme_ect_freq — gagalkan di sini
          # (detik) daripada setelah build 20+ menit.
          grep -q "^CONFIG_LTO_CLANG_THIN=y" "$CONFIG_FILE" || {
            echo "::error::CONFIG_LTO_CLANG_THIN tidak aktif setelah olddefconfig (fallback ke NONE?) — cek HAS_LTO_CLANG/versi toolchain."
            exit 1
          }
          echo "[+] ThinLTO aktif."

          echo "========== Cek CONFIG_KSU setelah olddefconfig =========="
          MISSING=0
          # KPROBES ekspektasinya NONAKTIF di Sultan: INTEGRATE_MODULES=y
          # menonaktifkan MODULES, dan KPROBES depends on MODULES.
          # Ini bukan error — KernelSU-Next memakai SUSFS inline hook.
          if grep -q "^CONFIG_KPROBES=y" "$CONFIG_FILE"; then
            echo "::warning::CONFIG_KPROBES aktif (tak terduga di Sultan; INTEGRATE_MODULES mungkin mati)."
          else
            echo "::notice::CONFIG_KPROBES nonaktif — ekspektasi Sultan (INTEGRATE_MODULES=y => MODULES=n => KPROBES=n)."
          fi
          # Varian non-root (NoRoot) tidak membawa KSU — pemeriksaan ini dilewati
          # (ketidakhadiran KSU justru ekspektasi yang benar).
          if [ "${{ matrix.variant }}" == "KernelSU-Next" ]; then
            if ! grep -q "^CONFIG_KSU=y" "$CONFIG_FILE"; then
              echo "::error::CONFIG_KSU tidak aktif setelah olddefconfig!"
              MISSING=1
            fi
            if ! grep -q "^CONFIG_KSU_SUSFS=y" "$CONFIG_FILE"; then
              echo "::error::CONFIG_KSU_SUSFS tidak aktif setelah olddefconfig!"
              MISSING=1
            fi
          else
            echo "::notice::Varian ${{ matrix.variant }} — pemeriksaan CONFIG_KSU dilewati (tanpa root)."
          fi
          if ! grep -q "^CONFIG_KALLSYMS_ALL=y" "$CONFIG_FILE"; then
            echo "::warning::CONFIG_KALLSYMS_ALL tidak aktif, menginjeksi langsung ke $CONFIG_FILE..."
            ./scripts/config --file "$CONFIG_FILE" -e CONFIG_DEBUG_KERNEL -e CONFIG_KALLSYMS -e CONFIG_KALLSYMS_ALL
            make $MAKE_ARGS olddefconfig
          fi
          if [ $MISSING -eq 1 ]; then
            grep -i "ksu" /tmp/olddefconfig.log || true
            exit 1
          fi

          # Sinkronisasi konfigurasi eksplisit sebelum kompilasi untuk memastikan
          # auto.conf, auto.conf.cmd, dan autoconf.h sinkron penuh dengan .config,
          # mencegah loop rekursif syncconfig saat kompilasi paralel.
          make $MAKE_ARGS syncconfig

          # Install sanitised UAPI headers ke $(objtree)/usr/include -- hanya varian KSU.
          # Kbuild KernelSU mengaktifkan preinit HANYA bila $(objtree)/usr/include/linux/unistd.h
          # ada (kernel/Kbuild). Bila tidak, -DKSU_NO_PREINIT hanya berlaku untuk unit KernelSU,
          # sedangkan fs/exec.c (patch SUSFS) tetap mereferensikan ksu_setup_preinit_file() ->
          # "undefined reference" saat link, SETELAH 20+ menit kompilasi. Gagalkan di sini.
          # objtree = direktori config aktif (out/ untuk tree ini), bukan root source.
          if [ "${{ matrix.variant }}" == "KernelSU-Next" ]; then
            make $MAKE_ARGS headers_install || {
              echo "::error::make headers_install gagal — preinit runner KernelSU tidak akan dibangun dan link akan gagal."
              exit 1
            }
            OBJTREE="$(dirname "$CONFIG_FILE")"
            if [ ! -f "$OBJTREE/usr/include/linux/unistd.h" ]; then
              echo "::error::$OBJTREE/usr/include/linux/unistd.h tidak ada setelah headers_install — preinit KernelSU nonaktif; link akan gagal (undefined reference ksu_setup_preinit_file)."
              exit 1
            fi
            echo "[+] UAPI headers siap ($OBJTREE/usr/include) untuk preinit runner KernelSU."
          fi

          # 3. Kompilasi Paralel
          # Log build disimpan; saat gagal, error pertama diangkat jadi anotasi ::error:: (terlihat di
          # halaman run) -- menggantikan re-run `make -j1` yang membangun ulang sisa target satu-thread.
          if ! make $MAKE_ARGS LOCALVERSION_AUTO=0 -j"$(nproc --all)" Image.lz4 dtbs 2>&1 | tee /tmp/build.log; then
            echo "========== Ringkasan error build =========="
            grep -nE 'error:|undefined (reference|symbol)|No rule to make target|\*\*\* \[' /tmp/build.log | head -40 || true
            grep -E 'error:|undefined (reference|symbol)|No rule to make target' /tmp/build.log \
              | grep -v '^make' | awk '!seen[$0]++' | head -10 | while IFS= read -r l; do echo "::error::$l"; done || true
            exit 1
          fi

          # Statistik ccache untuk log (tak menggagalkan build).
          ccache -s || true

      - name: Copy Images & Create ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          if [ -f ./out/arch/arm64/boot/Image.lz4 ]; then
            cp ./out/arch/arm64/boot/Image.lz4 ../AnyKernel3/Image.lz4
          elif [ -f ./out/arch/arm64/boot/Image ]; then
            lz4 -9 -f ./out/arch/arm64/boot/Image ../AnyKernel3/Image.lz4
          elif [ -f ./arch/arm64/boot/Image.lz4 ]; then
            cp ./arch/arm64/boot/Image.lz4 ../AnyKernel3/Image.lz4
          elif [ -f ./arch/arm64/boot/Image ]; then
            lz4 -9 -f ./arch/arm64/boot/Image ../AnyKernel3/Image.lz4
          fi

          DTB_FOUND=0
          for dtb_dir in "./out/google-devices/${{ inputs.codename }}/dts" "./out/arch/arm64/boot/dts" "./google-devices/${{ inputs.codename }}/dts" "./arch/arm64/boot/dts/google-devices/${{ inputs.codename }}/dts" "./arch/arm64/boot/dts"; do
            if compgen -G "${dtb_dir}/*.dtb" > /dev/null; then
              cat ${dtb_dir}/*.dtb > ../AnyKernel3/dtb
              DTB_FOUND=1
              break
            fi
          done
          if [ $DTB_FOUND -eq 0 ]; then
            find out -name "*.dtb" -exec cat {} + > ../AnyKernel3/dtb 2>/dev/null || true
          fi

          if [ ! -f ../AnyKernel3/Image.lz4 ]; then
            echo "::error::Image.lz4 tidak ditemukan!"
            exit 1
          fi
          if [ ! -s ../AnyKernel3/dtb ]; then
            echo "::error::dtb tidak ditemukan atau kosong!"
            exit 1
          fi

          cd ../AnyKernel3
          ZIP_NAME="${{ matrix.variant }}-${{ inputs.codename }}-Sultan-clang.zip"
          zip -qr9 "../$ZIP_NAME" . -x '.git/*' -x '.github/*' -x '*.zip' -x 'README.md'
          cd ..
          sha256sum "$ZIP_NAME" > "${ZIP_NAME}.sha256"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "ZIP_SHA=$(cat ${ZIP_NAME}.sha256 | cut -d' ' -f1)" >> "$GITHUB_ENV"

          # Image.lz4 mentah juga dirilis (untuk yang flash via boot.img sendiri / magiskboot).
          # Nama unik per kernel+varian: rilis mem-flatten semua artefak ke satu direktori.
          IMG_NAME="${ZIP_NAME%.zip}-Image.lz4"
          cp AnyKernel3/Image.lz4 "$IMG_NAME"
          sha256sum "$IMG_NAME" > "${IMG_NAME}.sha256"
          echo "IMG_NAME=$IMG_NAME" >> "$GITHUB_ENV"

      - name: Generate Workflow Summary
        if: ${{ always() }}
        shell: bash
        run: |
          ZIP_NAME="${ZIP_NAME:-<tidak terbentuk>}"
          ZIP_SHA="${ZIP_SHA:-<tidak tersedia>}"
          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ### 🚀 Build Summary: ${{ inputs.codename }} (${{ matrix.variant }}) [Clang]
          | Komponen | Status / Nilai |
          |---|---|
          | **Compiler** | \`Neutron Clang 06092026\` |
          | **Variant** | \`${{ matrix.variant }}\` |
          | **Artifact Name** | \`${ZIP_NAME}\` |
          | **SHA-256** | \`${ZIP_SHA}\` |
          EOF

      - name: Fetch Manager APK
        if: ${{ matrix.variant == 'KernelSU-Next' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - << 'EOF'
          import os, json, urllib.request

          token = os.environ.get("GH_TOKEN", "")
          headers = {"User-Agent": "Mozilla/5.0"}
          if token:
              headers["Authorization"] = f"token {token}"

          repo = "KernelSU-Next/KernelSU-Next"

          try:
              req = urllib.request.Request(f"https://api.github.com/repos/{repo}/releases?per_page=1", headers=headers)
              with urllib.request.urlopen(req, timeout=15) as resp:
                  releases = json.loads(resp.read().decode("utf-8"))
              if releases:
                  assets = releases[0].get("assets", [])
                  apks = [a for a in assets if a["name"].endswith(".apk")]
                  for a in apks:
                      print(f"[+] Downloading {a['name']} from {repo}...")
                      try:
                          req_apk = urllib.request.Request(a["browser_download_url"], headers={"User-Agent": "Mozilla/5.0"})
                          with urllib.request.urlopen(req_apk, timeout=30) as resp_apk, open(a["name"], "wb") as f_out:
                              f_out.write(resp_apk.read())
                      except Exception as dl_err:
                          print(f"[!] Warning: Gagal mengunduh {a['name']}: {dl_err}")
          except Exception as e:
              print(f"[!] Warning: Failed to query {repo}: {e}")
          EOF

      - name: Record Upstream SHAs
        # Di akhir + always(): mencatat SHA yang BENAR-BENAR dibangun (bukan tip remote saat
        # step awal), termasuk saat build gagal -- itu justru saat manifest paling berguna.
        if: ${{ always() }}
        shell: bash
        run: |
          python3 - << 'EOF'
          import json, os, subprocess

          def local_head(path):
              if not os.path.isdir(path):
                  return "n/a"
              try:
                  return subprocess.run(
                      ["git", "-C", path, "rev-parse", "HEAD"],
                      capture_output=True, text=True, timeout=30, check=True,
                  ).stdout.strip() or "unknown"
              except Exception as e:
                  print(f"::warning::rev-parse gagal untuk {path}: {e}")
                  return "unknown"

          cfg = os.environ["CONFIG"]
          shas = {
              "kernel_tree_bhazheng": local_head(cfg),
              "KernelSU-Next_pershoot": local_head(cfg + "/KernelSU-Next"),
              "susfs4ksu_pershoot": local_head("susfs4ksu"),
              "nomount_dev": local_head(cfg + "/NoMount"),
          }
          with open("upstream-shas.json", "w") as f:
              json.dump(shas, f, indent=2)
          for k, v in shas.items():
              print(f"[+] {k} = {v}")
          EOF
          cp upstream-shas.json "$GITHUB_WORKSPACE/upstream-shas-${{ matrix.variant }}-clang.json"
          {
            echo "### Upstream SHAs"
            echo ""
            python3 -c "import json; [print('- ' + k + ': ' + v) for k, v in json.load(open('upstream-shas.json')).items()]"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Upstream SHAs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: upstream-shas-${{ inputs.codename }}-${{ matrix.variant }}-clang
          path: |
            ${{ github.workspace }}/upstream-shas-${{ matrix.variant }}-clang.json

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.codename }}-${{ matrix.variant }}-clang
          path: |
            ${{ github.workspace }}/*.zip
            ${{ github.workspace }}/*.sha256
            ${{ github.workspace }}/*-Image.lz4
            !${{ github.workspace }}/*.apk
            !${{ github.workspace }}/NoMount*.zip
            !${{ github.workspace }}/NoMount*.sha256

      - name: Upload NoMount Metamodule Artifact
        if: ${{ inputs.build_nomount && strategy.job-index == 0 }}
        uses: actions/upload-artifact@v4
        with:
          # Satu artefak per run (lihat gate di atas) -> nama tetap, tanpa varian.
          name: NoMount-Metamodule
          path: |
            ${{ github.workspace }}/NoMount.zip
            ${{ github.workspace }}/NoMount.zip.sha256
          if-no-files-found: error

      - name: Upload Manager APK Artifact
        if: ${{ matrix.variant == 'KernelSU-Next' }}
        uses: actions/upload-artifact@v4
        with:
          name: Manager-APK-${{ inputs.codename }}-${{ matrix.variant }}-clang
          path: |
            ${{ github.workspace }}/*.apk
          if-no-files-found: warn

      - name: Collect .rej files
        if: ${{ always() }}
        id: collect_rej
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf rej
          mkdir -p rej
          found="false"
          while IFS= read -r -d '' rej_file; do
            found="true"
            original_file="${rej_file%.rej}"
            rej_rel="${rej_file#./}"
            original_rel="${original_file#./}"
            mkdir -p "rej/$(dirname "$rej_rel")"
            cp -f "$rej_file" "rej/$rej_rel"
            if [[ -f "$original_file" ]]; then
              mkdir -p "rej/$(dirname "$original_rel")"
              cp -f "$original_file" "rej/$original_rel"
            fi
          done < <(find . -type f -name '*.rej' -print0)
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Zip collected .rej bundle
        if: ${{ always() && steps.collect_rej.outputs.found == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          zip -r "rej-${{ inputs.codename }}-${{ matrix.variant }}-clang.zip" rej

      - name: Upload .rej bundle
        if: ${{ always() && steps.collect_rej.outputs.found == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: rej-${{ inputs.codename }}-${{ matrix.variant }}-clang
          path: |
            rej-${{ inputs.codename }}-${{ matrix.variant }}-clang*.zip
