name: Sultan (GCC)
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      codename:
        description: "Device codename (e.g. gs201)"
        required: true
        default: "gs201"
        type: string
      android_version:
        description: "Android version (e.g. android14)"
        required: true
        default: "android14"
        type: string
      kernel_version:
        description: "Kernel version (e.g. 6.1)"
        required: true
        default: "6.1"
        type: string
      apatch_superkey:
        description: "Superkey APatch/KernelPatch (opsional jika secret APATCH_SUPERKEY sudah diisi di repo settings)"
        required: false
        default: ""
        type: string
      variants:
        description: "Varian yang di-build"
        required: false
        default: '["KernelSU-Next", "NoRoot", "APatch"]'
        type: choice
        options:
          - '["KernelSU-Next", "NoRoot", "APatch"]'
          - '["KernelSU-Next"]'
          - '["NoRoot"]'
          - '["APatch"]'
  workflow_call:
    inputs:
      codename:
        required: true
        type: string
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      apatch_superkey:
        required: false
        default: ""
        type: string
      variants:
        description: "Varian yang di-build (JSON array)"
        required: false
        type: string
        default: '["KernelSU-Next", "NoRoot", "APatch"]'

jobs:
  build-kernel-sultan-kernelsu-susfs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}

    steps:
      - name: Validate Inputs
        shell: bash
        run: |
          # Validasi awal: tree kernel bhazheng hanya untuk gs201.
          # Gagal cepat sebelum runner mengunduh toolchain bila codename salah.
          case "${{ inputs.codename }}" in
            gs201)
              echo "[+] Codename gs201 valid (tree bhazheng gs201-only)."
              ;;
            *)
              echo "::error::Codename '${{ inputs.codename }}' tidak didukung! Tree kernel bhazheng hanya untuk gs201."
              exit 1
              ;;
          esac

      - name: Free Disk Space on Runner
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
          sudo docker image prune --all --force
          echo "[+] Disk space cleaned up"

      - name: Install Essential Build Tools
        shell: bash
        run: |
          sudo apt-get update
          # ccache: cache kompilasi (dipasang di sini, dipakai langkah Build).
          sudo apt-get install -y --no-install-recommends libssl-dev libelf-dev bc bison flex perl lz4 ccache

      - name: Download and extract GCC 14.2.0 (Streamed)
        shell: bash
        run: |
          set -euo pipefail
          echo "Streaming and extracting GCC 14.2.0..."
          curl -fsSL "https://www.kernel.org/pub/tools/crosstool/files/bin/x86_64/14.2.0/x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz" | tar -xz

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          # Cache compiler: key per codename+varian+toolchain agar
          # tidak tercampur; restore-keys sebagai fallback prefix codename.
          path: ~/.cache/ccache
          key: ccache-${{ inputs.codename }}-${{ matrix.variant }}-gcc-v1
          restore-keys: |
            ccache-${{ inputs.codename }}-

      - name: Set up Zig Compiler
        uses: jetsung/setup-zig@v0.0.4
        with:
          version: master

      - name: Set CONFIG Environment Variable
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="android_kernel_google_tensynos"
          echo "CONFIG=$CONFIG" >> "$GITHUB_ENV"

      - name: Clone AnyKernel3 and Dependencies (Parallel)
        shell: bash
        run: |
          set -euo pipefail
          echo "[+] Cloning dependencies in parallel..."
          git clone --depth=1 https://github.com/TheWildJames/AnyKernel3.git -b "sultan-${{ inputs.codename }}" &

          # Repositori kernel wajib di-clone penuh (tanpa --depth=1)
          git clone https://github.com/bhazheng/android_kernel_google_tensynos &

          # FS-side dari branch Sultan (50_add rebased untuk tree tensynos;
          # hunk sys.c/readdir/task_mmu mengikuti konteks Sultan). Sisi-KSU tetap
          # glue 10_enable (byte-identik di kedua branch susfs — verifikasi SHA).
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b "sultan-shiba-susfs-minimal" &

          # Tunggu semua clone paralel selesai sebelum langkah berikut.
          wait

      - name: Record Upstream SHAs
        shell: bash
        run: |
          set -euo pipefail
          # Manifest SHA: catat tip tiap sumber upstream
          # agar build dapat direproduksi/diaudit. Warn-only bila sumber gagal dihubungi.
          python3 - << 'EOF'
          import json, os, subprocess

          def ls_remote(url, ref):
              try:
                  out = subprocess.run(
                      ["git", "ls-remote", url, ref],
                      capture_output=True, text=True, timeout=60, check=True,
                  ).stdout.strip()
                  return out.split()[0] if out else "unknown"
              except Exception as e:
                  print(f"::warning::ls-remote gagal untuk {url} {ref}: {e}")
                  return "unknown"

          def local_head(path):
              try:
                  out = subprocess.run(
                      ["git", "-C", path, "rev-parse", "HEAD"],
                      capture_output=True, text=True, timeout=30, check=True,
                  ).stdout.strip()
                  return out if out else "unknown"
              except Exception as e:
                  print(f"::warning::rev-parse gagal untuk {path}: {e}")
                  return "unknown"

          config = os.environ.get("CONFIG", "android_kernel_google_tensynos")
          shas = {
              "kernel_tree_bhazheng": local_head(config),
              "KernelSU-Next_dev": ls_remote("https://github.com/KernelSU-Next/KernelSU-Next.git", "refs/heads/dev"),
              "susfs4ksu_sultan-shiba-susfs-minimal": ls_remote("https://gitlab.com/simonpunk/susfs4ksu.git", "refs/heads/sultan-shiba-susfs-minimal"),
              "nomount_dev": ls_remote("https://github.com/maxsteeel/nomount.git", "refs/heads/dev"),
          }
          with open("upstream-shas.json", "w") as f:
              json.dump(shas, f, indent=2)
          for k, v in shas.items():
              print(f"[+] {k} = {v}")
          EOF
          {
            echo "### Upstream SHAs"
            echo ""
            python3 -c "import json; [print('- ' + k + ': ' + v) for k, v in json.load(open('upstream-shas.json')).items()]"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Upstream SHAs
        uses: actions/upload-artifact@v4
        with:
          name: upstream-shas-${{ inputs.codename }}-${{ matrix.variant }}-gcc
          path: |
            ${{ github.workspace }}/upstream-shas.json

      - name: Add Root Implementation & Version Anchoring
        if: ${{ matrix.variant == 'KernelSU-Next' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"

          # Bersihkan sisa direktori/symlink usang
          rm -rf KernelSU KernelSU-Next drivers/kernelsu drivers/KernelSU
          sed -i '/kernelsu/d' drivers/Makefile 2>/dev/null || true
          sed -i '/kernelsu/d' drivers/Kconfig 2>/dev/null || true

          # Fungsi retry jaringan
          retry() {
            local n=0
            until [ "$n" -ge 5 ]; do
              "$@" && return 0
              n=$((n+1))
              echo "retry $n/5 failed for: $*" >&2
              sleep 5
            done
            return 1
          }

          if [ "${{ matrix.variant }}" == "KernelSU-Next" ]; then
            echo "[+] Adding KernelSU-Next resmi (branch dev)..."
            curl -LSs --retry 5 --retry-delay 5 --retry-all-errors \
              "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
              | bash -s dev
          fi

          # Pastikan registrasi ke Kconfig dan Makefile rapi
          if ! grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
            sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi
          if ! grep -q 'kernelsu' drivers/Makefile; then
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          fi

          # Validasi
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || {
            echo "::error::Gagal mendaftarkan drivers/kernelsu/Kconfig ke drivers/Kconfig!"
            exit 1
          }
          test -e drivers/kernelsu
          test -f drivers/kernelsu/Kconfig || {
            echo "::error::File drivers/kernelsu/Kconfig tidak ditemukan!"
            exit 1
          }

      - name: Apply SUSFS Patches
        if: ${{ matrix.variant == 'KernelSU-Next' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"

          # Resep mandiri: Next resmi `dev` +
          # susfs shiba (50_add + 10_enable) + overlay milik kita.
          # urutan = copy susfs -> 50_add (tree) -> 10_enable (KernelSU-Next)
          # -> overlay (gerbang keras) -> fixer sys-uname (tree).
          # unicode_bypass Next dicakup langkah Optimization (post-50_add);
          # bila 50_add butuh konteks pre-unicode, reject-nya masuk .rej dan
          # dilipat ke overlay pada putaran berikut (loop konvergensi).
          # Target -d "KernelSU-Next" karena path patch berbentuk a/kernel/....
          SUSFS_DIR="../susfs4ksu/kernel_patches"
          KSUN_DIR="KernelSU-Next"

          # SUSFS Common (libs)
          cp "$SUSFS_DIR/fs/"* ./fs/
          cp "$SUSFS_DIR/include/linux/"* ./include/linux/

          patch -p1 < "$SUSFS_DIR/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch" \
            || echo "::warning::50_add_susfs gagal diterapkan, lanjut."

          patch -d "$KSUN_DIR" -p1 < "$SUSFS_DIR/KernelSU/10_enable_susfs_for_ksu.patch" \
            || echo "::warning::10_enable_susfs gagal diterapkan, lanjut (ditutup overlay)."

          # Arsipkan .rej pra-overlay ke rej-pre-overlay/: GNU patch tidak
          # menghapus .rej basi saat invocation berikutnya sukses, sehingga
          # tanpa ini bundle tercampur jejak 10_enable dan atribusi overlay
          # tak terbaca. Pasca-arsip, .rej yang muncul di tree = milik overlay
          # (atau tahap sesudahnya) saja; arsip ikut terkumpul otomatis.
          mkdir -p rej-pre-overlay
          while IFS= read -r -d '' f; do
            rel="${f#./}"
            mkdir -p "rej-pre-overlay/$(dirname "$rel")"
            mv -f "$f" "rej-pre-overlay/$rel"
          done < <(find . -type f -name "*.rej" -print0)

          # Overlay milik kita — fetch dari repo publik agar perbaikan overlay bisa
          # di-update tanpa menyentuh workflow. SHA256 penuh diverifikasi sebelum
          # apply (fail-closed bila tak cocok = drift upload).
          OVERLAY_URL="https://raw.githubusercontent.com/bhazheng/Sultan_KernelSU_SUSFS/refs/heads/main/next-susfs-fixup.patch"
          OVERLAY_SHA="80b493bb33449eb3f4f4569a360d92b7f9e42afbbbffacc9a1e64b41faa76c52"
          OVERLAY_FILE="$GITHUB_WORKSPACE/next-susfs-fixup.patch"
          curl -fsSL --retry 3 "$OVERLAY_URL" -o "$OVERLAY_FILE"
          echo "$OVERLAY_SHA  $OVERLAY_FILE" | sha256sum -c - || {
            echo "::error::Checksum overlay tidak cocok (drift upload?) — build dihentikan."
            exit 1
          }
          patch -d "$KSUN_DIR" -p1 < "$OVERLAY_FILE" || {
            echo "::error::Overlay GAGAL teraplikasi — build dihentikan. Cek artifact .rej."
            exit 1
          }

          # Sys-uname hook (remote, shiba-adapted): wiring susfs_spoof_uname()
          # ke syscall newuname (SPOOF_UNAME default y). Konteks disesuaikan
          # untuk sys.c pasca-50_add shiba (tanpa blok is_gms stock).
          SYSUNAME_URL="https://raw.githubusercontent.com/bhazheng/Sultan_KernelSU_SUSFS/refs/heads/main/sys.c_fix.patch"
          SYSUNAME_SHA="4329ec922cea36af556213e427f2f28c5cbdf348194de8f830ca241c2696b485"
          SYSUNAME_FILE="$GITHUB_WORKSPACE/sys.c_fix.patch"
          curl -fsSL --retry 3 "$SYSUNAME_URL" -o "$SYSUNAME_FILE"
          echo "$SYSUNAME_SHA  $SYSUNAME_FILE" | sha256sum -c - || {
            echo "::error::Checksum sys.c_fix tidak cocok — build dihentikan."
            exit 1
          }
          patch -p1 < "$SYSUNAME_FILE" \
            || echo "::warning::sys.c_fix gagal diterapkan, lanjut."

      - name: Apply Optimization & Network Patches
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"

          REPO="https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common"
          PATCHES=(
            "bbrv3/0001-net-tcp-backport-BBRv3-to-android14-6.1.patch"
            "unicode_bypass_fix_6.1%2B.patch"
            "silence_system_logspam.patch"
            "silence_irq_cpu_logspam.patch"
            "optimise_memcmp.patch"
            "optimized_mem_operations.patch"
            "force_tcp_nodelay.patch"
            "increase_sk_mem_packets.patch"
            "f2fs_reduce_congestion.patch"
            "f2fs_enlarge_min_fsync_blocks.patch"
          )
          for p in "${PATCHES[@]}"; do
            curl -fsSL --retry 3 "$REPO/$p" | patch -p1 --forward || true
          done

      - name: Integrate NoMount
        if: ${{ matrix.variant == 'KernelSU-Next' || matrix.variant == 'APatch' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          KERNEL_DIR="$(pwd)"
          curl -fsSL --retry 3 https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -s dev
          actual_commit="$(git -C "$KERNEL_DIR/NoMount" rev-parse HEAD)"
          [ ! -L "$KERNEL_DIR/fs/nomount" ] && exit 1
          echo "NOMOUNT_COMMIT=$actual_commit" >> "$GITHUB_ENV"

      - name: Build and Package NoMount Metamodule
        if: ${{ matrix.variant == 'KernelSU-Next' || matrix.variant == 'APatch' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          COMMIT_HASH="${NOMOUNT_COMMIT:-$(git ls-remote https://github.com/maxsteeel/nomount.git refs/heads/dev | cut -f1)}"
          SRC_DIR="nomount_src"
          MOD_DIR="nomount_mod"
          ZIP_OUT="NoMount-${COMMIT_HASH}.zip"

          rm -rf "$SRC_DIR" "$MOD_DIR"
          git clone --depth=1 https://github.com/maxsteeel/nomount.git -b dev "$SRC_DIR"
          git -C "$SRC_DIR" checkout "$COMMIT_HASH" || true

          mkdir -p "$SRC_DIR/bin" "$MOD_DIR/bin"
          (
            cd "$SRC_DIR/userspace/src"
            zig cc -target aarch64-linux -Oz -mcmodel=tiny -static -nostdlib -ffreestanding -fno-unwind-tables -fno-ident -Wno-invalid-noreturn -Wl,--entry=_start nm.c -o ../../bin/nm-arm64
            zig cc -target arm-linux -Oz -static -nostdlib -ffreestanding -fno-unwind-tables -fno-ident -Wno-invalid-noreturn -ffunction-sections -fdata-sections -Wl,--gc-sections -Wl,--entry=_start nm.c -o ../../bin/nm-arm
          )
          cp -a "$SRC_DIR/module/." "$MOD_DIR/"
          install -m 0755 "$SRC_DIR/bin/nm-arm64" "$MOD_DIR/bin/nm-arm64"
          install -m 0755 "$SRC_DIR/bin/nm-arm" "$MOD_DIR/bin/nm-arm"
          sed -i "s/^versionCode=.*/versionCode=1/" "$MOD_DIR/module.prop"
          printf '%s\n' "$COMMIT_HASH" > "$MOD_DIR/NOMOUNT_SOURCE_COMMIT"
          (cd "$MOD_DIR" && zip -qr9 "../$ZIP_OUT" .)
          sha256sum "$ZIP_OUT" > "${ZIP_OUT}.sha256"
          rm -rf "$SRC_DIR" "$MOD_DIR"

      - name: Apply Kernel Defconfig Flags
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          
          # ---------------------------------------------------------
          # MANUALLY INJECT DEFCONFIG MENGGUNAKAN BLOK ECHO
          # (Mencegah YAML menambahkan spasi di depan kata "CONFIG_")
          # ---------------------------------------------------------
          {
            echo "CONFIG_TMPFS_XATTR=y"
            echo "CONFIG_TMPFS_POSIX_ACL=y"
            echo "CONFIG_IP_NF_TARGET_TTL=y"
            echo "CONFIG_IP6_NF_TARGET_HL=y"
            echo "CONFIG_IP6_NF_MATCH_HL=y"
            echo "CONFIG_NET_ACT_CONNMARK=y"
            echo "CONFIG_IP_SET=y"
            echo "CONFIG_IP_SET_MAX=65534"
            echo "CONFIG_IP_SET_BITMAP_IP=y"
            echo "CONFIG_IP_SET_BITMAP_IPMAC=y"
            echo "CONFIG_IP_SET_BITMAP_PORT=y"
            echo "CONFIG_IP_SET_HASH_IP=y"
            echo "CONFIG_IP_SET_HASH_IPMARK=y"
            echo "CONFIG_IP_SET_HASH_IPPORT=y"
            echo "CONFIG_IP_SET_HASH_IPPORTIP=y"
            echo "CONFIG_IP_SET_HASH_IPPORTNET=y"
            echo "CONFIG_IP_SET_HASH_IPMAC=y"
            echo "CONFIG_IP_SET_HASH_MAC=y"
            echo "CONFIG_IP_SET_HASH_NETPORTNET=y"
            echo "CONFIG_IP_SET_HASH_NET=y"
            echo "CONFIG_IP_SET_HASH_NETNET=y"
            echo "CONFIG_IP_SET_HASH_NETPORT=y"
            echo "CONFIG_IP_SET_HASH_NETIFACE=y"
            echo "CONFIG_IP_SET_LIST_SET=y"
            echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
            echo "CONFIG_NETFILTER_XT_SET=y"
            echo "CONFIG_NETFILTER_XT_TARGET_LOG=y"
            echo "CONFIG_NETFILTER_XT_MATCH_RECENT=y"
            echo "CONFIG_IP6_NF_NAT=y"
            echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y"
            echo "CONFIG_TCP_CONG_ADVANCED=y"
            echo "CONFIG_TCP_CONG_BBR=y"
            echo "CONFIG_TCP_CONG_BBR3=y"
            echo "CONFIG_TCP_CONG_CUBIC=y"
            echo "CONFIG_TCP_CONG_BIC=y"
            echo "CONFIG_TCP_CONG_WESTWOOD=y"
            echo "CONFIG_TCP_CONG_HTCP=y"
            echo "CONFIG_DEFAULT_BBR3=y"
            echo "CONFIG_DEFAULT_TCP_CONG=\"bbr3\""
            echo "CONFIG_NET_SCH_FQ=y"
            echo "CONFIG_NET_SCH_FQ_CODEL=y"
            echo "CONFIG_NET_SCH_CAKE=y"
            echo "CONFIG_NETWORK_FILESYSTEMS=y"
            echo "CONFIG_NETFS_SUPPORT=y"
            echo "CONFIG_KEYS=y"
            echo "CONFIG_CIFS=y"
            echo "CONFIG_CIFS_XATTR=y"
            echo "CONFIG_CIFS_POSIX=y"
            # NOTE (Sultan): KPROBES sengaja TIDAK diset. gs201_defconfig
            # memuat CONFIG_INTEGRATE_MODULES=y, dan kernel/module/Kconfig
            # memaksa `menuconfig MODULES depends on !INTEGRATE_MODULES`,
            # sedangkan arch/Kconfig memaksa `config KPROBES depends on MODULES`.
            # Jadi KPROBES tak pernah bisa aktif di kernel ini dan olddefconfig
            # selalu mencoretnya. KernelSU-Next tidak butuh KPROBES:
            # 10_enable_susfs_for_ksu.patch upstream menghapus depends KPROBES
            # dari Kconfig KSU, dan fix v2.2.0 memaksa mode Inline (SuSFS).
            # Jangan mengembalikan baris KPROBES di sini.
            echo "CONFIG_THREAD_INFO_IN_TASK=y"
            echo "CONFIG_DEBUG_KERNEL=y"
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
            echo "CONFIG_OVERLAY_FS=y"
            echo "CONFIG_FUSE_FS=y"
            echo "CONFIG_BPF_SYSCALL=y"
            echo "CONFIG_FUSE_BPF=y"
          } >> "./arch/arm64/configs/${{ inputs.codename }}_defconfig"

          # NoMount kompatibel dengan APatch (customize.sh mendukung $APATCH=true;
          # nomount.c nol dependensi KSU/SUSFS) — hanya NoRoot yang melewatinya.
          if [ "${{ matrix.variant }}" == "KernelSU-Next" ] || [ "${{ matrix.variant }}" == "APatch" ]; then
            {
              echo "CONFIG_NOMOUNT=y"
            } >> "./arch/arm64/configs/${{ inputs.codename }}_defconfig"
          else
            echo "[*] Varian ${{ matrix.variant }} — injeksi CONFIG_NOMOUNT dilewati."
          fi
          # Simbol KSU/SUSFS — hanya untuk KernelSU-Next
          # (NoRoot/APatch tidak membawa drivers/kernelsu maupun patch SUSFS):
          # KSU + SUSFS aktif, SUS_SU dimatikan eksplisit, sisanya default upstream.
          if [ "${{ matrix.variant }}" == "KernelSU-Next" ]; then
            {
              echo "CONFIG_KSU=y"
              echo "CONFIG_KSU_SUSFS_SUS_SU=n"
              echo "CONFIG_KSU_SUSFS=y"
            } >> "./arch/arm64/configs/${{ inputs.codename }}_defconfig"
          else
            echo "[*] Varian ${{ matrix.variant }} — injeksi KSU/SUSFS dilewati (tanpa KSU)."
          fi

          sed -i "s/CONFIG_LOCALVERSION=\"-Sultan\"/CONFIG_LOCALVERSION=\"-Sultan-${{ matrix.variant }}\"/" ./arch/arm64/configs/${{ inputs.codename }}_defconfig
          sed -i 's/CONFIG_LOCALVERSION_AUTO=y/CONFIG_LOCALVERSION_AUTO=n/' ./arch/arm64/configs/${{ inputs.codename }}_defconfig || true
          sed -i '/echo "+"$/d' scripts/setlocalversion
          sed -i 's/scm_version="-dirty"/scm_version=""/' scripts/setlocalversion 2>/dev/null || true

      - name: Build the Kernel
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"

          export ARCH=arm64
          export SUBARCH=arm64

          TOOLCHAIN_PREFIX="$GITHUB_WORKSPACE/gcc-14.2.0-nolibc/aarch64-linux/bin/aarch64-linux-"
          # ccache: bungkus compiler via wrapper script (tanpa spasi)
          # karena spasi dalam string MAKE_ARGS tidak dikutip ulang saat ekspansi
          # `make $MAKE_ARGS` — CC="ccache ..." langsung akan pecah jadi target make.
          export CCACHE_DIR="$HOME/.cache/ccache"
          export CCACHE_MAXSIZE=2G
          mkdir -p "$HOME/.ccache-bin"
          printf '#!/bin/sh\nexec ccache "%s" "$@"\n' "${TOOLCHAIN_PREFIX}gcc" > "$HOME/.ccache-bin/aarch64-linux-gcc"
          chmod +x "$HOME/.ccache-bin/aarch64-linux-gcc"
          CC_COMPILER="$HOME/.ccache-bin/aarch64-linux-gcc"
          export KCFLAGS="-Wno-error=designated-init -Wno-designated-init -Wno-unused-value -Wno-error=unused-value"
          MAKE_ARGS="CC=$CC_COMPILER CROSS_COMPILE=$TOOLCHAIN_PREFIX"

          # Bersihkan file .config di root source tree agar out-of-tree build Sultan (out/) tidak melempar error mrproper
          rm -f .config

          # 1. Defconfig dasar (Sultan Makefile otomatis mengarahkan output build ke out/)
          make $MAKE_ARGS -j$(nproc --all) ${{ inputs.codename }}_defconfig

          # Deteksi file config aktif (Sultan Makefile menaruhnya di out/.config)
          CONFIG_FILE="out/.config"
          if [ ! -f "$CONFIG_FILE" ]; then
            CONFIG_FILE=".config"
          fi

          # 2. Injeksi mutlak konfigurasi ke target config yang aktif
          # (tanpa KPROBES/HAVE_KPROBES/KRETPROBES/KPROBE_EVENTS — lihat NOTE di atas;
          # HAVE_KPROBES adalah simbol select-only milik arch, bukan untuk diset manual.
          # Blok KSU: paksa KSU + SUSFS aktif, SUS_SU mati
          # (koheren dengan blok defconfig minimal di atas; sisanya default upstream).
          # Blok KSU hanya untuk varian root — NoRoot/APatch tidak ada drivers/kernelsu di tree.)
          if [ "${{ matrix.variant }}" == "KernelSU-Next" ]; then
            ./scripts/config --file "$CONFIG_FILE" \
              -e CONFIG_KSU \
              -e CONFIG_KSU_SUSFS \
              -d CONFIG_KSU_SUSFS_SUS_SU
          else
            echo "[*] Varian ${{ matrix.variant }} — injeksi CONFIG_KSU dilewati (tanpa root)."
          fi
          ./scripts/config --file "$CONFIG_FILE" \
            -e CONFIG_THREAD_INFO_IN_TASK \
            -e CONFIG_DEBUG_KERNEL \
            -e CONFIG_KALLSYMS \
            -e CONFIG_KALLSYMS_ALL \
            -e CONFIG_OVERLAY_FS \
            -e CONFIG_FUSE_FS \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_FUSE_BPF

          echo "=== CONFIG_KSU (& status KPROBES/MODULES) sebelum olddefconfig ==="
          grep -E "CONFIG_(KSU|KPROBES|KRETPROBES|MODULES|INTEGRATE_MODULES)" "$CONFIG_FILE" || true

          # Pastikan tidak ada file .config di root source tree sebelum make dipanggil
          if [ "$CONFIG_FILE" != ".config" ]; then
            rm -f .config
          fi

          make $MAKE_ARGS olddefconfig 2>&1 | tee /tmp/olddefconfig.log

          echo "=== CONFIG_KSU (& status KPROBES/MODULES) setelah olddefconfig ==="
          grep -E "CONFIG_(KSU|KPROBES|KRETPROBES|MODULES|INTEGRATE_MODULES)" "$CONFIG_FILE" || true

          echo "========== Cek CONFIG_KSU setelah olddefconfig =========="
          MISSING=0
          # KPROBES ekspektasinya NONAKTIF di Sultan: INTEGRATE_MODULES=y
          # menonaktifkan MODULES, dan KPROBES depends on MODULES.
          # Ini bukan error — KernelSU-Next memakai SUSFS inline hook.
          if grep -q "^CONFIG_KPROBES=y" "$CONFIG_FILE"; then
            echo "::warning::CONFIG_KPROBES aktif (tak terduga di Sultan; INTEGRATE_MODULES mungkin mati)."
          else
            echo "::notice::CONFIG_KPROBES nonaktif — ekspektasi Sultan (INTEGRATE_MODULES=y => MODULES=n => KPROBES=n)."
          fi
          # Varian non-root (NoRoot/APatch) tidak membawa KSU — pemeriksaan ini dilewati
          # (ketidakhadiran KSU justru ekspektasi yang benar).
          if [ "${{ matrix.variant }}" == "KernelSU-Next" ]; then
            if ! grep -q "^CONFIG_KSU=y" "$CONFIG_FILE"; then
              echo "::error::CONFIG_KSU tidak aktif setelah olddefconfig!"
              MISSING=1
            fi
            if ! grep -q "^CONFIG_KSU_SUSFS=y" "$CONFIG_FILE"; then
              echo "::error::CONFIG_KSU_SUSFS tidak aktif setelah olddefconfig!"
              MISSING=1
            fi
          else
            echo "::notice::Varian ${{ matrix.variant }} — pemeriksaan CONFIG_KSU dilewati (tanpa root)."
          fi
          if ! grep -q "^CONFIG_KALLSYMS_ALL=y" "$CONFIG_FILE"; then
            echo "::warning::CONFIG_KALLSYMS_ALL tidak aktif, menginjeksi langsung ke $CONFIG_FILE..."
            ./scripts/config --file "$CONFIG_FILE" -e CONFIG_DEBUG_KERNEL -e CONFIG_KALLSYMS -e CONFIG_KALLSYMS_ALL
            make $MAKE_ARGS olddefconfig
          fi
          if [ $MISSING -eq 1 ]; then
            grep -i "ksu" /tmp/olddefconfig.log || true
            exit 1
          fi

          # 3. Kompilasi Paralel
          make $MAKE_ARGS LOCALVERSION_AUTO=0 -j$(nproc --all) Image.lz4 dtbs || {
            echo "::error::Build paralel gagal. Melacak via single-thread:"
            make $MAKE_ARGS LOCALVERSION_AUTO=0 -j1 Image.lz4 dtbs
            exit 1
          }

          # Statistik ccache untuk log (tak menggagalkan build).
          ccache -s || true

      - name: Embed KernelPatch for APatch
        if: ${{ matrix.variant == 'APatch' }}
        shell: bash
        env:
          APATCH_KEY_SECRET: ${{ secrets.APATCH_SUPERKEY }}
          APATCH_KEY_INPUT: ${{ inputs.apatch_superkey }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Superkey: secret APATCH_SUPERKEY > input apatch_superkey > gagal eksplisit.
          # Key TIDAK PERNAH di-echo ke log (tidak ada set -x di langkah ini) dan
          # didaftarkan sebagai masker agar tak bocor bila terbawa output tool.
          SUPERKEY="${APATCH_KEY_SECRET:-}"
          if [ -z "$SUPERKEY" ]; then
            SUPERKEY="${APATCH_KEY_INPUT:-}"
          fi
          if [ -z "$SUPERKEY" ]; then
            echo "::error::Superkey APatch kosong! Isi secret APATCH_SUPERKEY di repo settings atau input apatch_superkey."
            exit 1
          fi
          echo "::add-mask::$SUPERKEY"
          echo "[+] Superkey diterima (disembunyikan dari log)."

          retry() {
            local n=0
            until [ "$n" -ge 5 ]; do
              "$@" && return 0
              n=$((n+1))
              echo "retry $n/5 failed for: $*" >&2
              sleep 5
            done
            return 1
          }

          # Unduh kptools-linux + kpimg-android dari rilis STABIL terbaru
          # bmax121/KernelPatch (mendukung 6.1) via GitHub API.
          # Catatan: rilis tidak menyertakan biner `kpatch`, dan sintaks kanonis
          # kptools memang tanpa flag -K — jadi hanya dua asset ini yang wajib.
          TOOLS_DIR="$GITHUB_WORKSPACE/kptools"
          mkdir -p "$TOOLS_DIR"
          cd "$TOOLS_DIR"
          retry python3 - << 'EOF'
          import os, sys, json, urllib.request

          token = os.environ.get("GH_TOKEN", "")
          headers = {"User-Agent": "Mozilla/5.0", "Accept": "application/vnd.github+json"}
          if token:
              headers["Authorization"] = f"Bearer {token}"

          try:
              req = urllib.request.Request("https://api.github.com/repos/bmax121/KernelPatch/releases?per_page=10", headers=headers)
              with urllib.request.urlopen(req, timeout=20) as resp:
                  releases = json.loads(resp.read().decode("utf-8"))
          except Exception as e:
              print(f"::error::Gagal membaca daftar rilis KernelPatch: {e}")
              sys.exit(1)

          stable = [r for r in releases if not r.get("prerelease") and not r.get("draft")]
          if not stable:
              print("::error::Tidak ada rilis stabil KernelPatch!")
              sys.exit(1)
          rel = stable[0]
          print(f"[+] KernelPatch {rel.get('tag_name')} — {rel.get('name')}")
          assets = rel.get("assets", [])

          def find(exact, *subs):
              for a in assets:
                  if a["name"] == exact:
                      return a
              for a in assets:
                  n = a["name"].lower()
                  if all(s in n for s in subs):
                      return a
              return None

          kt = find("kptools-linux", "kptools", "linux")
          ki = find("kpimg-android", "kpimg")
          missing = [label for obj, label in ((kt, "kptools-linux"), (ki, "kpimg-android")) if obj is None]
          if missing:
              print(f"::error::Asset KernelPatch tidak ditemukan: {', '.join(missing)}")
              print("Asset tersedia: " + ", ".join(a["name"] for a in assets))
              sys.exit(1)

          def dl(asset, dest):
              req = urllib.request.Request(asset["browser_download_url"], headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=120) as r, open(dest, "wb") as f:
                  f.write(r.read())
              print(f"[+] {asset['name']} -> {dest}")

          try:
              dl(kt, "kptools")
              dl(ki, "kpimg")
          except Exception as e:
              print(f"::error::Gagal mengunduh asset KernelPatch: {e}")
              sys.exit(1)
          EOF
          chmod +x "$TOOLS_DIR/kptools"
          echo "--- versi kptools (diagnostik, tanpa key) ---"
          "$TOOLS_DIR/kptools" -h 2>&1 | head -40 || true

          # Patch file Image MENTAH hasil build (kptools bekerja pada image tanpa
          # kompresi). Image.lz4 basi dihapus agar langkah ZIP kompres ulang dari
          # Image yang sudah ter-patch.
          cd "$GITHUB_WORKSPACE/$CONFIG"
          IMAGE=""
          for f in "out/arch/arm64/boot/Image" "arch/arm64/boot/Image"; do
            if [ -s "$f" ]; then
              IMAGE="$f"
              break
            fi
          done
          if [ -z "$IMAGE" ]; then
            echo "::error::File Image mentah tidak ditemukan (out/arch/arm64/boot/Image)!"
            exit 1
          fi
          echo "=== Diagnostik pra-kptools (Image mentah) ==="
          ls -la "$IMAGE" || true
          stat -c "size=%s bytes" "$IMAGE" || true
          file "$IMAGE" || true
          head -c 64 "$IMAGE" | od -A x -t x1z || true
          echo "[+] Patching $IMAGE dengan KernelPatch..."
          "$TOOLS_DIR/kptools" -p -i "$IMAGE" -S "$SUPERKEY" -k "$TOOLS_DIR/kpimg" -o "$IMAGE.patched"
          if [ ! -s "$IMAGE.patched" ]; then
            echo "::error::kptools gagal menghasilkan Image ter-patch!"
            exit 1
          fi
          mv -f "$IMAGE.patched" "$IMAGE"
          rm -f "$(dirname "$IMAGE")/Image.lz4"
          echo "[+] KernelPatch tertanam ke $IMAGE (Image.lz4 basi dihapus; langkah ZIP akan kompres ulang)."

      - name: Copy Images & Create ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          if [ -f ./out/arch/arm64/boot/Image.lz4 ]; then
            cp ./out/arch/arm64/boot/Image.lz4 ../AnyKernel3/Image.lz4
          elif [ -f ./out/arch/arm64/boot/Image ]; then
            lz4 -9 -f ./out/arch/arm64/boot/Image ../AnyKernel3/Image.lz4
          elif [ -f ./arch/arm64/boot/Image.lz4 ]; then
            cp ./arch/arm64/boot/Image.lz4 ../AnyKernel3/Image.lz4
          elif [ -f ./arch/arm64/boot/Image ]; then
            lz4 -9 -f ./arch/arm64/boot/Image ../AnyKernel3/Image.lz4
          fi

          DTB_FOUND=0
          for dtb_dir in "./out/google-devices/${{ inputs.codename }}/dts" "./out/arch/arm64/boot/dts" "./google-devices/${{ inputs.codename }}/dts" "./arch/arm64/boot/dts/google-devices/${{ inputs.codename }}/dts" "./arch/arm64/boot/dts"; do
            if compgen -G "${dtb_dir}/*.dtb" > /dev/null; then
              cat ${dtb_dir}/*.dtb > ../AnyKernel3/dtb
              DTB_FOUND=1
              break
            fi
          done
          if [ $DTB_FOUND -eq 0 ]; then
            find out -name "*.dtb" -exec cat {} + > ../AnyKernel3/dtb 2>/dev/null || true
          fi

          if [ ! -f ../AnyKernel3/Image.lz4 ]; then
            echo "::error::Image.lz4 tidak ditemukan!"
            exit 1
          fi
          if [ ! -s ../AnyKernel3/dtb ]; then
            echo "::error::dtb tidak ditemukan atau kosong!"
            exit 1
          fi

          cd ../AnyKernel3
          ZIP_NAME="${{ matrix.variant }}-${{ inputs.codename }}-A16-Sultan-gcc.zip"
          zip -qr9 "../$ZIP_NAME" . -x '.git/*' -x '.github/*' -x '*.zip' -x 'README.md'
          cd ..
          sha256sum "$ZIP_NAME" > "${ZIP_NAME}.sha256"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "ZIP_SHA=$(cat ${ZIP_NAME}.sha256 | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Generate Workflow Summary
        if: ${{ always() }}
        shell: bash
        run: |
          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ### 🚀 Build Summary: ${{ inputs.codename }} (${{ matrix.variant }}) [GCC]
          | Komponen | Status / Nilai |
          |---|---|
          | **Compiler** | `GCC 14.2.0 (AArch64)` |
          | **Variant** | `${{ matrix.variant }}` |
          | **Artifact Name** | `${{ env.ZIP_NAME }}` |
          | **SHA-256** | \`${{ env.ZIP_SHA }}\` |
          EOF

      - name: Fetch Manager APK
        if: ${{ matrix.variant == 'KernelSU-Next' || matrix.variant == 'APatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - << 'EOF'
          import os, json, urllib.request

          token = os.environ.get("GH_TOKEN", "")
          headers = {"User-Agent": "Mozilla/5.0"}
          if token:
              headers["Authorization"] = f"token {token}"

          variant = os.environ.get("VARIANT", "")
          if variant == "APatch":
              repo = "bmax121/APatch"
          else:
              repo = "KernelSU-Next/KernelSU-Next"

          try:
              req = urllib.request.Request(f"https://api.github.com/repos/{repo}/releases?per_page=1", headers=headers)
              with urllib.request.urlopen(req, timeout=15) as resp:
                  releases = json.loads(resp.read().decode("utf-8"))
              if releases:
                  assets = releases[0].get("assets", [])
                  apks = [a for a in assets if a["name"].endswith(".apk")]
                  for a in apks:
                      print(f"[+] Downloading {a['name']} from {repo}...")
                      try:
                          req_apk = urllib.request.Request(a["browser_download_url"], headers={"User-Agent": "Mozilla/5.0"})
                          with urllib.request.urlopen(req_apk, timeout=30) as resp_apk, open(a["name"], "wb") as f_out:
                              f_out.write(resp_apk.read())
                      except Exception as dl_err:
                          print(f"[!] Warning: Gagal mengunduh {a['name']}: {dl_err}")
          except Exception as e:
              print(f"[!] Warning: Failed to fetch manager APK: {e}")
          EOF

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.codename }}-${{ matrix.variant }}-gcc
          path: |
            ${{ github.workspace }}/*.zip
            ${{ github.workspace }}/*.sha256
            !${{ github.workspace }}/*.apk
            !${{ github.workspace }}/NoMount-*.zip
            !${{ github.workspace }}/NoMount-*.sha256

      - name: Upload NoMount Metamodule Artifact
        if: ${{ matrix.variant == 'KernelSU-Next' || matrix.variant == 'APatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: NoMount-Metamodule-${{ inputs.codename }}-${{ matrix.variant }}-gcc
          path: |
            ${{ github.workspace }}/NoMount-*.zip
            ${{ github.workspace }}/NoMount-*.sha256

      - name: Upload Manager APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Manager-APK-${{ inputs.codename }}-${{ matrix.variant }}-gcc
          path: |
            ${{ github.workspace }}/*.apk
          if-no-files-found: warn

      - name: Collect .rej files
        if: ${{ always() }}
        id: collect_rej
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf rej
          mkdir -p rej
          found="false"
          while IFS= read -r -d '' rej_file; do
            found="true"
            original_file="${rej_file%.rej}"
            rej_rel="${rej_file#./}"
            original_rel="${original_file#./}"
            mkdir -p "rej/$(dirname "$rej_rel")"
            cp -f "$rej_file" "rej/$rej_rel"
            if [[ -f "$original_file" ]]; then
              mkdir -p "rej/$(dirname "$original_rel")"
              cp -f "$original_file" "rej/$original_rel"
            fi
          done < <(find . -type f -name '*.rej' -print0)
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Zip collected .rej bundle
        if: ${{ always() && steps.collect_rej.outputs.found == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          zip -r "rej-${{ inputs.codename }}-${{ matrix.variant }}-gcc.zip" rej

      - name: Upload .rej bundle
        if: ${{ always() && steps.collect_rej.outputs.found == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: rej-${{ inputs.codename }}-${{ matrix.variant }}-gcc
          path: |
            rej-${{ inputs.codename }}-${{ matrix.variant }}-gcc*.zip
