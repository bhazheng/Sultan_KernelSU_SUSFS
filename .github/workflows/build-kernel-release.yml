name: Build and Release GS201 Kernels

permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: write   # Allows triggering actions

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Kernel version / source tree to build"
        required: false
        default: "6.12"
        type: choice
        options:
          - "6.12"
          - "6.1"
          - "both"
      variants:
        description: "Varian yang di-build"
        required: false
        default: '["KernelSU-Next"]'
        type: choice
        options:
          - '["KernelSU-Next"]'
          - '["KernelSU-Next", "NoRoot"]'
          - '["NoRoot"]'
jobs:
  build-kernel-gs201-612-clang:
    if: ${{ inputs.kernel_version == 'both' || inputs.kernel_version == '6.12' }}
    uses: ./.github/workflows/sidharthify-clang.yml
    secrets: inherit
    with:
      codename: "gs201"
      variants: ${{ inputs.variants }}

  build-kernel-gs201-61-clang:
    if: ${{ inputs.kernel_version == 'both' || inputs.kernel_version == '6.1' }}
    uses: ./.github/workflows/sultan-clang.yml
    secrets: inherit
    with:
      codename: "gs201"
      variants: ${{ inputs.variants }}
  trigger-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: |
      always() &&
      contains(needs.*.result, 'success') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    needs:
      - build-kernel-gs201-612-clang
      - build-kernel-gs201-61-clang
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      RELEASE_TAG: "latest"
      RELEASE_NAME: "Google Tensor gs201 Kernels (6.12 & 6.1) + SUSFS + KernelSU-Next"
      RELEASE_NOTES: |
        Automated CI release for Google Tensor gs201 (Pixel 7 / 7 Pro / 7a).
        
        ⚠️ **COMPATIBILITY NOTICE** ⚠️
        - **Linux 6.12 (Sidharthify)**: Designed for Android 16 (and 15+ compatible ROMs).
        - **Linux 6.1 (Sultan)**: Designed for Android 14 / 15.
        
        **Kernel Trees:**
        - 6.12: https://github.com/sidharthify/android_kernel_google_gs201 (branch 6.12-test)
        - 6.1: https://github.com/bhazheng/android_kernel_google_tensynos (branch android14-6.1.145)
        
        **Variants:**
        - `KernelSU-Next`: Root enabled with SuSFS v2.3.0 inline hooks + NoMount metamodule.
        - `NoRoot`: Clean performance kernel with NoMount + BBR/BBRv3 (no root).
        
        **Modules & Tooling:**
        - SuSFS Module: https://github.com/sidex15/ksu_module_susfs
        - NoMount Metamodule: attached `NoMount.zip` (universal)
        - Manager: https://github.com/KernelSU-Next/KernelSU-Next
        
        **Features Included:**
        [+] KernelSU-Next (pershoot dev-susfs)
        [+] SuSFS v2.3.0 Inline Hooks
        [+] NoMount VFS Redirection Framework
        [+] BBR / BBRv3 TCP Congestion Control (FQ/CAKE)
        [+] NTSync (Wine/Proton gaming synchronization)
        [+] Advanced IPSet, WireGuard & Firewall Netfilter extensions

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded-artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          find ./downloaded-artifacts -type f -exec cp -f {} release-assets/ \;
          echo "Files prepared for release:"
          ls -la release-assets/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_NOTES }}
          draft: false
          prerelease: false
          make_latest: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
