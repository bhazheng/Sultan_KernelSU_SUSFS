name: Build and Release Sultan Kernels

permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: write   # Allows triggering actions
  
on:
  workflow_dispatch:
    inputs:
      variants:
        description: "Varian yang di-build"
        required: false
        default: '["KernelSU-Next"]'
        type: choice
        options:
          - '["KernelSU-Next"]'
          - '["KernelSU-Next", "NoRoot"]'
          - '["NoRoot"]'
      toolchain:
        description: "Toolchain yang dipakai"
        required: false
        default: "both"
        type: choice
        options:
          - "both"
          - "gcc"
          - "clang"

jobs:
  build-kernel-gs201-gcc:
    if: ${{ inputs.toolchain == 'both' || inputs.toolchain == 'gcc' }}
    uses: ./.github/workflows/sultan-gcc.yml
    secrets: inherit
    with:
      codename: "gs201"
      variants: ${{ inputs.variants }}

  build-kernel-gs201-clang:
    if: ${{ inputs.toolchain == 'both' || inputs.toolchain == 'clang' }}
    uses: ./.github/workflows/sultan-clang.yml
    secrets: inherit
    with:
      codename: "gs201"
      variants: ${{ inputs.variants }}

  trigger-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: |
      always() &&
      contains(needs.*.result, 'success') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    needs:
      - build-kernel-gs201-gcc
      - build-kernel-gs201-clang
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      RELEASE_TAG: "latest"
      RELEASE_NAME: "Sultan Kernels (KernelSU-Next / NoRoot) + SUSFS"
      RELEASE_NOTES: |
        This release contains Sultan gs201 kernels in 2 variants (KernelSU-Next & NoRoot) + NoMount metamodule.
        
        ⚠️ **COMPATIBILITY NOTICE** ⚠️
        Please ensure compatibility!
        
        Variants:
        -> KernelSU-Next + SUSFS (inline hook)
        -> NoRoot (clean Sultan, no root)
        
        Module: 
        -> https://github.com/sidex15/ksu_module_susfs
        -> NoMount metamodule (attached; for all variants)
        
        Managers & Tooling:
        -> https://github.com/pershoot/KernelSU-Next (Next)
        
        Features:
        [+] KernelSU-Next
        [+] SUSFS (Next)
        [+] NoMount (Next / NoRoot)
        [+] Westwood (Default) & BBR
        [+] NTSync

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4


      # Download Artifacts
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded-artifacts

      # Flatten and Prepare Release Assets
      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          find ./downloaded-artifacts -type f -exec cp -f {} release-assets/ \;
          echo "Files prepared for release:"
          ls -la release-assets/

      # Publish to GitHub Releases (Using softprops/action-gh-release@v2 like in talenta)
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_NOTES }}
          draft: false
          prerelease: false
          make_latest: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
