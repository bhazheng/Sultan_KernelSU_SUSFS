name: Build and Release Sultan Kernels

permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: write   # Allows triggering actions
  
on:
  workflow_dispatch:
    inputs:
      variants:
        description: "Varian yang di-build"
        required: false
        default: '["KernelSU-Next"]'
        type: choice
        options:
          - '["KernelSU-Next"]'
          - '["KernelSU-Next", "NoRoot"]'
          - '["NoRoot"]'
      toolchain:
        description: "Toolchain yang dipakai"
        required: false
        default: "both"
        type: choice
        options:
          - "both"
          - "gcc"
          - "clang"

jobs:
  build-kernel-gs201-gcc:
    if: ${{ inputs.toolchain == 'both' || inputs.toolchain == 'gcc' }}
    uses: ./.github/workflows/sultan-gcc.yml
    secrets: inherit
    with:
      codename: "gs201"
      kernel_version: "6.1"
      variants: ${{ inputs.variants }}

  build-kernel-gs201-clang:
    if: ${{ inputs.toolchain == 'both' || inputs.toolchain == 'clang' }}
    uses: ./.github/workflows/sultan-clang.yml
    secrets: inherit
    with:
      codename: "gs201"
      kernel_version: "6.1"
      variants: ${{ inputs.variants }}

  trigger-release:
    runs-on: ubuntu-latest
    if: |
      always() &&
      contains(needs.*.result, 'success') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    needs:
      - build-kernel-gs201-gcc
      - build-kernel-gs201-clang
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: "latest"
      RELEASE_NAME: "Sultan Kernels (KernelSU-Next / NoRoot) + SUSFS"
      RELEASE_NOTES: |
        This release contains Sultan gs201 kernels in 2 variants (KernelSU-Next & NoRoot) + NoMount metamodule.
        
        ⚠️ **COMPATIBILITY NOTICE** ⚠️
        Please ensure compatibility!
        
        Variants:
        -> KernelSU-Next + SUSFS (inline hook)
        -> NoRoot (clean Sultan, no root)
        
        Module: 
        -> https://github.com/sidex15/ksu_module_susfs
        -> NoMount metamodule (attached; for all variants)
        
        Managers & Tooling:
        -> https://github.com/pershoot/KernelSU-Next (Next)
        
        Features:
        [+] KernelSU-Next
        [+] SUSFS (Next)
        [+] NoMount (Next / NoRoot)
        [+] BBRV3

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Clean up previous releases so there is strictly 1 release
      - name: Clean up Old Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[+] Deleting existing releases to keep only 1 release..."
          for old_tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null); do
            echo "Deleting release: $old_tag"
            gh release delete "$old_tag" --yes --cleanup-tag 2>/dev/null || true
          done
          git push origin ":refs/tags/${RELEASE_TAG}" 2>/dev/null || true

      # Download Artifacts
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded-artifacts

      # Create Single GitHub Release
      - name: Create Single GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[+] Creating fresh release ${RELEASE_TAG}..."
          gh release create "${RELEASE_TAG}" \
            --target "${{ github.sha }}" \
            --title "${RELEASE_NAME}" \
            --notes "${RELEASE_NOTES}"

      # Upload Release Assets Dynamically
      - name: Upload Release Assets Dynamically
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Loop through all files in the downloaded-artifacts directory
          for file in ./downloaded-artifacts/*/*; do
              # Skip non-files
              if [ ! -f "$file" ]; then
                  continue
              fi

              # Upload the file to the GitHub release with --clobber to overwrite duplicate files safely
              echo "Uploading $file..."
              gh release upload "${RELEASE_TAG}" "$file" --clobber
          done

      # Display Files Uploaded
      - name: Display Files Uploaded
        run: |
          echo "GitHub release created with the following files:"
          find ./downloaded-artifacts -type f
