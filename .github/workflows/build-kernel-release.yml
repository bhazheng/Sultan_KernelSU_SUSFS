name: Build and Release GS201 Kernels

# Least privilege: job build hanya membaca repo. Hanya job trigger-release yang butuh
# contents: write (membuat/mengubah rilis) dan mendeklarasikannya sendiri di bawah.
permissions:
  contents: read

# Satu rilis "latest" pada satu waktu: dua run bersamaan akan saling menimpa aset rilis.
concurrency:
  group: release-latest
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Kernel version / source tree to build"
        required: false
        default: "6.12"
        type: choice
        options:
          - "6.12"
          - "6.1"
          - "both"
      variants:
        description: "Varian yang di-build"
        required: false
        default: '["KernelSU-Next"]'
        type: choice
        options:
          - '["KernelSU-Next"]'
          - '["KernelSU-Next", "NoRoot"]'
          - '["NoRoot"]'
      debug_panic:
        description: "6.12: panic on oops / hung task / soft lockup (capture ramoops untuk bring-up). Matikan untuk rilis daily-driver."
        required: false
        default: true
        type: boolean
      rust_binder:
        description: "6.12: bangun juga rust_binder.ko (=m) dari build kernel yang sama; dipakai hanya dengan binder.impl=rust di cmdline."
        required: false
        default: false
        type: boolean

jobs:
  build-kernel-gs201-612-clang:
    if: ${{ inputs.kernel_version == 'both' || inputs.kernel_version == '6.12' }}
    uses: ./.github/workflows/sidharthify-clang.yml
    secrets: inherit
    with:
      codename: "gs201"
      variants: ${{ inputs.variants }}
      debug_panic: ${{ inputs.debug_panic }}
      rust_binder: ${{ inputs.rust_binder }}
      # NoMount metamodule dibangun SEKALI per run: oleh 6.12 bila ikut dibangun, selain itu oleh 6.1.
      build_nomount: true

  build-kernel-gs201-61-clang:
    if: ${{ inputs.kernel_version == 'both' || inputs.kernel_version == '6.1' }}
    uses: ./.github/workflows/sultan-clang.yml
    secrets: inherit
    with:
      codename: "gs201"
      variants: ${{ inputs.variants }}
      build_nomount: ${{ inputs.kernel_version == '6.1' }}

  trigger-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Rilis hanya jika semua job yang benar-benar jalan sukses. Job yang di-skip
    # (kernel_version tidak dipilih) bernilai 'skipped' dan tidak menghalangi.
    if: |
      always() &&
      contains(needs.*.result, 'success') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    needs:
      - build-kernel-gs201-612-clang
      - build-kernel-gs201-61-clang
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      RELEASE_TAG: "latest"
      RELEASE_NAME: "Google Tensor gs201 Kernels (6.12 & 6.1) + SUSFS + KernelSU-Next"
      RELEASE_NOTES: |
        Automated CI release for Google Tensor gs201 (Pixel 7 / 7 Pro / 7a).
        
        ⚠️ **COMPATIBILITY NOTICE** ⚠️
        - **Linux 6.12 (Sidharthify)**: Designed for Android 16 (and 15+ compatible ROMs).
        - **Linux 6.1 (Sultan)**: Designed for Android 14 / 15.
        
        **Kernel Trees:**
        - 6.12: https://github.com/sidharthify/android_kernel_google_gs201 (branch 6.12-test)
        - 6.1: https://github.com/bhazheng/android_kernel_google_tensynos (branch android14-6.1.145)
        
        **Variants:**
        - `KernelSU-Next`: Root enabled with SuSFS v2.4.0 inline hooks + NoMount metamodule.
        - `NoRoot`: Clean performance kernel with NoMount + BBR/BBRv3 (no root).
        
        **Modules & Tooling:**
        - SuSFS Module: https://github.com/sidex15/ksu_module_susfs
        - NoMount Metamodule: attached `NoMount.zip` (universal)
        - Raw kernel: `*-Image.lz4` per variant (+ `.sha256`) for manual boot.img repacking
        - KernelSU-Next Tree: https://github.com/pershoot/KernelSU-Next/tree/dev-susfs
        - Manager APK: https://github.com/KernelSU-Next/KernelSU-Next
        **Features Included:**
        [+] KernelSU-Next (pershoot dev-susfs)
        [+] SuSFS v2.4.0 Inline Hooks
        [+] NoMount VFS Redirection Framework
        [+] BBR / BBRv3 TCP Congestion Control (FQ/CAKE)
        [+] NTSync (Wine/Proton gaming synchronization)
        [+] Advanced IPSet, WireGuard & Firewall Netfilter extensions

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded-artifacts

      - name: Prepare Release Assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Artefak di-flatten ke satu direktori. NoMount.zip kini hanya datang dari SATU job;
          # pengaman ini tetap ada: jangan blind-overwrite, simpan file identik sekali saja,
          # dan beri prefiks artefak bila isinya berbeda.
          find ./downloaded-artifacts -type f -print0 | while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            parent="$(basename "$(dirname "$f")")"
            dest="release-assets/$base"
            if [ -f "$dest" ]; then
              if cmp -s "$f" "$dest"; then
                echo "[=] identik, dilewati: $base (dari $parent)"
                continue
              fi
              dest="release-assets/${parent}--${base}"
              echo "[!] nama bentrok, disimpan sebagai $(basename "$dest")"
            fi
            cp -f "$f" "$dest"
          done
          echo "Files prepared for release:"
          ls -la release-assets/

      # softprops/action-gh-release memperbarui rilis tetapi TIDAK memindahkan tag yang sudah ada:
      # tag `latest` akan menunjuk commit lama selamanya. Pindahkan ke commit run ini.
      - name: Move 'latest' tag to this commit
        run: |
          set -euo pipefail
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$RELEASE_TAG"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_NOTES }}
          draft: false
          prerelease: false
          make_latest: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
