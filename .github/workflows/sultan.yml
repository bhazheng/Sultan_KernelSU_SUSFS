name: Sultan
permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      repo:
        required: true
        type: string
      codename:
        required: true
        type: string
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string

jobs:
  build-kernel-sultan-kernelsu-susfs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ["KernelSU-Next", "ReSukiSU"]
    steps:
      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
          sudo docker image prune --all --force
          echo "[+] Disk space cleaned up"

      - name: Install CCache & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache libssl-dev libelf-dev bc bison flex
          echo "CCACHE_DIR=${GITHUB_WORKSPACE}/.ccache" >> $GITHUB_ENV

      - name: Setup CCache Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ inputs.codename }}-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ inputs.codename }}-${{ matrix.variant }}-
            ccache-${{ inputs.codename }}-

      - name: Download and extract AOSP Clang r614150
        shell: bash
        run: |
          set -euo pipefail
          echo "Downloading AOSP Clang r614150 archive..."
          CLANG_DIR="$GITHUB_WORKSPACE/clang-aosp"
          mkdir -p "$CLANG_DIR"
          cd "$CLANG_DIR"

          curl -LJOk https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r614150.tar.gz
          tar -xf *.tar.gz
          rm -f *.tar.gz

          echo "CLANG_PATH=$CLANG_DIR/bin" >> "$GITHUB_ENV"
          echo "[+] AOSP Clang r614150 extracted successfully to $CLANG_DIR/bin"

      - name: Set up Zig Compiler
        uses: jetsung/setup-zig@v0.0.4
        with:
          version: master

      - name: Set CONFIG Environment Variable
        run: |
          CONFIG="android_kernel_google_tensynos"
          echo "CONFIG=$CONFIG" >> $GITHUB_ENV
          echo "CONFIG set to: $CONFIG"

      - name: Clone AnyKernel3 and Other Dependencies
        run: |
          echo "Cloning AnyKernel3 and other dependencies..."
          ANYKERNEL_BRANCH="sultan-${{ inputs.codename }}"
          echo "Using branch for AnyKernel3: $ANYKERNEL_BRANCH"

          git clone https://github.com/TheWildJames/AnyKernel3.git -b "$ANYKERNEL_BRANCH"
          git clone https://github.com/bhazheng/Sultan_KernelSU_SUSFS.git kernel_patches_new
          git clone https://github.com/bhazheng/android_kernel_google_tensynos
          SUSFS_BRANCH="gki-android14-6.1"
          echo "Using branch for SUSFS: $SUSFS_BRANCH"
          git clone https://gitlab.com/pershoot/susfs4ksu.git -b "$SUSFS_BRANCH"

      - name: Add Root Implementation (Matrix Conditional)
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"
          if [ "${{ matrix.variant }}" == "KernelSU-Next" ]; then
            echo "[+] Adding KernelSU-Next..."
            curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash
          elif [ "${{ matrix.variant }}" == "ReSukiSU" ]; then
            echo "[+] Adding ReSukiSU..."
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          fi

      - name: Apply SUSFS Patches
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          echo "Applying SUSFS patches..."
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch ./
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/

          patch -p1 < 50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch || true
          
          echo "Applying sys.c_fix.patch from bhazheng repo..."
          cp ../kernel_patches_new/sys.c_fix.patch ./
          patch -p1 < sys.c_fix.patch

          echo "Applying fix_open.patch from bhazheng repo..."
          cp ../kernel_patches_new/fix_open.patch ./
          patch -p1 < fix_open.patch

      - name: Apply BBRv3 Patch (Android14-6.1)
        shell: bash
        run: |
          set -euo pipefail
          echo "Downloading and applying BBRv3 patch for 6.1..."
          cd "$CONFIG"
          curl -fsSL --retry 5 https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/bbrv3/0001-net-tcp-backport-BBRv3-to-android14-6.1.patch -o bbrv3_6.1.patch
          patch -p1 < bbrv3_6.1.patch || true
          echo "[+] BBRv3 6.1 patch applied successfully"

      - name: Apply General Performance, I/O and Log Cleanup Patches
        shell: bash
        run: |
          set -euo pipefail
          echo "Applying Category 1 performance patches..."
          cd "$CONFIG"
          REPO_RAW="https://raw.githubusercontent.com/WildKernels/kernel_patches/main"

          # 1. Matikan Logspam CPU IRQ & System
          curl -fsSL --retry 3 "$REPO_RAW/common/silence_system_logspam.patch" | patch -p1 || true[cite: 1, 2]
          curl -fsSL --retry 3 "$REPO_RAW/common/silence_irq_cpu_logspam.patch" | patch -p1 || true[cite: 1, 2]

          # 2. Optimasi Memori & Operasi AArch64
          curl -fsSL --retry 3 "$REPO_RAW/common/optimise_memcmp.patch" | patch -p1 || true[cite: 1, 2]
          curl -fsSL --retry 3 "$REPO_RAW/common/optimized_mem_operations.patch" | patch -p1 || true[cite: 1, 2]

          # 3. Optimasi Latensi TCP & Socket Memory Packets
          curl -fsSL --retry 3 "$REPO_RAW/common/force_tcp_nodelay.patch" | patch -p1 || true[cite: 1, 2]
          curl -fsSL --retry 3 "$REPO_RAW/common/increase_sk_mem_packets.patch" | patch -p1 || true[cite: 1, 2]

          # 4. Tweak I/O Storage F2FS
          curl -fsSL --retry 3 "$REPO_RAW/common/f2fs_reduce_congestion.patch" | patch -p1 || true[cite: 1, 2]
          curl -fsSL --retry 3 "$REPO_RAW/common/f2fs_enlarge_min_fsync_blocks.patch" | patch -p1 || true[cite: 1, 2]

          echo "[+] Category 1 patches applied successfully"

      - name: Apply Unicode Bypass Fix
        shell: bash
        run: |
          set -euo pipefail
          echo "Downloading and applying Unicode fix for 6.1+..."
          cd "$CONFIG"
          curl -fsSL --retry 5 https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/unicode_bypass_fix_6.1%2B.patch -o unicode_fix.patch
          patch -p1 --forward < unicode_fix.patch || true
          echo "[+] Unicode fix applied"

      - name: Remove Protected Exports (Allow Out-of-tree Modules)
        shell: bash
        run: |
          cd "$CONFIG"
          echo "Relaxing symbol exports for module compatibility..."
          sed -i 's/EXPORT_SYMBOL_GPL/EXPORT_SYMBOL/g' kernel/module.c 2>/dev/null || true
          sed -i 's/EXPORT_SYMBOL_GPL/EXPORT_SYMBOL/g' kernel/module/main.c 2>/dev/null || true

      - name: Integrate NoMount
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          KERNEL_DIR="$(pwd)"

          test -d "$KERNEL_DIR/fs" || {
            echo "Kernel source directory does not exist: $KERNEL_DIR" >&2
            exit 1
          }

          requested_commit=""

          if [ -z "$requested_commit" ]; then
            echo "NoMount: no commit pinned, using latest dev branch tip"
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
              https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -s dev
            actual_commit="$(git -C "$KERNEL_DIR/NoMount" rev-parse HEAD)"
          else
            if ! [[ "$requested_commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "NoMount commit must be a full 40-character SHA." >&2
              exit 2
            fi
            setup_script="${RUNNER_TEMP}/nomount-setup-${requested_commit}.sh"
            curl --fail --location --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
              "https://raw.githubusercontent.com/maxsteeel/nomount/${requested_commit}/kernel/setup.sh" \
              --output "$setup_script"
            chmod 0755 "$setup_script"

            if [ ! -d "$KERNEL_DIR/NoMount" ]; then
              git clone --no-checkout https://github.com/maxsteeel/nomount.git "$KERNEL_DIR/NoMount"
            fi
            git -C "$KERNEL_DIR/NoMount" fetch --depth=1 origin "$requested_commit"
            git -C "$KERNEL_DIR/NoMount" checkout --detach --quiet "$requested_commit"

            "$setup_script" "$requested_commit"
            actual_commit="$(git -C "$KERNEL_DIR/NoMount" rev-parse HEAD)"
            if [ "$actual_commit" != "$requested_commit" ]; then
              echo "NoMount commit mismatch: expected $requested_commit, got $actual_commit." >&2
              exit 1
            fi
          fi

          if [ ! -L "$KERNEL_DIR/fs/nomount" ]; then
            echo "NoMount integration failed: fs/nomount symlink missing" >&2
            exit 1
          fi

          echo "NOMOUNT_COMMIT=$actual_commit" >> "$GITHUB_ENV"
          echo "NoMount integrated successfully (commit: $actual_commit)"

      - name: Build and Package NoMount Metamodule
        shell: bash
        run: |
          set -euo pipefail
          echo "Packaging NoMount metamodule using Zig..."

          cd "$GITHUB_WORKSPACE"
          
          COMMIT_HASH="${NOMOUNT_COMMIT:-}"
          if [ -z "$COMMIT_HASH" ]; then
            COMMIT_HASH="$(git ls-remote https://github.com/maxsteeel/nomount.git refs/heads/dev | cut -f1)"
          fi
          echo "Using NoMount commit: $COMMIT_HASH"

          SRC_DIR="$GITHUB_WORKSPACE/nomount_src"
          MOD_DIR="$GITHUB_WORKSPACE/nomount_mod"
          ZIP_OUT="$GITHUB_WORKSPACE/NoMount-${COMMIT_HASH}.zip"

          rm -rf "$SRC_DIR" "$MOD_DIR"
          mkdir -p "$SRC_DIR" "$MOD_DIR"

          git clone --depth=1 https://github.com/maxsteeel/nomount.git -b dev "$SRC_DIR"
          git -C "$SRC_DIR" checkout "$COMMIT_HASH" || true

          mkdir -p "$SRC_DIR/bin"
          (
            cd "$SRC_DIR/userspace/src"
            zig cc -target aarch64-linux -Oz -mcmodel=tiny -static -nostdlib \
              -ffreestanding -fno-unwind-tables -fno-ident -Wno-invalid-noreturn \
              -Wl,--entry=_start nm.c -o ../../bin/nm-arm64
            zig cc -target arm-linux -Oz -static -nostdlib -ffreestanding \
              -fno-unwind-tables -fno-ident -Wno-invalid-noreturn \
              -ffunction-sections -fdata-sections -Wl,--gc-sections \
              -Wl,--entry=_start nm.c -o ../../bin/nm-arm
          )

          cp -a "$SRC_DIR/module/." "$MOD_DIR/"
          mkdir -p "$MOD_DIR/bin"
          install -m 0755 "$SRC_DIR/bin/nm-arm64" "$MOD_DIR/bin/nm-arm64"
          install -m 0755 "$SRC_DIR/bin/nm-arm" "$MOD_DIR/bin/nm-arm"
          sed -i "s/^versionCode=.*/versionCode=1/" "$MOD_DIR/module.prop"
          printf '%s\n' "$COMMIT_HASH" > "$MOD_DIR/NOMOUNT_SOURCE_COMMIT"

          (
            cd "$MOD_DIR"
            zip -qr "$ZIP_OUT" ./*
          )
          sha256sum "$ZIP_OUT" > "${ZIP_OUT}.sha256"

          rm -rf "$SRC_DIR" "$MOD_DIR"
          echo "[+] NoMount metamodule packaged successfully: $ZIP_OUT"

      - name: Apply All Kernel Configurations
        shell: bash
        run: |
          cd "$CONFIG"
          DEFCONFIG="./arch/arm64/configs/${{ inputs.codename }}_defconfig"

          cat >> "$DEFCONFIG" << 'EOF'

          # KernelSU & SuSFS Configuration
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=n
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_THREAD_INFO_IN_TASK=y

          # Compiler Optimizations & ThinLTO
          CONFIG_LTO=y
          CONFIG_LTO_CLANG=y
          CONFIG_THINLTO=y
          CONFIG_ARCH_SUPPORTS_LTO_CLANG=y
          CONFIG_ARCH_SUPPORTS_THINLTO=y
          CONFIG_LTO_NONE=n

          # Kallsyms & OverlayFS
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_OVERLAY_FS=y

          # NoMount & Mountify
          CONFIG_NOMOUNT=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y

          # eBPF & FUSE-BPF
          CONFIG_BPF_EVENTS=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_UPROBES=y
          CONFIG_UPROBE_EVENTS=y
          CONFIG_FUSE_FS=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_FUSE_BPF=y

          # Networking, TTL/HL, IPSET & IPv6 NAT
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          CONFIG_NET_ACT_CONNMARK=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y

          # TCP Congestion Control (BBRv3) & Queueing Disciplines
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_BBR3=y
          CONFIG_TCP_CONG_CUBIC=y
          CONFIG_TCP_CONG_BIC=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_DEFAULT_BBR3=y
          CONFIG_DEFAULT_TCP_CONG="bbr3"
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_NET_SCH_CAKE=y

          # CIFS / SMB Network Filesystem
          CONFIG_NETWORK_FILESYSTEMS=y
          CONFIG_NETFS_SUPPORT=y
          CONFIG_KEYS=y
          CONFIG_CIFS=y
          CONFIG_CIFS_XATTR=y
          CONFIG_CIFS_POSIX=y
          EOF

      - name: Clean Kernel Flags & Branding
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"
          echo "Running sed commands..."
          sed -i "s/CONFIG_LOCALVERSION=\"-Sultan\"/CONFIG_LOCALVERSION=\"-Sultan-${{ matrix.variant }}\"/" ./arch/arm64/configs/${{ inputs.codename }}_defconfig
          sed -i 's/CONFIG_LOCALVERSION_AUTO=y/CONFIG_LOCALVERSION_AUTO=n/' ./arch/arm64/configs/${{ inputs.codename }}_defconfig || true
          sed -i '/echo "+"$/d' scripts/setlocalversion
          sed -i 's/scm_version="-dirty"/scm_version=""/' scripts/setlocalversion 2>/dev/null || true

      - name: Build the Kernel with AOSP Clang r614150 (ThinLTO)
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"
          
          export PATH="$CLANG_PATH:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          ccache -s

          # Generate Defconfig
          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            ${{ inputs.codename }}_defconfig

          # Compile Kernel with ThinLTO & Polly optimizations
          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            KCFLAGS="-O3 -mllvm -polly -mllvm -polly-run-dce" \
            KCPPFLAGS="-O3" \
            LOCALVERSION_AUTO=0

          ccache -s

      - name: Copy Images
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"
          echo "Copying Image.lz4 and concatenating DTB files..."
          cp ./out/arch/arm64/boot/Image.lz4 ../AnyKernel3/Image.lz4
          if [ "${{ inputs.codename }}" == "gs201" ]; then
            cat ./out/google-devices/gs201/dts/*.dtb > ../AnyKernel3/dtb
          elif [ "${{ inputs.codename }}" == "zuma" ]; then
            cat ./out/google-devices/zuma/dts/*.dtb > ../AnyKernel3/dtb
          elif [ "${{ inputs.codename }}" == "zumapro" ]; then
            cat ./out/google-devices/zumapro/dts/*.dtb > ../AnyKernel3/dtb
          fi

      - name: Create ZIP Files for Different Formats
        run: |
          echo "Navigating to AnyKernel3 directory..."
          cd ./AnyKernel3
          ZIP_NAME="${{ matrix.variant }}-${{ inputs.codename }}-A16-Sultan.zip"
          echo "Creating zip file $ZIP_NAME..."
          zip -r "../$ZIP_NAME" ./*

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.codename }}-${{ matrix.variant }}
          path: |
            ${{ github.workspace }}/*.zip
            !${{ github.workspace }}/NoMount-*.zip

      - name: Upload NoMount Metamodule Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoMount-Metamodule-${{ inputs.codename }}-${{ matrix.variant }}
          path: |
            ${{ github.workspace }}/NoMount-*.zip
            ${{ github.workspace }}/NoMount-*.sha256

      - name: Collect .rej files
        if: ${{ always() }}
        id: collect_rej
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf rej
          mkdir -p rej

          found="false"
          while IFS= read -r -d '' rej_file; do
            found="true"
            original_file="${rej_file%.rej}"
            rej_rel="${rej_file#./}"
            original_rel="${original_file#./}"

            mkdir -p "rej/$(dirname "$rej_rel")"
            cp -f "$rej_file" "rej/$rej_rel"

            if [[ -f "$original_file" ]]; then
              mkdir -p "rej/$(dirname "$original_rel")"
              cp -f "$original_file" "rej/$original_rel"
            fi
          done < <(find . -type f -name '*.rej' -print0)

          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Zip collected .rej bundle
        if: ${{ always() && steps.collect_rej.outputs.found == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          zip -r "rej-${{ inputs.codename }}-${{ matrix.variant }}.zip" rej

      - name: Upload .rej bundle
        if: ${{ always() && steps.collect_rej.outputs.found == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: rej-${{ inputs.codename }}-${{ matrix.variant }}
          path: |
            rej-${{ inputs.codename }}-${{ matrix.variant }}*.zip
