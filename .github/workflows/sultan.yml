name: Sultan
permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      repo:
        required: true
        type: string
      codename:
        required: true
        type: string
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string

jobs:
  build-kernel-sultan-kernelsu-susfs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ["KernelSU-Next", "ReSukiSU"]
    steps:
      - name: Free Disk Space on Runner
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
          sudo docker image prune --all --force
          echo "[+] Disk space cleaned up"

      - name: Install CCache & Essential Build Tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache libssl-dev libelf-dev bc bison flex perl
          echo "CCACHE_DIR=${GITHUB_WORKSPACE}/.ccache" >> "$GITHUB_ENV"

      - name: Setup CCache Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-gcc-${{ inputs.codename }}-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            ccache-gcc-${{ inputs.codename }}-${{ matrix.variant }}-
            ccache-gcc-${{ inputs.codename }}-

      - name: Download and extract GCC 14.2.0 (Streamed)
        shell: bash
        run: |
          set -euo pipefail
          echo "Streaming and extracting GCC 14.2.0..."
          curl -fsSL "https://www.kernel.org/pub/tools/crosstool/files/bin/x86_64/14.2.0/x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz" | tar -xz

      - name: Set up Zig Compiler
        uses: jetsung/setup-zig@v0.0.4
        with:
          version: master

      - name: Set CONFIG Environment Variable
        shell: bash
        run: |
          CONFIG="android_kernel_google_tensynos"
          echo "CONFIG=$CONFIG" >> "$GITHUB_ENV"

      - name: Clone AnyKernel3 and Dependencies (Parallel)
        shell: bash
        run: |
          set -euo pipefail
          echo "[+] Cloning dependencies in parallel..."
          git clone --depth=1 https://github.com/TheWildJames/AnyKernel3.git -b "sultan-${{ inputs.codename }}" &
          git clone --depth=1 https://github.com/bhazheng/Sultan_KernelSU_SUSFS.git kernel_patches_new &
          
          # Repositori kernel wajib di-clone penuh (tanpa --depth=1)
          git clone https://github.com/bhazheng/android_kernel_google_tensynos &
          
          git clone --depth=1 https://gitlab.com/pershoot/susfs4ksu.git -b "gki-android14-6.1" &
          wait

      - name: Add Root Implementation
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          rm -rf KernelSU drivers/kernelsu drivers/KernelSU

          if [ "${{ matrix.variant }}" == "KernelSU-Next" ]; then
            curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
          elif [ "${{ matrix.variant }}" == "ReSukiSU" ]; then
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
            
            # Hapus sifat 'static' agar simbol dapat diekspor untuk static_export_check
            sed -i 's/static const struct file_operations sel_handle_status_ops/const struct file_operations sel_handle_status_ops/' security/selinux/selinuxfs.c
            grep -q "EXPORT_SYMBOL.*sel_handle_status_ops" security/selinux/selinuxfs.c 2>/dev/null || echo "EXPORT_SYMBOL(sel_handle_status_ops);" >> security/selinux/selinuxfs.c
          fi

          if [ -d "KernelSU/kernel" ]; then
            ln -sfn ../KernelSU/kernel drivers/kernelsu
            ln -sfn ../KernelSU/kernel drivers/KernelSU
          fi

          sed -i '/[Kk]ernelSU/d' drivers/Makefile
          sed -i '/kernelsu/d' drivers/Makefile
          echo "obj-y += kernelsu/" >> drivers/Makefile

      - name: Apply SUSFS Patches
        shell: bash
        run: |
          set -euo pipefail
          
          # Patch Koeksistensi untuk KernelSU-Next
          if [ "${{ matrix.variant }}" == "KernelSU-Next" ]; then
            echo "[+] Applying Pershoot Coexistence Patches to SuSFS..."
            cd susfs4ksu
            curl -fsSL --retry 3 "https://raw.githubusercontent.com/WildKernels/kernel_patches/main/pershoot/susfs4ksu/0001-pershoot-Allow-core-to-be-built-with-no-features.patch" | patch -p1 || true
            curl -fsSL --retry 3 "https://raw.githubusercontent.com/WildKernels/kernel_patches/main/pershoot/susfs4ksu/0002-pershoot-Implement-SuSFS-and-Toolkit-coexistence.patch" | patch -p1 || true
            cd ../
          fi
          
          cd "$CONFIG"
          
          # SuSFS Common
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/

          # Terapkan patch SuSFS (Abaikan reject selinuxfs.c dengan || true)
          perl -0pi -e 's/if \(IS_ERR\(f\) && !libperfmgr_redirect\(&f, dfd, tmp, &op, how\)\) \{/if (IS_ERR(f)) {/g' fs/open.c
          patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch || true
          perl -0pi -e 's/if \(IS_ERR\(f\)\) \{/if (IS_ERR(f) && !libperfmgr_redirect(&f, dfd, tmp, &op, how)) {/g' fs/open.c
          
          patch -p1 < ../kernel_patches_new/sys.c_fix.patch || true

      - name: Apply Optimization & Network Patches
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          
          REPO="https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common"
          PATCHES=(
            "bbrv3/0001-net-tcp-backport-BBRv3-to-android14-6.1.patch"
            "unicode_bypass_fix_6.1%2B.patch"
            "silence_system_logspam.patch"
            "silence_irq_cpu_logspam.patch"
            "optimise_memcmp.patch"
            "optimized_mem_operations.patch"
            "force_tcp_nodelay.patch"
            "increase_sk_mem_packets.patch"
            "f2fs_reduce_congestion.patch"
            "f2fs_enlarge_min_fsync_blocks.patch"
          )
          for p in "${PATCHES[@]}"; do
            curl -fsSL --retry 3 "$REPO/$p" | patch -p1 --forward || true
          done

          sed -i 's/EXPORT_SYMBOL_GPL/EXPORT_SYMBOL/g' kernel/module.c kernel/module/main.c 2>/dev/null || true

      - name: Integrate NoMount
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          KERNEL_DIR="$(pwd)"
          curl -fsSL --retry 3 https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -s dev
          actual_commit="$(git -C "$KERNEL_DIR/NoMount" rev-parse HEAD)"
          [ ! -L "$KERNEL_DIR/fs/nomount" ] && exit 1
          echo "NOMOUNT_COMMIT=$actual_commit" >> "$GITHUB_ENV"

      - name: Build and Package NoMount Metamodule
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          COMMIT_HASH="${NOMOUNT_COMMIT:-$(git ls-remote https://github.com/maxsteeel/nomount.git refs/heads/dev | cut -f1)}"
          SRC_DIR="nomount_src"
          MOD_DIR="nomount_mod"
          ZIP_OUT="NoMount-${COMMIT_HASH}.zip"

          rm -rf "$SRC_DIR" "$MOD_DIR"
          
          git clone --depth=1 https://github.com/maxsteeel/nomount.git -b dev "$SRC_DIR"
          git -C "$SRC_DIR" checkout "$COMMIT_HASH" || true
          
          mkdir -p "$SRC_DIR/bin" "$MOD_DIR/bin"

          (
            cd "$SRC_DIR/userspace/src"
            zig cc -target aarch64-linux -Oz -mcmodel=tiny -static -nostdlib -ffreestanding -fno-unwind-tables -fno-ident -Wno-invalid-noreturn -Wl,--entry=_start nm.c -o ../../bin/nm-arm64
            zig cc -target arm-linux -Oz -static -nostdlib -ffreestanding -fno-unwind-tables -fno-ident -Wno-invalid-noreturn -ffunction-sections -fdata-sections -Wl,--gc-sections -Wl,--entry=_start nm.c -o ../../bin/nm-arm
          )

          cp -a "$SRC_DIR/module/." "$MOD_DIR/"
          install -m 0755 "$SRC_DIR/bin/nm-arm64" "$MOD_DIR/bin/nm-arm64"
          install -m 0755 "$SRC_DIR/bin/nm-arm" "$MOD_DIR/bin/nm-arm"
          sed -i "s/^versionCode=.*/versionCode=1/" "$MOD_DIR/module.prop"
          printf '%s\n' "$COMMIT_HASH" > "$MOD_DIR/NOMOUNT_SOURCE_COMMIT"

          (cd "$MOD_DIR" && zip -qr "../$ZIP_OUT" ./*)
          sha256sum "$ZIP_OUT" > "${ZIP_OUT}.sha256"
          rm -rf "$SRC_DIR" "$MOD_DIR"

      - name: Apply Kernel Defconfig Flags
        shell: bash
        run: |
          cd "$CONFIG"
          cat >> "./arch/arm64/configs/${{ inputs.codename }}_defconfig" << 'EOF'
          CONFIG_DEBUG_INFO=y
          CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT=y
          CONFIG_NOMOUNT=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP6_NF_MATCH_HL=y
          CONFIG_NET_ACT_CONNMARK=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_BBR3=y
          CONFIG_TCP_CONG_CUBIC=y
          CONFIG_TCP_CONG_BIC=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_DEFAULT_BBR3=y
          CONFIG_DEFAULT_TCP_CONG="bbr3"
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_NET_SCH_CAKE=y
          CONFIG_NETWORK_FILESYSTEMS=y
          CONFIG_NETFS_SUPPORT=y
          CONFIG_KEYS=y
          CONFIG_CIFS=y
          CONFIG_CIFS_XATTR=y
          CONFIG_CIFS_POSIX=y
          EOF

          sed -i "s/CONFIG_LOCALVERSION=\"-Sultan\"/CONFIG_LOCALVERSION=\"-Sultan-${{ matrix.variant }}\"/" ./arch/arm64/configs/${{ inputs.codename }}_defconfig
          sed -i 's/CONFIG_LOCALVERSION_AUTO=y/CONFIG_LOCALVERSION_AUTO=n/' ./arch/arm64/configs/${{ inputs.codename }}_defconfig || true
          sed -i '/echo "+"$/d' scripts/setlocalversion
          sed -i 's/scm_version="-dirty"/scm_version=""/' scripts/setlocalversion 2>/dev/null || true

      - name: Build the Kernel (GCC 14.2)
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          
          mkdir -p out
          export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc-14.2.0-nolibc/aarch64-linux/bin/aarch64-linux-"
          export CC="ccache $GITHUB_WORKSPACE/gcc-14.2.0-nolibc/aarch64-linux/bin/aarch64-linux-gcc"
          export ARCH=arm64
          export SUBARCH=arm64

          export CCACHE_NOHASHDIR=true
          export CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,locale
          ccache -M 15G && ccache -o compression=true && ccache -o compression_level=1 && ccache -s

          touch arch/arm64/configs/${{ inputs.codename }}_defconfig

          # 1. Defconfig dasar
          make O=out -j$(nproc --all) ${{ inputs.codename }}_defconfig

          # 2. Injeksi mutlak konfigurasi KSU dan Kprobes
          ./scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_KSU_SUSFS_SUS_PATH \
            -e CONFIG_KSU_SUSFS_SUS_MOUNT \
            -e CONFIG_KSU_SUSFS_SUS_KSTAT \
            -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
            -e CONFIG_KSU_SUSFS_ENABLE_LOG \
            -e CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -d CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            -e CONFIG_KSU_SUSFS_SUS_MAP \
            -e CONFIG_THREAD_INFO_IN_TASK \
            -e CONFIG_KPROBES \
            -e CONFIG_HAVE_KPROBES \
            -e CONFIG_KALLSYMS \
            -e CONFIG_KALLSYMS_ALL \
            -e CONFIG_OVERLAY_FS \
            -e CONFIG_BPF_EVENTS \
            -e CONFIG_KPROBE_EVENTS \
            -e CONFIG_UPROBES \
            -e CONFIG_UPROBE_EVENTS \
            -e CONFIG_FUSE_FS \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_FUSE_BPF

          make O=out olddefconfig

          # 3. Kompilasi Paralel
          make O=out LOCALVERSION_AUTO=0 -j$(nproc --all) || {
            echo "::error::Build paralel gagal. Melacak via single-thread:"
            make O=out LOCALVERSION_AUTO=0 -j1
            exit 1
          }

          ccache -s

      - name: Copy Images & Create ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          cp ./out/arch/arm64/boot/Image.lz4 ../AnyKernel3/Image.lz4
          
          if [ "${{ inputs.codename }}" == "gs201" ]; then
             cat ./out/google-devices/gs201/dts/*.dtb > ../AnyKernel3/dtb
          elif [ "${{ inputs.codename }}" == "zuma" ]; then
             cat ./out/google-devices/zuma/dts/*.dtb > ../AnyKernel3/dtb
          elif [ "${{ inputs.codename }}" == "zumapro" ]; then
             cat ./out/google-devices/zumapro/dts/*.dtb > ../AnyKernel3/dtb
          fi

          cd ../AnyKernel3
          ZIP_NAME="${{ matrix.variant }}-${{ inputs.codename }}-A16-Sultan.zip"
          zip -qr "../$ZIP_NAME" ./*
          cd ..
          sha256sum "$ZIP_NAME" > "${ZIP_NAME}.sha256"

          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "ZIP_SHA=$(cat ${ZIP_NAME}.sha256 | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Generate Workflow Summary
        if: ${{ always() }}
        shell: bash
        run: |
          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ### 🚀 Build Summary: ${{ inputs.codename }} (${{ matrix.variant }})
          | Komponen | Status / Nilai |
          |---|---|
          | **Variant** | `${{ matrix.variant }}` |
          | **Artifact Name** | `${{ env.ZIP_NAME }}` |
          | **SHA-256** | \`${{ env.ZIP_SHA }}\` |
          EOF

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.codename }}-${{ matrix.variant }}
          path: |
            ${{ github.workspace }}/*.zip
            ${{ github.workspace }}/*.sha256
            !${{ github.workspace }}/NoMount-*.zip
            !${{ github.workspace }}/NoMount-*.sha256

      - name: Upload NoMount Metamodule Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoMount-Metamodule-${{ inputs.codename }}-${{ matrix.variant }}
          path: |
            ${{ github.workspace }}/NoMount-*.zip
            ${{ github.workspace }}/NoMount-*.sha256

      - name: Collect .rej files
        if: ${{ always() }}
        id: collect_rej
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf rej
          mkdir -p rej

          found="false"
          while IFS= read -r -d '' rej_file; do
            found="true"
            original_file="${rej_file%.rej}"
            rej_rel="${rej_file#./}"
            original_rel="${original_file#./}"

            mkdir -p "rej/$(dirname "$rej_rel")"
            cp -f "$rej_file" "rej/$rej_rel"

            if [[ -f "$original_file" ]]; then
              mkdir -p "rej/$(dirname "$original_rel")"
              cp -f "$original_file" "rej/$original_rel"
            fi
          done < <(find . -type f -name '*.rej' -print0)

          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Zip collected .rej bundle
        if: ${{ always() && steps.collect_rej.outputs.found == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          zip -r "rej-${{ inputs.codename }}-${{ matrix.variant }}.zip" rej

      - name: Upload .rej bundle
        if: ${{ always() && steps.collect_rej.outputs.found == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: rej-${{ inputs.codename }}-${{ matrix.variant }}
          path: |
            rej-${{ inputs.codename }}-${{ matrix.variant }}*.zip
