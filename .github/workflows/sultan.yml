- name: Add Root Implementation & Version Anchoring
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          rm -rf KernelSU KernelSU-Next drivers/kernelsu drivers/KernelSU

          # Fungsi retry untuk mengantisipasi gangguan jaringan pada Runner
          retry() {
            local n=0
            until [ "$n" -ge 5 ]; do
              "$@" && return 0
              n=$((n+1))
              echo "retry $n/5 failed for: $*" >&2
              sleep 5
            done
            return 1
          }

          if [ "${{ matrix.variant }}" == "KernelSU-Next" ]; then
            KSU_REPO="https://github.com/pershoot/KernelSU-Next.git"
            KSU_INPUT="dev-susfs"

            if retry git ls-remote --heads "$KSU_REPO" "$KSU_INPUT" | grep -q .; then
              curl -LSs --retry 5 --retry-delay 5 --retry-all-errors "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
              retry git -C KernelSU-Next/kernel fetch --depth=50 origin "$KSU_INPUT"
              git -C KernelSU-Next/kernel checkout "origin/$KSU_INPUT"
            else
              curl -LSs --retry 5 --retry-delay 5 --retry-all-errors "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
              retry git -C KernelSU-Next/kernel fetch --depth=50 origin "$KSU_INPUT"
              git -C KernelSU-Next/kernel checkout "$KSU_INPUT"
            fi

            # Penambatan versi presisi KernelSU-Next agar sinkron dengan Manager
            cd KernelSU-Next/kernel
            BASE_BRANCH=$(git rev-parse --abbrev-ref HEAD | sed 's:-.*::' 2>/dev/null)
            BASE_COMMIT=$(git merge-base HEAD refs/remotes/origin/$BASE_BRANCH 2>/dev/null || git merge-base HEAD refs/remotes/origin/main 2>/dev/null || echo HEAD)
            COMMITS_COUNT=$(/usr/bin/git rev-list --count $BASE_COMMIT)
            BASE_VERSION=30000
            KSU_VERSION=$(expr $COMMITS_COUNT "+" $BASE_VERSION)
            sed -i "s/^KSU_VERSION_FALLBACK := 1$/KSU_VERSION_FALLBACK := ${KSU_VERSION}/" Kbuild

            KSU_GIT_TAG="$(git describe --tags --abbrev=0 $BASE_COMMIT 2>/dev/null || echo "v0.0.1")"
            sed -i "s/^KSU_VERSION_TAG_FALLBACK := v0.0.1$/KSU_VERSION_TAG_FALLBACK := ${KSU_GIT_TAG}/" Kbuild
            cd ../../

          elif [ "${{ matrix.variant }}" == "ReSukiSU" ]; then
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
            
            # Penanganan wajib untuk simbol statis ReSukiSU
            sed -i 's/static const struct file_operations sel_handle_status_ops/const struct file_operations sel_handle_status_ops/' security/selinux/selinuxfs.c || true
            grep -q "EXPORT_SYMBOL.*sel_handle_status_ops" security/selinux/selinuxfs.c 2>/dev/null || echo "EXPORT_SYMBOL(sel_handle_status_ops);" >> security/selinux/selinuxfs.c || true
          fi

          # Unduh dan terapkan static.patch secara kondisional ke folder root yang tepat
          echo "[+] Downloading and applying static.patch..."
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/WildKernels/GKI_KernelSU_SUSFS/refs/heads/main/.github/actions/kernelsu/patches/static.patch" -o static.patch
          
          if [ "${{ matrix.variant }}" == "KernelSU-Next" ] && [ -d "KernelSU-Next/kernel" ]; then
            patch -p1 -d "KernelSU-Next/kernel" < static.patch || true
          elif [ "${{ matrix.variant }}" == "ReSukiSU" ] && [ -d "KernelSU/kernel" ]; then
            patch -p1 -d "KernelSU/kernel" < static.patch || true
          fi
          
          rm -f static.patch

          # Pengaturan symlink yang aman dan pasti terbaca oleh Kbuild/Kconfig
          mkdir -p drivers/kernelsu
          if [ "${{ matrix.variant }}" == "KernelSU-Next" ] && [ -d "KernelSU-Next/kernel" ]; then
            rm -rf drivers/kernelsu drivers/KernelSU
            ln -sfn ../KernelSU-Next/kernel drivers/kernelsu
            ln -sfn ../KernelSU-Next/kernel drivers/KernelSU
          elif [ "${{ matrix.variant }}" == "ReSukiSU" ] && [ -d "KernelSU/kernel" ]; then
            rm -rf drivers/kernelsu drivers/KernelSU
            ln -sfn ../Kernel/kernel drivers/kernelsu
            ln -sfn ../Kernel/kernel drivers/KernelSU
          fi

          sed -i '/[Kk]ernelSU/d' drivers/Makefile
          sed -i '/kernelsu/d' drivers/Makefile
          echo "obj-y += kernelsu/" >> drivers/Makefile
