            echo "CONFIG_FS_ENCRYPTION_ALGS=y"
            echo "CONFIG_FS_ENCRYPTION_INLINE_CRYPT=y"
            echo "CONFIG_BLK_INLINE_ENCRYPTION=y"
            echo "CONFIG_BLK_INLINE_ENCRYPTION_FALLBACK=y"
            # f2fs: fscompress/checkpoint_merge/atgc/quota/verity from fstab
            echo "CONFIG_F2FS_FS=y"
            echo "CONFIG_F2FS_FS_XATTR=y"
            echo "CONFIG_F2FS_FS_POSIX_ACL=y"
            echo "CONFIG_F2FS_FS_SECURITY=y"
            echo "CONFIG_F2FS_CHECK_FS=y"
