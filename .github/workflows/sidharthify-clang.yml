            echo "CONFIG_NET_CLS_BPF=y"
            echo "CONFIG_NET_EMATCH=y"
            echo "CONFIG_NET_EMATCH_CMP=y"
            echo "CONFIG_NET_EMATCH_NBYTE=y"
            echo "CONFIG_NET_EMATCH_U32=y"
            echo "CONFIG_NET_EMATCH_META=y"
            echo "CONFIG_NET_EMATCH_TEXT=y"
            echo "CONFIG_IP_NF_TARGET_REDIRECT=y"
            echo "CONFIG_IP_NF_MANGLE=y"
            echo "CONFIG_IP_NF_RAW=y"
            echo "CONFIG_IP_NF_SECURITY=y"
            echo "CONFIG_IP_NF_ARPTABLES=y"
            echo "CONFIG_NET_IPVTI=y"
            echo "CONFIG_INET_ESP=y"
            echo "CONFIG_IPV6_ROUTER_PREF=y"
            echo "CONFIG_IPV6_ROUTE_INFO=y"
            echo "CONFIG_IPV6_OPTIMISTIC_DAD=y"
            echo "CONFIG_IPV6_MULTIPLE_TABLES=y"
            echo "CONFIG_IPV6_SUBTREES=y"
            echo "CONFIG_IPV6_MROUTE=y"
            echo "CONFIG_IPV6_MROUTE_MULTIPLE_TABLES=y"
            echo "CONFIG_IPV6_PIMSM_V2=y"
            echo "CONFIG_INET_UDP_DIAG=y"
            echo "CONFIG_INET_DIAG_DESTROY=y"
            echo "CONFIG_WIREGUARD=y"
            echo "CONFIG_TCP_CONG_ADVANCED=y"
            echo "CONFIG_TCP_CONG_BBR=y"
            echo "CONFIG_DEFAULT_TCP_CONG=\"bbr\""
            echo "CONFIG_NET_SCH_FQ=y"
            echo "CONFIG_NET_SCH_FQ_CODEL=y"
            echo "CONFIG_NET_SCH_CAKE=y"
            echo "CONFIG_NETWORK_FILESYSTEMS=y"
            echo "CONFIG_NETFS_SUPPORT=y"
            echo "CONFIG_KEYS=y"
            echo "CONFIG_CIFS=y"
            echo "CONFIG_CIFS_XATTR=y"
            echo "CONFIG_CIFS_POSIX=y"
            echo "CONFIG_NTSYNC=y"
            echo "CONFIG_THREAD_INFO_IN_TASK=y"
            echo "CONFIG_DEBUG_KERNEL=y"
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
            echo "CONFIG_OVERLAY_FS=y"
            echo "CONFIG_FUSE_FS=y"
            echo "CONFIG_BPF_SYSCALL=y"
            echo "CONFIG_FUSE_BPF=y"
            echo "CONFIG_NOMOUNT=y"

            # --- ColorOS port bring-up: crash capture + required filesystems ---
            # pstore/ramoops: hang -> hung_task panic -> dmesg dumped to DT ramoops
            echo "CONFIG_PSTORE=y"
            echo "CONFIG_PSTORE_RAM=y"
            echo "CONFIG_PSTORE_CONSOLE=y"
            echo "CONFIG_PSTORE_PMSG=y"
            echo "CONFIG_PSTORE_DEFLATE_COMPRESS=y"
            echo "CONFIG_LOG_BUF_SHIFT=21"
            echo "CONFIG_PANIC_ON_OOPS=$PANIC_VAL"
            echo "CONFIG_PANIC_TIMEOUT=10"
            echo "CONFIG_DETECT_HUNG_TASK=y"
            echo "CONFIG_DEFAULT_HUNG_TASK_TIMEOUT=60"
            echo "CONFIG_BOOTPARAM_HUNG_TASK_PANIC=$PANIC_VAL"
            echo "CONFIG_DETECT_SOFTLOCKUP=y"
            echo "CONFIG_BOOTPARAM_SOFTLOCKUP_PANIC=$PANIC_VAL"
            echo "CONFIG_MAGIC_SYSRQ=y"
            echo "CONFIG_MAGIC_SYSRQ_DEFAULT_ENABLE=0x1"
            echo "CONFIG_STACKTRACE=y"
            # EROFS: system/system_ext/product are erofs + lz4hc
            echo "CONFIG_EROFS_FS=y"
            echo "CONFIG_EROFS_FS_XATTR=y"
            echo "CONFIG_EROFS_FS_POSIX_ACL=y"
            echo "CONFIG_EROFS_FS_SECURITY=y"
            echo "CONFIG_EROFS_FS_ZIP=y"
            echo "CONFIG_EROFS_FS_ZIP_LZMA=y"
            echo "CONFIG_EROFS_FS_ZIP_DEFLATE=y"
            echo "CONFIG_EROFS_FS_ZIP_ZSTD=y"
            echo "CONFIG_LZ4_DECOMPRESS=y"
            # FBE wrappedkey + inlinecrypt as required by the ColorOS fstab
            echo "CONFIG_DM_CRYPT=y"
            echo "CONFIG_DM_DEFAULT_KEY=y"
            echo "CONFIG_DM_BUFIO=y"
            echo "CONFIG_FS_ENCRYPTION=y"
            echo "CONFIG_FS_ENCRYPTION_ALGS=y"
            echo "CONFIG_FS_ENCRYPTION_INLINE_CRYPT=y"
            echo "CONFIG_BLK_INLINE_ENCRYPTION=y"
            echo "CONFIG_BLK_INLINE_ENCRYPTION_FALLBACK=y"
            # f2fs: fscompress/checkpoint_merge/atgc/quota/verity from fstab
            echo "CONFIG_F2FS_FS=y"
            echo "CONFIG_F2FS_FS_XATTR=y"
            echo "CONFIG_F2FS_FS_POSIX_ACL=y"
            echo "CONFIG_F2FS_FS_SECURITY=y"
            echo "CONFIG_F2FS_CHECK_FS=y"
            echo "CONFIG_F2FS_FS_COMPRESSION=y"
            echo "CONFIG_F2FS_FS_LZ4=y"
            echo "CONFIG_F2FS_FS_LZ4HC=y"
            echo "CONFIG_F2FS_FS_VERITY=y"
            echo "CONFIG_QUOTA=y"
            echo "CONFIG_QFMT_V2=y"
            # androidboot.selinux=permissive only works with BOOTPARAM
            echo "CONFIG_SECURITY_SELINUX=y"
            echo "CONFIG_SECURITY_SELINUX_BOOTPARAM=y"
            echo "CONFIG_SECURITY_SELINUX_DEVELOP=y"
            echo "CONFIG_FS_VERITY=y"
            echo "CONFIG_FS_VERITY_BUILTIN_SIGNATURES=y"
            echo "CONFIG_ANDROID_BINDERFS=y"
            echo "CONFIG_DM_VERITY=y"
          } >> "$DEFCONFIG"


          if [ "${{ matrix.variant }}" == "KernelSU-Next" ]; then
            {
              echo "CONFIG_KSU=y"
              echo "CONFIG_KSU_SUSFS=y"
            } >> "$DEFCONFIG"
          else
            echo "[*] Varian ${{ matrix.variant }} — injeksi KSU/SUSFS dilewati (tanpa KSU)."
          fi

          # Nama kernel (uname -r) gaya GKI stock: <versi>-android16-6-g<12 hex HEAD upstream>, tanpa -dirty.
          # Hash ditulis langsung ke CONFIG_LOCALVERSION (LOCALVERSION_AUTO tetap mati): AUTO selalu
          # menambahkan -dirty karena CI menambal tree. HEAD = commit upstream (clone, tanpa commit CI).
          # LOCALVERSION= (kosong) di MAKE_ARGS mencegah setlocalversion menambahkan "+".
          KHASH="$(git rev-parse HEAD | cut -c1-12)"
          [[ "$KHASH" =~ ^[0-9a-f]{12}$ ]] || { echo "::error::Hash HEAD kernel tidak valid: '$KHASH'."; exit 1; }
          KLV="-android16-6-g$KHASH"
          sed -i "s/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=\"$KLV\"/" "$DEFCONFIG"
          grep -qx "CONFIG_LOCALVERSION=\"$KLV\"" "$DEFCONFIG" || { echo "::error::CONFIG_LOCALVERSION tidak ter-set ke $KLV."; exit 1; }
          echo "KERNEL_LOCALVERSION=$KLV" >> "$GITHUB_ENV"
          echo "[+] CONFIG_LOCALVERSION=$KLV"

      - name: Wait for disk cleanup
        shell: bash
        run: |
          set -euo pipefail
          pid="$(cat /tmp/disk-cleanup.pid 2>/dev/null || true)"
          if [ -n "$pid" ]; then
            SECONDS=0
            while [ -d "/proc/$pid" ]; do sleep 2; done
            echo "[+] Disk cleanup selesai (menunggu ${SECONDS}s di sini)."
          fi
          tail -3 /tmp/disk-cleanup.log 2>/dev/null || true
          df -h / | tail -1
          avail_gb=$(( $(df --output=avail -k / | tail -1) / 1024 / 1024 ))
          [ "$avail_gb" -ge 15 ] || echo "::warning::Ruang disk tersisa hanya ${avail_gb}G sebelum build."

      - name: Build the Kernel
        shell: bash
        env:
          RUST_BINDER: ${{ inputs.rust_binder }}
        run: |
          set -euo pipefail
          cd "$CONFIG"

          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          unset CLANG_FLAGS
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          if [ -d "$GITHUB_WORKSPACE/clang/aarch64-linux-gnu/bin" ]; then
            export PATH="$GITHUB_WORKSPACE/clang/aarch64-linux-gnu/bin:$PATH"
          fi

          export CCACHE_DIR="$HOME/.cache/ccache"
          export CCACHE_MAXSIZE=2G
          mkdir -p "$HOME/.ccache-bin"
          printf '#!/bin/sh\nexec ccache "%s" -Qunused-arguments "$@"\n' "$GITHUB_WORKSPACE/clang/bin/clang" > "$HOME/.ccache-bin/clang"
          printf '#!/bin/sh\nexec ccache "%s" -Qunused-arguments "$@"\n' "$GITHUB_WORKSPACE/clang/bin/clang++" > "$HOME/.ccache-bin/clang++"
          chmod +x "$HOME/.ccache-bin/clang" "$HOME/.ccache-bin/clang++"
          export PATH="$HOME/.ccache-bin:$PATH"
          ccache -z >/dev/null 2>&1 || true  # reset statistik agar `ccache -s` akhir = run ini saja
          export KCFLAGS="-Wno-c2x-extensions -Wno-error=c2x-extensions -Wno-c23-extensions -Wno-error=c23-extensions -Wno-unknown-warning-option"
          if [ -d "KernelSU-Next" ]; then
            export KCFLAGS="$KCFLAGS -I$PWD/drivers/kernelsu -I$PWD/drivers/kernelsu/include -I$PWD/KernelSU-Next -I$PWD/KernelSU-Next/kernel -I$PWD/KernelSU-Next/kernel/include"
          fi

          # android16-6.12 builds ashmem in Rust, and Rust with MODVERSIONS needs
          # gendwarfksyms. These have to be on every make command line, or kbuild sees
          # the system rustc and quietly drops CONFIG_RUST.
          #
          # LIBCLANG_PATH sudah di-set di step Setup Rust (libclang sistem). JANGAN
          # diarahkan ke $GITHUB_WORKSPACE/clang/lib — Neutron tidak membawa libclang.so.
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/clang/lib:${LD_LIBRARY_PATH:-}"

          # Array, bukan string: nilai ber-spasi (HOSTLDFLAGS) akan dipecah jadi
          # beberapa argv bila diekspansi lewat `make $MAKE_ARGS` tanpa quote.
          MAKE_ARGS=(
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            WERROR=0
            LOCALVERSION=
            RUSTC="${RUSTC_PATH}"
            HOSTRUSTC="${RUSTC_PATH}"
            BINDGEN="${BINDGEN_PATH}"
            HOSTCFLAGS="-I/usr/include"
            HOSTLDFLAGS="-L/usr/lib/x86_64-linux-gnu -Wl,-rpath,/usr/lib/x86_64-linux-gnu"
          )
          # Tree ini men-set `KBUILD_OUTPUT := out` di Makefile (bukan O= dari CLI),
          # jadi objtree SELALU ./out dan config aktif ada di out/.config.
          # Menulis ke .config di root source tree membuat outputmakefile menolak
          # build dengan "The source tree is not clean, please run 'make mrproper'".
          rm -f .config

          # 1. Defconfig dasar
          make "${MAKE_ARGS[@]}" -j"$(nproc --all)" ${{ inputs.codename }}_defconfig

          if [ -f out/.config ]; then
            CONFIG_FILE="out/.config"
          elif [ -f .config ]; then
            CONFIG_FILE=".config"
          else
            echo "::error::Config hasil defconfig tidak ditemukan (out/.config maupun .config)."
            exit 1
          fi
          echo "[+] Menggunakan config: $CONFIG_FILE"

          # 2. Injeksi konfigurasi ke config aktif
          if [ "${{ matrix.variant }}" == "KernelSU-Next" ]; then
            ./scripts/config --file "$CONFIG_FILE" \
              -e CONFIG_KSU \
              -e CONFIG_KSU_SUSFS
          else
            echo "[*] Varian ${{ matrix.variant }} — injeksi CONFIG_KSU dilewati."
          fi
          # LTO dibiarkan LTO_NONE seperti gki_defconfig/gs201_defconfig.
          # ThinLTO mematikan GENDWARFKSYMS (depends on !LTO), yang lalu mematikan
          # CONFIG_RUST (depends on !MODVERSIONS || GENDWARFKSYMS) dan berantai ke
          # CONFIG_ASHMEM (depends on SHMEM && RUST).
          ./scripts/config --file "$CONFIG_FILE" \
            -d CONFIG_WERROR \
            -d CONFIG_LTO_GCC \
            -d CONFIG_LTO_CLANG_FULL \
            -d CONFIG_LTO_CLANG_THIN \
            -e CONFIG_LTO_NONE \
            -e CONFIG_GENDWARFKSYMS \
            -e CONFIG_RUST \
            -e CONFIG_ASHMEM \
            -m CONFIG_ANDROID_BINDER_IPC_RUST \
            -e CONFIG_NTSYNC \
            -e CONFIG_NOMOUNT \
            -e CONFIG_THREAD_INFO_IN_TASK \
            -e CONFIG_DEBUG_KERNEL \
            -e CONFIG_KALLSYMS \
            -e CONFIG_KALLSYMS_ALL \
            -e CONFIG_OVERLAY_FS \
            -e CONFIG_FUSE_FS \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_FUSE_BPF

          # scripts/config membuat file baru bila path salah; pastikan itu tidak terjadi.
          if [ ! -s "$CONFIG_FILE" ]; then
            echo "::error::Injeksi config gagal — $CONFIG_FILE kosong/tidak ada."
            exit 1
          fi
          if [ -f .config ] && [ "$CONFIG_FILE" != ".config" ]; then
            echo "::error::Ada .config nyasar di root source tree — build akan ditolak mrproper."
            exit 1
          fi

          echo "=== CONFIG_KSU (& status KPROBES/MODULES) sebelum olddefconfig ==="
          grep -E "CONFIG_(KSU|KPROBES|KRETPROBES|MODULES|INTEGRATE_MODULES)" "$CONFIG_FILE" || true

          make "${MAKE_ARGS[@]}" olddefconfig 2>&1 | tee /tmp/olddefconfig.log

          echo "=== CONFIG_KSU (& status KPROBES/MODULES) setelah olddefconfig ==="
          grep -E "CONFIG_(KSU|KPROBES|KRETPROBES|MODULES|INTEGRATE_MODULES)" "$CONFIG_FILE" || true

          grep -q "^CONFIG_LTO_NONE=y" "$CONFIG_FILE" || {
            echo "::warning::CONFIG_LTO_NONE tidak aktif setelah olddefconfig, memeriksa status LTO..."
            grep "CONFIG_LTO" "$CONFIG_FILE" || true
          }

          echo "========== Cek CONFIG_KSU setelah olddefconfig =========="
          MISSING=0
          if [ "${{ matrix.variant }}" == "KernelSU-Next" ]; then
            if ! grep -q "^CONFIG_KSU=y" "$CONFIG_FILE"; then
              echo "::error::CONFIG_KSU tidak aktif setelah olddefconfig!"
              MISSING=1
            fi
            if ! grep -q "^CONFIG_KSU_SUSFS=y" "$CONFIG_FILE"; then
              echo "::error::CONFIG_KSU_SUSFS tidak aktif setelah olddefconfig!"
              MISSING=1
            fi
          else
            echo "::notice::Varian ${{ matrix.variant }} — pemeriksaan CONFIG_KSU dilewati (tanpa root)."
          fi
          echo "========== Cek CONFIG_NOMOUNT setelah olddefconfig =========="
          if ! grep -q "^CONFIG_NOMOUNT=y" "$CONFIG_FILE"; then
            echo "::warning::CONFIG_NOMOUNT tidak aktif, menginjeksi ulang..."
            ./scripts/config --file "$CONFIG_FILE" -e CONFIG_NOMOUNT
            make "${MAKE_ARGS[@]}" olddefconfig
          fi
          if grep -q "^CONFIG_NOMOUNT=y" "$CONFIG_FILE"; then
            echo "[+] CONFIG_NOMOUNT aktif (=y)."
          else
            echo "::error::CONFIG_NOMOUNT gagal diaktifkan!"
            MISSING=1
          fi

          echo "========== Cek CONFIG_RUST & CONFIG_ASHMEM setelah olddefconfig =========="
          grep -E "CONFIG_(RUST|ASHMEM|ANDROID_BINDER_IPC_RUST|GENDWARFKSYMS|LTO)" "$CONFIG_FILE" || true
          # Ashmem 6.12 dibangun dari Rust, jadi RUST wajib benar-benar aktif.
          # Rantai dependensi: RUST <- GENDWARFKSYMS <- !LTO, dan ASHMEM <- RUST.
          if ! grep -q "^CONFIG_RUST=y" "$CONFIG_FILE"; then
            echo "::error::CONFIG_RUST tidak aktif — ashmem akan hilang. Cek bindgen/rustc di /tmp/olddefconfig.log:"
            grep -iE "rust|bindgen" /tmp/olddefconfig.log | tail -30 || true
            MISSING=1
          fi
          if ! grep -q "^CONFIG_ASHMEM=y" "$CONFIG_FILE"; then
            echo "::error::CONFIG_ASHMEM tidak aktif (butuh CONFIG_RUST=y)."
            MISSING=1
          fi
          if ! grep -q "^CONFIG_GENDWARFKSYMS=y" "$CONFIG_FILE"; then
            echo "::error::CONFIG_GENDWARFKSYMS tidak aktif (butuh !LTO) — Rust+MODVERSIONS akan gagal."
            MISSING=1
          fi
          if [ "$RUST_BINDER" = "true" ]; then
            # Harus =m: built-in (=y) bersama C binder gagal link (tracepoint binder_* terdefinisi
            # ganda di binder.o dan rust_binder_events.o, run 44032270252). Sebagai modul, Rust Binder
            # menghapus event C binder saat mengambil alih (binder_remove_trace_events).
            if ! grep -q "^CONFIG_ANDROID_BINDER_IPC_RUST=m" "$CONFIG_FILE"; then
              echo "::error::rust_binder=true tetapi CONFIG_ANDROID_BINDER_IPC_RUST bukan =m (butuh RUST && MMU && NET)."
              MISSING=1
            fi
            # C binder harus tetap ada: dialah yang dipakai bila binder.impl=rust tidak di-set.
            if ! grep -q "^CONFIG_ANDROID_BINDER_IPC=y" "$CONFIG_FILE"; then
              echo "::error::CONFIG_ANDROID_BINDER_IPC hilang; C binder wajib tetap built-in."
              MISSING=1
            fi
          fi

          if ! grep -q "^CONFIG_KALLSYMS_ALL=y" "$CONFIG_FILE"; then
            echo "::warning::CONFIG_KALLSYMS_ALL tidak aktif, menginjeksi langsung ke $CONFIG_FILE..."
            ./scripts/config --file "$CONFIG_FILE" -e CONFIG_DEBUG_KERNEL -e CONFIG_KALLSYMS -e CONFIG_KALLSYMS_ALL
            make "${MAKE_ARGS[@]}" olddefconfig
          fi
          if [ $MISSING -eq 1 ]; then
            grep -iE "ksu|rust|bindgen|ashmem" /tmp/olddefconfig.log | tail -50 || true
            exit 1
          fi
          # Install sanitised UAPI headers ke $(objtree)/usr/include -- hanya varian KSU.
          # Kbuild KernelSU mengaktifkan preinit HANYA bila $(objtree)/usr/include/linux/unistd.h
          # ada (kernel/Kbuild). Bila tidak, -DKSU_NO_PREINIT hanya berlaku untuk unit KernelSU,
          # sedangkan fs/exec.c (patch SUSFS) tetap mereferensikan ksu_setup_preinit_file() ->
          # "undefined reference" saat link, SETELAH 20+ menit kompilasi. Gagalkan di sini.
          # objtree = direktori config aktif (out/ untuk tree ini), bukan root source.
          if [ "${{ matrix.variant }}" == "KernelSU-Next" ]; then
            make "${MAKE_ARGS[@]}" headers_install || {
              echo "::error::make headers_install gagal — preinit runner KernelSU tidak akan dibangun dan link akan gagal."
              exit 1
            }
            OBJTREE="$(dirname "$CONFIG_FILE")"
            if [ ! -f "$OBJTREE/usr/include/linux/unistd.h" ]; then
              echo "::error::$OBJTREE/usr/include/linux/unistd.h tidak ada setelah headers_install — preinit KernelSU nonaktif; link akan gagal (undefined reference ksu_setup_preinit_file)."
              exit 1
            fi
            echo "[+] UAPI headers siap ($OBJTREE/usr/include) untuk preinit runner KernelSU."
          fi

          # 3. Kompilasi Paralel
          # Log build disimpan; saat gagal, error pertama diangkat jadi anotasi ::error:: (terlihat di
          # halaman run) -- menggantikan re-run `make -j1` yang membangun ulang sisa target satu-thread.
          if ! make "${MAKE_ARGS[@]}" LOCALVERSION_AUTO=0 -j"$(nproc --all)" Image.lz4 dtbs 2>&1 | tee /tmp/build.log; then
            echo "========== Ringkasan error build =========="
            grep -nE 'error:|undefined (reference|symbol)|No rule to make target|\*\*\* \[' /tmp/build.log | head -40 || true
            grep -E 'error:|undefined (reference|symbol)|No rule to make target' /tmp/build.log \
              | grep -v '^make' | awk '!seen[$0]++' | head -10 | while IFS= read -r l; do echo "::error::$l"; done || true
            exit 1
          fi

          # rust_binder.ko dari build ini: nama simbol Rust membawa hash crate per build, jadi
          # rust_binder.ko YAAP (system_dlkm) tidak bisa di-link ke kernel ini. Port memuatnya lewat
          # kcmdlinemodprobe AOSP (/system/lib/modules, early-init) bila cmdline berisi binder.impl=rust.
          if [ "$RUST_BINDER" = "true" ]; then
            if ! make "${MAKE_ARGS[@]}" LOCALVERSION_AUTO=0 -j"$(nproc --all)" drivers/android/binder/rust_binder.ko 2>&1 | tee /tmp/rust_binder.log; then
              grep -nE 'error:|undefined|\*\*\* \[' /tmp/rust_binder.log | head -20 || true
              echo "::error::rust_binder.ko gagal dibangun."
              exit 1
            fi
            KO="$(find out -name rust_binder.ko -path '*drivers/android/binder/*' | head -1)"
            if [ -z "$KO" ] || [ ! -s "$KO" ]; then
              echo "::error::rust_binder.ko tidak ditemukan setelah build."
              exit 1
            fi
            KO_OUT="$GITHUB_WORKSPACE/${{ matrix.variant }}-${{ inputs.codename }}-6.12-rust_binder.ko"
            cp "$KO" "$KO_OUT"
            if [ -x "$GITHUB_WORKSPACE/clang/bin/llvm-strip" ]; then
              "$GITHUB_WORKSPACE/clang/bin/llvm-strip" --strip-debug "$KO_OUT"
            fi
            strings "$KO_OUT" | grep -E "^(vermagic|name)=" || true
            sha256sum "$KO_OUT"
          fi

          ccache -s || true

      - name: Copy Images & Create ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          KREL="$(cat out/include/config/kernel.release 2>/dev/null || cat include/config/kernel.release)"
          echo "[+] Kernel release: $KREL"
          case "$KREL" in *"$KERNEL_LOCALVERSION") ;; *) echo "::error::Kernel release '$KREL' tidak berakhiran $KERNEL_LOCALVERSION."; exit 1 ;; esac
          case "$KREL" in *dirty*|*+) echo "::error::Kernel release '$KREL' memuat -dirty/+."; exit 1 ;; esac
          if [ -f ./out/arch/arm64/boot/Image.lz4 ]; then
            cp ./out/arch/arm64/boot/Image.lz4 ../AnyKernel3/Image.lz4
          elif [ -f ./out/arch/arm64/boot/Image ]; then
            lz4 -9 -f ./out/arch/arm64/boot/Image ../AnyKernel3/Image.lz4
          elif [ -f ./arch/arm64/boot/Image.lz4 ]; then
            cp ./arch/arm64/boot/Image.lz4 ../AnyKernel3/Image.lz4
          elif [ -f ./arch/arm64/boot/Image ]; then
            lz4 -9 -f ./arch/arm64/boot/Image ../AnyKernel3/Image.lz4
          fi

          DTB_FOUND=0
          for dtb_dir in "./google-modules/soc/gs/arch/arm64/boot/dts/google" "./out/google-modules/soc/gs/arch/arm64/boot/dts/google" "./out/google-devices/${{ inputs.codename }}/dts" "./out/arch/arm64/boot/dts" "./google-devices/${{ inputs.codename }}/dts" "./arch/arm64/boot/dts/google-devices/${{ inputs.codename }}/dts" "./arch/arm64/boot/dts"; do
            if compgen -G "${dtb_dir}/*.dtb" > /dev/null; then
              cat ${dtb_dir}/*.dtb > ../AnyKernel3/dtb
              DTB_FOUND=1
              break
            fi
          done
          if [ $DTB_FOUND -eq 0 ]; then
            find . -name "*.dtb" -exec cat {} + > ../AnyKernel3/dtb 2>/dev/null || true
          fi

          if [ ! -f ../AnyKernel3/Image.lz4 ]; then
            echo "::error::Image.lz4 tidak ditemukan!"
            exit 1
          fi
          if [ ! -s ../AnyKernel3/dtb ]; then
            echo "::error::dtb tidak ditemukan atau kosong!"
            exit 1
          fi

          # Sama seperti build 6.1: anykernel.sh dipakai apa adanya dari branch
          # sultan-gs201, hanya versi Android dan nama kernel yang disesuaikan.
          # Urutan flash di sana sudah benar untuk gs201:
          #   boot            -> split_boot; flash_boot  (Image.lz4 masuk boot)
          #   rm Image.lz4    -> agar kernel tidak ikut ditulis ke partisi berikut
          #   vendor_kernel_boot -> split_boot; flash_boot (hanya dtb)
          sed -i 's/supported.versions=.*/supported.versions=14-17/' ../AnyKernel3/anykernel.sh
          sed -i 's/kernel.string=.*/kernel.string=Sidharthify 6.12 Kernel for Pixel 7 Series (gs201)/' ../AnyKernel3/anykernel.sh

          # Pastikan sed benar-benar mendarat dan identitas device tetap utuh.
          for expect in "supported.versions=14-17" "device.name1=cheetah" "device.name2=panther" "device.name3=lynx"; do
            grep -q "$expect" ../AnyKernel3/anykernel.sh || {
              echo "::error::anykernel.sh tidak memuat '$expect' setelah sed."
              exit 1
            }
          done

          cd ../AnyKernel3
          ZIP_NAME="${{ matrix.variant }}-${{ inputs.codename }}-6.12-Sidharthify-clang.zip"
          zip -qr9 "../$ZIP_NAME" . -x '.git/*' -x '.github/*' -x '*.zip' -x 'README.md'
          cd ..
          sha256sum "$ZIP_NAME" > "${ZIP_NAME}.sha256"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "ZIP_SHA=$(cat ${ZIP_NAME}.sha256 | cut -d' ' -f1)" >> "$GITHUB_ENV"

          # Image.lz4 mentah juga dirilis (untuk yang flash via boot.img sendiri / magiskboot).
          # Nama unik per kernel+varian: rilis mem-flatten semua artefak ke satu direktori.
          IMG_NAME="${ZIP_NAME%.zip}-Image.lz4"
          cp AnyKernel3/Image.lz4 "$IMG_NAME"
          sha256sum "$IMG_NAME" > "${IMG_NAME}.sha256"
          echo "IMG_NAME=$IMG_NAME" >> "$GITHUB_ENV"

      - name: Generate Workflow Summary
        if: ${{ always() }}
        shell: bash
        run: |
          ZIP_NAME="${ZIP_NAME:-<tidak terbentuk>}"
          ZIP_SHA="${ZIP_SHA:-<tidak tersedia>}"
          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ### 🚀 Build Summary: ${{ inputs.codename }} 6.12 (${{ matrix.variant }}) [Clang]
          | Komponen | Status / Nilai |
          |---|---|
          | **Kernel Version** | \`Linux 6.12 (Sidharthify)\` |
          | **Compiler** | \`Neutron Clang 06092026\` |
          | **LTO** | \`LTO_NONE (Rust/ashmem aktif)\` |
          | **Variant** | \`${{ matrix.variant }}\` |
          | **Job Status** | \`${{ job.status }}\` |
          | **Artifact Name** | \`${ZIP_NAME}\` |
          | **SHA-256** | \`${ZIP_SHA}\` |
          EOF

      - name: Fetch Manager APK
        if: ${{ matrix.variant == 'KernelSU-Next' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - << 'EOF'
          import os, json, urllib.request

          token = os.environ.get("GH_TOKEN", "")
          headers = {"User-Agent": "Mozilla/5.0"}
          if token:
              headers["Authorization"] = f"token {token}"

          repo = "KernelSU-Next/KernelSU-Next"

          try:
              # Ambil beberapa rilis: yang terbaru bisa saja pre-release / tanpa aset.
              req = urllib.request.Request(f"https://api.github.com/repos/{repo}/releases?per_page=10", headers=headers)
              with urllib.request.urlopen(req, timeout=15) as resp:
                  releases = json.loads(resp.read().decode("utf-8"))
              target = None
              for rel in releases:
                  if rel.get("draft") or rel.get("prerelease"):
                      continue
                  if any(a["name"].endswith(".apk") for a in rel.get("assets", [])):
                      target = rel
                      break
              if target is None:
                  print(f"[!] Warning: tidak ada rilis stabil berisi .apk di {repo}")
              else:
                  print(f"[+] Menggunakan rilis {target.get('tag_name')}")
                  assets = target.get("assets", [])
                  apks = [a for a in assets if a["name"].endswith(".apk")]
                  for a in apks:
                      print(f"[+] Downloading {a['name']} from {repo}...")
                      try:
                          req_apk = urllib.request.Request(a["browser_download_url"], headers={"User-Agent": "Mozilla/5.0"})
                          with urllib.request.urlopen(req_apk, timeout=30) as resp_apk, open(a["name"], "wb") as f_out:
                              f_out.write(resp_apk.read())
                      except Exception as dl_err:
                          print(f"[!] Warning: Gagal mengunduh {a['name']}: {dl_err}")
          except Exception as e:
              print(f"[!] Warning: Failed to query {repo}: {e}")
          EOF

      - name: Record Upstream SHAs
        # Di akhir + always(): mencatat SHA yang BENAR-BENAR dibangun (bukan tip remote saat
        # step awal), termasuk saat build gagal -- itu justru saat manifest paling berguna.
        if: ${{ always() }}
        shell: bash
        run: |
          python3 - << 'EOF'
          import json, os, subprocess

          def local_head(path):
              if not os.path.isdir(path):
                  return "n/a"
              try:
                  return subprocess.run(
                      ["git", "-C", path, "rev-parse", "HEAD"],
                      capture_output=True, text=True, timeout=30, check=True,
                  ).stdout.strip() or "unknown"
              except Exception as e:
                  print(f"::warning::rev-parse gagal untuk {path}: {e}")
                  return "unknown"

          cfg = os.environ["CONFIG"]
          shas = {
              "kernel_tree_sidharthify_6.12": local_head(cfg),
              "KernelSU-Next_pershoot": local_head(cfg + "/KernelSU-Next"),
              "susfs4ksu_simonpunk_6.12": local_head("susfs4ksu"),
              "nomount_dev": local_head(cfg + "/NoMount"),
          }
          with open("upstream-shas.json", "w") as f:
              json.dump(shas, f, indent=2)
          for k, v in shas.items():
              print(f"[+] {k} = {v}")
          EOF
          cp upstream-shas.json "$GITHUB_WORKSPACE/upstream-shas-${{ matrix.variant }}-6.12-clang.json"
          {
            echo "### Upstream SHAs (6.12 Sidharthify)"
            echo ""
            python3 -c "import json; [print('- ' + k + ': ' + v) for k, v in json.load(open('upstream-shas.json')).items()]"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Upstream SHAs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: upstream-shas-${{ inputs.codename }}-${{ matrix.variant }}-6.12-clang
          path: |
            ${{ github.workspace }}/upstream-shas-${{ matrix.variant }}-6.12-clang.json

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.codename }}-${{ matrix.variant }}-6.12-clang
          path: |
            ${{ github.workspace }}/*.zip
            ${{ github.workspace }}/*.sha256
            ${{ github.workspace }}/*-Image.lz4
            ${{ github.workspace }}/*-rust_binder.ko
            !${{ github.workspace }}/*.apk
            !${{ github.workspace }}/NoMount*.zip
            !${{ github.workspace }}/NoMount*.sha256

      - name: Upload NoMount Metamodule Artifact
        if: ${{ inputs.build_nomount && strategy.job-index == 0 }}
        uses: actions/upload-artifact@v4
        with:
          # Satu artefak per run (lihat gate di atas) -> nama tetap, tanpa varian.
          name: NoMount-Metamodule
          path: |
            ${{ github.workspace }}/NoMount.zip
            ${{ github.workspace }}/NoMount.zip.sha256
          if-no-files-found: error

      - name: Upload Manager APK Artifact
        if: ${{ matrix.variant == 'KernelSU-Next' }}
        uses: actions/upload-artifact@v4
        with:
          name: Manager-APK-${{ inputs.codename }}-${{ matrix.variant }}-6.12-clang
          path: |
            ${{ github.workspace }}/*.apk
          if-no-files-found: warn

      - name: Collect .rej files
        if: ${{ always() }}
        id: collect_rej
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf rej
          mkdir -p rej
          found="false"
          while IFS= read -r -d '' rej_file; do
            found="true"
            original_file="${rej_file%.rej}"
            rej_rel="${rej_file#./}"
            original_rel="${original_file#./}"
            mkdir -p "rej/$(dirname "$rej_rel")"
            cp -f "$rej_file" "rej/$rej_rel"
            if [[ -f "$original_file" ]]; then
              mkdir -p "rej/$(dirname "$original_rel")"
              cp -f "$original_file" "rej/$original_rel"
            fi
          done < <(find . -type f -name '*.rej' -print0)
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Zip collected .rej bundle
        if: ${{ always() && steps.collect_rej.outputs.found == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          zip -r "rej-${{ inputs.codename }}-${{ matrix.variant }}-6.12-clang.zip" rej

      - name: Upload .rej bundle
        if: ${{ always() && steps.collect_rej.outputs.found == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: rej-${{ inputs.codename }}-${{ matrix.variant }}-6.12-clang
          path: |
            rej-${{ inputs.codename }}-${{ matrix.variant }}-6.12-clang*.zip
