name: Sidharthify (Clang)
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      codename:
        description: "Device codename (e.g. gs201)"
        required: true
        default: "gs201"
        type: string
      variants:
        description: "Varian yang di-build"
        required: false
        default: '["KernelSU-Next"]'
        type: choice
        options:
          - '["KernelSU-Next"]'
          - '["KernelSU-Next", "NoRoot"]'
          - '["NoRoot"]'
      build_nomount:
        description: "Build & upload NoMount metamodule (sekali, di job matrix pertama)"
        required: false
        type: boolean
        default: true
      debug_panic:
        description: "Aktifkan panic on oops / hung task / soft lockup (capture ramoops untuk bring-up). Matikan untuk rilis daily-driver."
        required: false
        type: boolean
        default: true
      rust_binder:
        description: "Bangun juga rust_binder.ko (=m) dari build kernel yang sama dan unggah sebagai artefak. Dipakai hanya dengan binder.impl=rust di cmdline."
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      codename:
        required: true
        type: string
      variants:
        description: "Varian yang di-build (JSON array)"
        required: false
        type: string
        default: '["KernelSU-Next"]'
      debug_panic:
        description: "Aktifkan panic on oops / hung task / soft lockup (capture ramoops untuk bring-up). Matikan untuk rilis daily-driver."
        required: false
        type: boolean
        default: true
      rust_binder:
        description: "Bangun juga rust_binder.ko (=m) dari build kernel yang sama dan unggah sebagai artefak. Dipakai hanya dengan binder.impl=rust di cmdline."
        required: false
        type: boolean
        default: false
      build_nomount:
        description: "Build & upload NoMount metamodule (sekali, di job matrix pertama)"
        required: false
        type: boolean
        default: true

jobs:
  build-kernel-sidharthify-kernelsu-susfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      # Pin upstream. Patch di patches/ divalidasi (0 fuzz/0 offset/0 reject) terhadap SHA ini;
      # bump SHA bersamaan dengan regenerasi patch. Harus SHA LENGKAP (40 hex): fetch-by-SHA
      # tidak menerima singkatan. Pin menjaga build tetap reproducible walau upstream
      # force-push (pershoot/KernelSU-Next dev-susfs pernah di-rebase).
      SUSFS_COMMIT: "9b0b13f069673b9b07b713a5c66977de4d62b175"
      KSUN_COMMIT: "39b15dead6fa806cb3582f866b081fa1d9e1c9e4"
      # NoMount (maxsteeel/nomount): dulu mengikuti tip branch dev + menjalankan setup.sh mentah
      # dari dev -> kode tak ter-review langsung masuk kernel. Kini setup.sh dan source di-pin.
      NOMOUNT_PIN: "f83db94afa3e480584ee57045fc7f5efdde83040"
      # lkmloader (maxsteeel/lkmloader): customize.sh NoMount memindahkan bin/lkmloader-$ARCH ke
      # lkm/lkmloader; tanpanya instalasi modul mencetak error mv/set_perm.
      LKMLOADER_PIN: "03fa70ea33f90fa21729d4dd26da7920ee370b71"
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}

    steps:
      - name: Validate Inputs
        shell: bash
        env:
          # Lewat env, bukan interpolasi ${{ }} langsung di script (anti script-injection).
          CODENAME: ${{ inputs.codename }}
        run: |
          # Validasi awal: tree kernel sidharthify hanya untuk gs201.
          # Gagal cepat sebelum runner mengunduh toolchain bila codename salah.
          case "$CODENAME" in
            gs201)
              echo "[+] Codename gs201 valid (tree sidharthify gs201-only)."
              ;;
            *)
              echo "::error::Codename '$CODENAME' tidak didukung! Tree kernel sidharthify hanya untuk gs201."
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner (background)
        shell: bash
        run: |
          # Dulu ~2 menit MEMBLOKIR job (run 40617356741: 1m53s / 2m13s) sebelum apa pun bisa jalan.
          # Kini jalan di background, paralel dengan apt/toolchain/clone; step "Wait for disk
          # cleanup" menunggu sebelum build (satu-satunya tahap yang butuh ruang besar).
          # Proses background dari satu step tetap hidup hingga job selesai.
          df -h / | tail -1
          nohup sudo sh -c 'rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift; docker image prune --all --force' \
            > /tmp/disk-cleanup.log 2>&1 &
          echo $! > /tmp/disk-cleanup.pid
          echo "[+] Disk cleanup dimulai di background (pid $(cat /tmp/disk-cleanup.pid))"

      - name: Install Essential Build Tools
        shell: bash
        run: |
          sudo apt-get update
          # dwarves      -> pahole >= 1.24, wajib untuk CONFIG_DEBUG_INFO_BTF + Rust (PAHOLE_HAS_LANG_EXCLUDE)
          # libclang-18  -> libclang.so untuk bindgen. Kernel meneruskan CC_FLAGS_CFI
          #                 (-fsanitize=kcfi, -fsanitize-cfi-icall-experimental-normalize-integers)
          #                 ke bindgen; flag itu baru dikenal LLVM >= 17. libclang 16
          #                 (default libclang-dev di noble) menolaknya dan bindgen panic.
          sudo apt-get install -y --no-install-recommends libssl-dev libelf-dev libdw-dev elfutils bc bison flex perl lz4 ccache zlib1g-dev binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi cmake zstd dwarves libclang-18-dev

      - name: Setup Rust 1.82.0 & Bindgen (Android 16 6.12)
        shell: bash
        run: |
          set -euo pipefail
          echo "[+] Setting up Rust 1.82.0 and bindgen for kernel Rust support (ashmem)..."
          rustup toolchain install 1.82.0 --profile minimal
          rustup default 1.82.0
          # rustfmt: kbuild memformat binding yang di-generate; tanpanya log berisi
          # "error: 'rustfmt' is not installed" (6x di run 40617356741, non-fatal tapi menyesatkan).
          rustup component add rust-src rustfmt --toolchain 1.82.0
          rustup target add aarch64-unknown-none --toolchain 1.82.0 2>/dev/null || true

          RUST_SYSROOT=$(rustc +1.82.0 --print sysroot)
          echo "RUST_SYSROOT=$RUST_SYSROOT" >> "$GITHUB_ENV"
          echo "RUSTC_PATH=$RUST_SYSROOT/bin/rustc" >> "$GITHUB_ENV"

          # bindgen 0.69.5 (bukan 0.69.4): libclang >= 19.1 punya bug kompatibilitas
          # dengan bindgen < 0.69.5 (rust-lang/rust-bindgen#2824), yang dideteksi
          # oleh scripts/rust_is_available.sh di tree ini.
          # Arsip berisi satu direktori pembungkus, jadi --strip-components=1 wajib:
          # tanpa itu binary ada di bindgen-bin/bindgen-cli-x86_64-unknown-linux-gnu/bindgen
          mkdir -p "$GITHUB_WORKSPACE/bindgen-bin"
          curl -fsSL -o /tmp/bindgen.tar.xz https://github.com/rust-lang/rust-bindgen/releases/download/v0.69.5/bindgen-cli-x86_64-unknown-linux-gnu.tar.xz
          echo "b7e2321ee8c617f14ccc5b9f39b3a804db173ee217e924ad93ed16af6bc62b1d  /tmp/bindgen.tar.xz" | sha256sum -c --quiet - || {
            echo "::error::Checksum bindgen 0.69.5 tidak cocok."
            exit 1
          }
          tar -xJ --strip-components=1 -C "$GITHUB_WORKSPACE/bindgen-bin" -f /tmp/bindgen.tar.xz
          test -f "$GITHUB_WORKSPACE/bindgen-bin/bindgen" || {
            echo "::error::bindgen tidak ditemukan setelah ekstraksi (layout arsip berubah?)"
            ls -la "$GITHUB_WORKSPACE/bindgen-bin"
            exit 1
          }
          chmod +x "$GITHUB_WORKSPACE/bindgen-bin/bindgen"
          echo "BINDGEN_PATH=$GITHUB_WORKSPACE/bindgen-bin/bindgen" >> "$GITHUB_ENV"

          # bindgen memuat libclang.so saat runtime. Neutron Clang hanya membawa
          # lib/clang/<ver>/lib/libclang_rt.* (runtime compiler-rt), BUKAN libclang.so,
          # jadi LIBCLANG_PATH harus menunjuk ke libclang sistem.
          #
          # PENTING: pilih libclang TERBARU, bukan yang pertama ketemu. Kernel
          # meneruskan CC_FLAGS_CFI (termasuk
          # -fsanitize-cfi-icall-experimental-normalize-integers) ke bindgen lewat
          # `bindgen_c_flags = $(c_flags)`. Flag itu baru dikenal LLVM >= 17;
          # libclang 16 di Ubuntu 24.04 menolaknya dengan
          # "error: unknown argument" dan bindgen panic.
          LIBCLANG_DIR=""
          LIBCLANG_MAJOR=0
          for d in $(ls -d /usr/lib/llvm-*/lib 2>/dev/null | sort -V -r); do
            compgen -G "$d/libclang.so*" > /dev/null || continue
            ver="$(basename "$(dirname "$d")" | sed -n 's/^llvm-\([0-9]\+\)$/\1/p')"
            [ -n "$ver" ] || continue
            if [ "$ver" -gt "$LIBCLANG_MAJOR" ]; then
              LIBCLANG_DIR="$d"
              LIBCLANG_MAJOR="$ver"
            fi
          done
          if [ -z "$LIBCLANG_DIR" ]; then
            # Fallback: libclang di path sistem tanpa direktori llvm-<N>.
            for d in /usr/lib/x86_64-linux-gnu /usr/lib64 /usr/lib; do
              compgen -G "$d/libclang.so*" > /dev/null || continue
              LIBCLANG_DIR="$d"
              LIBCLANG_MAJOR="$(basename "$(readlink -f "$d"/libclang.so* 2>/dev/null | head -1)" 2>/dev/null | sed -n 's/^libclang\.so\.\([0-9]\+\).*/\1/p')"
              [ -n "$LIBCLANG_MAJOR" ] || LIBCLANG_MAJOR=0
              break
            done
          fi
          if [ -z "$LIBCLANG_DIR" ]; then
            echo "::error::libclang.so tidak ditemukan — pasang libclang-dev."
            exit 1
          fi
          # Guard: libclang < 17 tidak bisa mem-parse CC_FLAGS_CFI kernel ini.
          if [ "$LIBCLANG_MAJOR" -lt 17 ]; then
            echo "::error::libclang $LIBCLANG_MAJOR terlalu tua (< 17) untuk flag CFI kernel; pasang libclang-18-dev."
            exit 1
          fi
          echo "LIBCLANG_PATH=$LIBCLANG_DIR" >> "$GITHUB_ENV"
          echo "[+] libclang dir: $LIBCLANG_DIR (major $LIBCLANG_MAJOR)"

          echo "[+] Tool versions:"
          "$RUST_SYSROOT/bin/rustc" --version
          "$GITHUB_WORKSPACE/bindgen-bin/bindgen" --version
          LIBCLANG_PATH="$LIBCLANG_DIR" "$GITHUB_WORKSPACE/bindgen-bin/bindgen" --version
      - name: Download and extract Neutron Clang (06092026)
        shell: bash
        run: |
          set -euo pipefail
          echo "Fetching Neutron Clang 06092026 (Neutron-Toolchains/clang-build-catalogue)..."
          mkdir -p $GITHUB_WORKSPACE/clang
          CLANG_URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst"
          CLANG_SHA256="531083928c8e37f6b31e324dbfd0b5a8323f989b1c57ff2c1368b889b5b1bd30"
          for i in 1 2 3; do
            echo "Attempt $i: $CLANG_URL"
            HTTP_CODE="$(curl -sSL -o /tmp/clang.tar.zst -w "%{http_code}" "$CLANG_URL" || true)"
            echo "HTTP code: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] && [ -s /tmp/clang.tar.zst ]; then
              if head -c 4 /tmp/clang.tar.zst | od -An -tx1 | grep -qi "28 b5 2f fd"; then
                if echo "$CLANG_SHA256  /tmp/clang.tar.zst" | sha256sum -c --quiet - && tar -I zstd -tf /tmp/clang.tar.zst >/dev/null 2>&1; then
                  tar -I zstd -xf /tmp/clang.tar.zst -C $GITHUB_WORKSPACE/clang
                  rm -f /tmp/clang.tar.zst
                  echo "[+] Neutron Clang extracted successfully"
                  break
                else
                  echo "Checksum SHA-256 / arsip zst tidak valid, retry..." >&2
                fi
              else
                echo "File bukan zstd valid (awal):" >&2
                head -c 200 /tmp/clang.tar.zst >&2 || true
              fi
            else
              echo "retry $i failed (http=$HTTP_CODE)" >&2
            fi
            rm -f /tmp/clang.tar.zst
            sleep 5
            if [ "$i" -eq 3 ]; then
              echo "::error::Failed to download Neutron Clang after 3 attempts"
              exit 1
            fi
          done
          chmod +x $GITHUB_WORKSPACE/clang/bin/* 2>/dev/null || true
          $GITHUB_WORKSPACE/clang/bin/clang --version
          $GITHUB_WORKSPACE/clang/bin/ld.lld --version

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ inputs.codename }}-${{ matrix.variant }}-sidharthify-6.12-clang-v2-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.codename }}-${{ matrix.variant }}-sidharthify-6.12-clang-
            ccache-${{ inputs.codename }}-sidharthify-6.12-clang-

      # NoMount metamodule = userspace murni, identik untuk semua kernel & varian -> cukup SATU
      # build + upload per run: hanya job matrix pertama, dan build-kernel-release.yml menyalakan
      # build_nomount di satu workflow kernel saja.
      - name: Set up Zig Compiler
        if: ${{ inputs.build_nomount && strategy.job-index == 0 }}
        uses: jetsung/setup-zig@ece60a5f01428e90311476245667dc49e3f84513 # v0.0.4
        with:
          # Upstream NoMount membangun dengan Zig master; 0.13.0 gagal untuk flag mereka
          # (-mcmodel=tiny + musl static: 'unknown relocation'; arm-linux tanpa musl default).
          version: 0.17.1

      - name: Set CONFIG Environment Variable
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="android_kernel_google_gs201"
          echo "CONFIG=$CONFIG" >> "$GITHUB_ENV"

      - name: Clone AnyKernel3 and Dependencies (Parallel)
        shell: bash
        run: |
          set -euo pipefail
          echo "[+] Cloning dependencies in parallel (shallow + partial)..."
          # Branch dipatok EKSPLISIT ke 6.12-test: semua patch (SUSFS/KSU) divalidasi ke tree ini.
          # Dulu otomatis pindah ke "6.12" bila branch itu muncul -> tree beda tanpa validasi patch.
          KERNEL_BRANCH="6.12-test"
          if git ls-remote --exit-code --heads https://github.com/sidharthify/android_kernel_google_gs201 6.12 >/dev/null 2>&1; then
            echo "::warning::Branch '6.12' kini ada di sidharthify/android_kernel_google_gs201, tetapi build tetap memakai 6.12-test (yang divalidasi patch). Validasi patch ke 6.12 lalu ubah KERNEL_BRANCH."
          fi
          echo "[+] Target kernel branch: $KERNEL_BRANCH (Sidharthify 6.12)"

          clone_kernel() {
            local n=0
            until [ "$n" -ge 2 ]; do
              if git -c protocol.version=2 clone --depth=1 --single-branch --no-tags --filter=blob:none https://github.com/sidharthify/android_kernel_google_gs201 -b "$KERNEL_BRANCH" android_kernel_google_gs201; then
                return 0
              fi
              n=$((n+1))
              echo "retry $n/2 partial clone kernel gagal, membersihkan..." >&2
              rm -rf android_kernel_google_gs201
              sleep 5
            done
            echo "[*] Partial clone ditolak server — fallback ke shallow penuh." >&2
            git -c protocol.version=2 clone --depth=1 --single-branch --no-tags https://github.com/sidharthify/android_kernel_google_gs201 -b "$KERNEL_BRANCH" android_kernel_google_gs201
          }
          # AnyKernel3 sama seperti build 6.1: gs201 adalah perangkat yang sama,
          # jadi layout partisi (boot + vendor_kernel_boot untuk dtb) tidak
          # berubah antar versi kernel. Branch sultan-gs201 sudah menangani
          # Image.lz4 dan menghapusnya setelah flash boot (commit b71ca5d
          # "Remove Image.lz4 after boot flash") supaya kernel tidak ikut
          # ditulis ke vendor_kernel_boot -- hanya dtb yang masuk ke sana.
          git -c protocol.version=2 clone --depth=1 --single-branch --no-tags https://github.com/TheWildJames/AnyKernel3.git -b "sultan-${{ inputs.codename }}" AnyKernel3 &

          clone_kernel &

          # SuSFS upstream dari simonpunk (branch gki-android16-6.12), di-pin ke SUSFS_COMMIT
          # (SuSFS v2.4.0) -- cocok dengan patches/50_add_susfs_in_gki-android16-6.12-sidharthify.patch
          # dan dengan API v2.4.0 yang sudah dipanggil pershoot/KernelSU-Next dev-susfs
          # (sus_path_uid_filter, priority_uid_filter). Tanpa pin, tip branch bergerak dan
          # kombinasi patch+lib bisa tidak konsisten -> build rusak tanpa peringatan.
          # Ambil commit PERSIS (bukan tip branch): init + fetch --depth=1 <sha> + checkout.
          # Dicoba lagi 3x untuk gangguan jaringan; gagal keras bila SHA tidak ada/ditolak.
          fetch_pinned() {
            local url="$1" sha="$2" dir="$3" n=0
            rm -rf "$dir"
            git init -q "$dir" || return 1
            git -C "$dir" remote add origin "$url" || return 1
            until git -C "$dir" fetch -q --depth=1 origin "$sha"; do
              n=$((n+1))
              [ "$n" -lt 3 ] || { echo "::error::fetch $sha dari $url gagal setelah 3x." >&2; return 1; }
              echo "retry $n/3 fetch $dir..." >&2
              sleep 5
            done
            git -C "$dir" checkout -q --detach FETCH_HEAD || return 1
            [ "$(git -C "$dir" rev-parse HEAD)" = "$sha" ] || { echo "::error::$dir tidak di $sha." >&2; return 1; }
          }
          fetch_pinned https://gitlab.com/simonpunk/susfs4ksu.git "$SUSFS_COMMIT" susfs4ksu &

          for pid in $(jobs -p); do
            wait "$pid"
          done
          echo "[+] susfs4ksu pinned at $(git -C susfs4ksu rev-parse HEAD)"

      - name: Add Root Implementation & Version Anchoring
        if: ${{ matrix.variant == 'KernelSU-Next' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"

          rm -rf KernelSU KernelSU-Next drivers/kernelsu drivers/KernelSU
          sed -i '/kernelsu/d' drivers/Makefile 2>/dev/null || true
          sed -i '/kernelsu/d' drivers/Kconfig 2>/dev/null || true

          retry() {
            local n=0
            until [ "$n" -ge 5 ]; do
              "$@" && return 0
              n=$((n+1))
              echo "retry $n/5 failed for: $*" >&2
              sleep 5
            done
            return 1
          }

          if [ "${{ matrix.variant }}" == "KernelSU-Next" ]; then
            echo "[+] Adding KernelSU-Next dari fork pershoot (branch dev-susfs)..."
            # Pin ke KSUN_COMMIT (env job): patch 02_ksun & kontrak SUSFS divalidasi ke SHA ini.
            # Kbuild KernelSU-Next menghitung KSU_VERSION = 30000 + jumlah commit, memakai NAMA branch
            # (dev-susfs -> dev) dan menjalankan `git fetch --unshallow` saat make bila repo shallow.
            # Pin dengan HEAD terlepas + --depth=1 menghasilkan 33554, bukan 33568 seperti clone
            # -b dev-susfs (Kbuild menarik semua branch lalu merge-base ke origin/dev). Maka:
            # lacak hanya dev-susfs (-t), ambil riwayat PENUH + tag di sini, checkout sebagai branch
            # dev-susfs -> versi identik dengan clone lama, dan make tidak butuh jaringan.
            rm -rf KernelSU-Next
            git init -q KernelSU-Next
            git -C KernelSU-Next remote add -t dev-susfs origin https://github.com/pershoot/KernelSU-Next.git
            retry git -C KernelSU-Next fetch -q --tags origin "$KSUN_COMMIT"
            git -C KernelSU-Next checkout -q -B dev-susfs FETCH_HEAD
            [ "$(git -C KernelSU-Next rev-parse HEAD)" = "$KSUN_COMMIT" ] || {
              echo "::error::KernelSU-Next tidak berada di $KSUN_COMMIT."
              exit 1
            }
            [ ! -f KernelSU-Next/.git/shallow ] || { echo "::error::KernelSU-Next masih shallow — KSU_VERSION akan salah."; exit 1; }
            echo "[+] KernelSU-Next $(git -C KernelSU-Next describe --tags --abbrev=0 2>/dev/null || echo '?') @ ${KSUN_COMMIT:0:12} -> KSU_VERSION=$((30000 + $(git -C KernelSU-Next rev-list --count HEAD)))"
            ln -sf ../KernelSU-Next/kernel drivers/kernelsu
            # Fix Linux 6.12 header cleanup: sertakan <linux/pid.h> untuk task_pid_nr
            sed -i '1i#include <linux/pid.h>' KernelSU-Next/kernel/compat/samsung_kdp.c 2>/dev/null || true
            sed -i '1i#include <linux/pid.h>' KernelSU-Next/kernel/sulog/event.c 2>/dev/null || true
            sed -i '1i#include <linux/pid.h>' KernelSU-Next/kernel/include/ksu_samsung_kdp.h 2>/dev/null || true
            sed -i '1i#include <linux/pid.h>' KernelSU-Next/kernel/include/klog.h 2>/dev/null || true

            # Salin header uapi dan include langsung ke semua direktori target agar selalu ditemukan di out-of-tree build 6.12
            cp -a KernelSU-Next/uapi KernelSU-Next/kernel/ 2>/dev/null || true
            cp -a KernelSU-Next/uapi KernelSU-Next/kernel/core/ 2>/dev/null || true
            cp -a KernelSU-Next/uapi KernelSU-Next/kernel/policy/ 2>/dev/null || true
            cp -a KernelSU-Next/uapi drivers/ 2>/dev/null || true
            cp -f KernelSU-Next/kernel/include/* KernelSU-Next/kernel/compat/ 2>/dev/null || true
            cp -f KernelSU-Next/kernel/include/* KernelSU-Next/kernel/core/ 2>/dev/null || true
            cp -f KernelSU-Next/kernel/include/* KernelSU-Next/kernel/policy/ 2>/dev/null || true
            cp -f KernelSU-Next/kernel/include/* KernelSU-Next/kernel/ 2>/dev/null || true
            ln -sf ../uapi KernelSU-Next/kernel/uapi 2>/dev/null || true

            echo "[+] Menerapkan patch KernelSU-Next hook build..."
            # Patch ini hanya menambah subdir-ccflags-y + memperbaiki endif KPROBES.
            # Jangan di-`|| true`: bila upstream Kbuild berubah, kita ingin tahu di sini
            # (dengan fuzz besar) daripada gagal jauh di tahap compile.
            if ! patch -p1 -d KernelSU-Next < "$GITHUB_WORKSPACE/patches/02_ksun_sultan.patch"; then
              echo "::error::Patch 02_ksun_sultan.patch gagal — upstream KernelSU-Next/Kbuild berubah?"
              exit 1
            fi
            if grep -q "subdir-ccflags-y.*KernelSU-Next" KernelSU-Next/kernel/Kbuild; then
              echo "[+] subdir-ccflags-y terpasang di kernel/Kbuild."
            else
              echo "::warning::subdir-ccflags-y tidak ditemukan di kernel/Kbuild (hunk hanya fuzz)."
            fi

            # Perbaiki resolusi KSU_KERNEL_DIR untuk build out-of-tree (6.12).
            # scripts/Makefile.build di ACK 6.12 men-set
            #   src := $(if $(VPATH),$(VPATH)/)$(obj)
            # sehingga src SUDAH membawa prefiks srctree ("../drivers/kernelsu").
            # kernel/Kbuild lalu melakukan KSU_KERNEL_DIR := $(srctree)/$(src)
            # -> "../../drivers/kernelsu", yang dari objtree menunjuk ke LUAR tree:
            #   No rule to make target '../../drivers/kernelsu/preinit/runner/runner.c'
            # Di 6.1 tidak kena karena scripts/Makefile.build-nya masih
            #   src := $(obj)
            # $(abspath $(src)) benar untuk ketiga kasus: in-tree, objtree di dalam
            # source tree, dan O= absolut. Pola dibuat toleran CRLF karena file
            # dari git bisa punya line ending CRLF.
            sed -i 's|^KSU_KERNEL_DIR := \$(srctree)/\$(src)\r\?$|KSU_KERNEL_DIR := $(abspath $(src))|' \
              KernelSU-Next/kernel/Kbuild
            grep -q 'KSU_KERNEL_DIR := \$(abspath \$(src))' KernelSU-Next/kernel/Kbuild || {
              echo "::error::Gagal memperbaiki KSU_KERNEL_DIR di KernelSU-Next/kernel/Kbuild."
              grep -n "KSU_KERNEL_DIR" KernelSU-Next/kernel/Kbuild || true
              exit 1
            }
            echo "[+] KSU_KERNEL_DIR di-patch ke \$(abspath \$(src)) untuk build out-of-tree."
          fi
          if ! grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
            sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi
          if ! grep -q 'kernelsu' drivers/Makefile; then
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          fi

          for kf in KernelSU-Next/kernel/Kbuild KernelSU-Next/kernel/Makefile; do
            if [ -f "$kf" ]; then
              if ! grep -q "Wno-misleading-indentation" "$kf"; then
                echo "subdir-ccflags-y += -Wno-misleading-indentation" >> "$kf"
              fi
              if ! grep -q "subdir-ccflags-y.*KernelSU-Next" "$kf"; then
                echo "subdir-ccflags-y += -I\$(srctree)/drivers/kernelsu -I\$(srctree)/drivers/kernelsu/include -I\$(srctree)/KernelSU-Next -I\$(srctree)/KernelSU-Next/kernel -I\$(srctree)/KernelSU-Next/kernel/include" >> "$kf"
              fi
            fi
          done

          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || {
            echo "::error::Gagal mendaftarkan drivers/kernelsu/Kconfig ke drivers/Kconfig!"
            exit 1
          }
          test -e drivers/kernelsu
          test -f drivers/kernelsu/Kconfig || {
            echo "::error::File drivers/kernelsu/Kconfig tidak ditemukan!"
            exit 1
          }

      - name: Apply SUSFS Patches
        if: ${{ matrix.variant == 'KernelSU-Next' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"

          SUSFS_DIR="../susfs4ksu/kernel_patches"
          KSUN_DIR="KernelSU-Next"

          # SUSFS Common (libs)
          cp "$SUSFS_DIR/fs/"* ./fs/
          cp "$SUSFS_DIR/include/linux/"* ./include/linux/

          SIDHARTHIFY_PATCH="$GITHUB_WORKSPACE/patches/50_add_susfs_in_gki-android16-6.12-sidharthify.patch"
          APPLIED_PATCH="$SIDHARTHIFY_PATCH"
          [ -f "$APPLIED_PATCH" ] || APPLIED_PATCH="$SUSFS_DIR/50_add_susfs_in_gki-android16-6.12.patch"
          if [ -f "$SIDHARTHIFY_PATCH" ]; then
            echo "[+] Menerapkan patch SuSFS adaptasi Sidharthify 6.12..."
            patch -p1 < "$SIDHARTHIFY_PATCH" || {
              echo "::error::Patch SuSFS adaptasi Sidharthify 6.12 gagal diterapkan!"
              exit 1
            }
          else
            echo "[-] Patch lokal tidak ditemukan, fallback ke upstream gki-android16-6.12..."
            patch -p1 < "$SUSFS_DIR/50_add_susfs_in_gki-android16-6.12.patch" || {
              echo "::error::Patch SuSFS upstream gagal diterapkan!"
              exit 1
            }
          fi

          echo "=== Pemeriksaan file .rej ==="
          REJ_COUNT=$(find . -name "*.rej" | wc -l)
          if [ "$REJ_COUNT" -gt 0 ]; then
            echo "::error::Ditemukan $REJ_COUNT file .rej pasca-patch SuSFS!"
            find . -name "*.rej" -print
            exit 1
          fi

          echo "=== Verifikasi kontrak SUSFS <-> KernelSU-Next ==="
          # Gerbang lama (grep susfs_init di KernelSU-Next/kernel) SELALU lolos: core/init.c
          # memanggilnya dan susfs/susfs_main.c (varian LKM) mendefinisikannya -- tanpa bukti
          # bahwa sisi kernel (fs/susfs.c) menyediakan API yang dipanggil KernelSU-Next.
          # Gerbang ini: setiap susfs_*() yang dipanggil supercall/dispatch.c WAJIB terdefinisi
          # di fs/susfs.c. (Terbukti menolak lib v2.3.0 yang tidak punya *_uid_filter.)
          for f in fs/susfs.c include/linux/susfs.h "$KSUN_DIR/kernel/supercall/dispatch.c"; do
            [ -f "$f" ] || { echo "::error::$f tidak ditemukan — wiring SUSFS hilang."; exit 1; }
          done
          grep -qE '^void susfs_init\(' fs/susfs.c || {
            echo "::error::susfs_init() tidak didefinisikan di fs/susfs.c."
            exit 1
          }
          SUSFS_FNS="$(grep -ohE '\bsusfs_[a-z0-9_]+\(arg\)' "$KSUN_DIR/kernel/supercall/dispatch.c" | sed 's/(arg)$//' | sort -u)"
          [ -n "$SUSFS_FNS" ] || {
            echo "::error::Tidak ada panggilan susfs_*() terdeteksi di dispatch.c (format berubah?) — gerbang tak bisa memverifikasi."
            exit 1
          }
          GATE_FAIL=0
          for fn in $SUSFS_FNS; do
            if ! grep -qE "^[a-z_ ]+[ *]${fn}\(" fs/susfs.c; then
              echo "::error::KernelSU-Next memanggil ${fn}() tetapi fs/susfs.c tidak mendefinisikannya (versi SUSFS tidak cocok?)."
              GATE_FAIL=1
            fi
          done
          [ "$GATE_FAIL" -eq 0 ] || exit 1
          echo "[+] Kontrak OK: $(echo "$SUSFS_FNS" | wc -l) fungsi susfs_*() terpenuhi (SUSFS $(sed -n 's/^#define SUSFS_VERSION "\(.*\)"/\1/p' include/linux/susfs.h))."

          # Gerbang link: setiap simbol yang dideklarasikan `extern` oleh patch SUSFS harus punya
          # definisi (fs/susfs.c, file ter-patch, atau KernelSU-Next). Riwayat CI: dua run gagal di
          # link akhir ('undefined symbol: susfs_open_redirect_spoof_*') setelah ~25 menit.
          python3 "$GITHUB_WORKSPACE/scripts/check_susfs_externs.py" "$APPLIED_PATCH" "$KSUN_DIR/kernel"

      - name: Integrate NoMount
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          KERNEL_DIR="$(pwd)"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/maxsteeel/nomount/${NOMOUNT_PIN}/kernel/setup.sh" | bash -s "$NOMOUNT_PIN"
          actual_commit="$(git -C "$KERNEL_DIR/NoMount" rev-parse HEAD)"
          [ "$actual_commit" = "$NOMOUNT_PIN" ] || {
            echo "::error::NoMount berada di $actual_commit, bukan pin $NOMOUNT_PIN."
            exit 1
          }
          # setup.sh membuat symlink fs/nomount -> NoMount/kernel/src.
          # Cek harus positif: symlink ADA = sukses. Versi lama memakai
          # `[ ! -L ... ] && exit 1` yang justru menggagalkan step saat setup BERHASIL.
          if [ ! -L "$KERNEL_DIR/fs/nomount" ]; then
            echo "::error::Symlink fs/nomount tidak dibuat oleh setup.sh NoMount."
            ls -la "$KERNEL_DIR/fs/" | grep -i nomount || true
            exit 1
          fi
          if ! grep -q "CONFIG_NOMOUNT" "$KERNEL_DIR/fs/Makefile"; then
            echo "::error::fs/Makefile tidak mendaftarkan CONFIG_NOMOUNT."
            exit 1
          fi
          echo "[+] NoMount terpasang: fs/nomount -> $(readlink "$KERNEL_DIR/fs/nomount")"
          echo "NOMOUNT_COMMIT=$actual_commit" >> "$GITHUB_ENV"

      - name: Build and Package NoMount Metamodule
        if: ${{ inputs.build_nomount && strategy.job-index == 0 }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          COMMIT_HASH="$NOMOUNT_PIN"
          SRC_DIR="nomount_src"
          MOD_DIR="nomount_mod"
          ZIP_OUT="NoMount.zip"

          rm -rf "$SRC_DIR" "$MOD_DIR"
          git init -q "$SRC_DIR"
          git -C "$SRC_DIR" remote add origin https://github.com/maxsteeel/nomount.git
          git -C "$SRC_DIR" fetch -q --depth=1 origin "$COMMIT_HASH"
          git -C "$SRC_DIR" checkout -q --detach FETCH_HEAD

          LKML_DIR="lkmloader_src"
          rm -rf "$LKML_DIR"
          git init -q "$LKML_DIR"
          git -C "$LKML_DIR" remote add origin https://github.com/maxsteeel/lkmloader.git
          git -C "$LKML_DIR" fetch -q --depth=1 origin "$LKMLOADER_PIN"
          git -C "$LKML_DIR" checkout -q --detach FETCH_HEAD

          # Flag = .github/workflows/build.yml upstream pada pin ini. nm.c kini memakai header libc
          # (unistd.h, dirent.h, ...) -> link statis ke musl bawaan Zig; -nostdlib/_start lama
          # gagal dengan "'unistd.h' file not found".
          mkdir -p "$SRC_DIR/bin" "$MOD_DIR/bin" "$MOD_DIR/lkm"
          (
            cd "$SRC_DIR/userspace/src"
            zig cc -target aarch64-linux -Oz -mcmodel=tiny -static -ffreestanding -fno-unwind-tables -fno-ident -Wno-invalid-noreturn \
              -mllvm -enable-machine-outliner=always nm.c -o ../../bin/nm-arm64
            zig cc -target arm-linux -Oz -static -ffreestanding -fno-unwind-tables -fno-ident -Wno-invalid-noreturn \
              -ffunction-sections -fdata-sections -Wl,--gc-sections nm.c -o ../../bin/nm-arm
          )
          (
            cd "$LKML_DIR"
            zig cc -target aarch64-linux -Oz -mcmodel=tiny -static -Wl,--gc-sections,-z,norelro -fno-unwind-tables \
              -fno-ident -flto -fmerge-all-constants -fomit-frame-pointer -mllvm -enable-machine-outliner=always \
              src/lkmloader.c -o "../$SRC_DIR/bin/lkmloader-arm64"
            zig cc -target arm-linux -Oz -static -Wl,--gc-sections,-z,norelro -fno-unwind-tables \
              -fno-ident -flto -fmerge-all-constants -fomit-frame-pointer src/lkmloader.c -o "../$SRC_DIR/bin/lkmloader-arm"
          )
          cp -a "$SRC_DIR/module/." "$MOD_DIR/"
          for b in nm-arm64 nm-arm lkmloader-arm64 lkmloader-arm; do
            install -m 0755 "$SRC_DIR/bin/$b" "$MOD_DIR/bin/$b"
          done
          # Biner harus ELF ARM statis (tanpa interpreter): perangkat tidak punya musl.
          file "$MOD_DIR"/bin/*
          for b in "$MOD_DIR"/bin/*; do
            file -b "$b" | grep -q 'statically linked' || { echo "::error::$(basename "$b") bukan biner statis."; exit 1; }
          done
          case "$(file -b "$MOD_DIR/bin/nm-arm64")" in *aarch64*) ;; *) echo "::error::nm-arm64 bukan aarch64."; exit 1 ;; esac
          printf '%s\n' "$LKMLOADER_PIN" > "$MOD_DIR/LKMLOADER_SOURCE_COMMIT"
          sed -i "s/^versionCode=.*/versionCode=1/" "$MOD_DIR/module.prop"
          printf '%s\n' "$COMMIT_HASH" > "$MOD_DIR/NOMOUNT_SOURCE_COMMIT"
          (cd "$MOD_DIR" && zip -qr9 "../$ZIP_OUT" .)
          sha256sum "$ZIP_OUT" > "${ZIP_OUT}.sha256"
          unzip -l "$ZIP_OUT"
          rm -rf "$SRC_DIR" "$MOD_DIR" "$LKML_DIR"

      - name: Apply Kernel Defconfig Flags
        shell: bash
        env:
          DEBUG_PANIC: ${{ inputs.debug_panic }}
          RUST_BINDER: ${{ inputs.rust_binder }}
        run: |
          set -euo pipefail
          # Panic-on-oops/hung/softlockup hanya untuk bring-up (input debug_panic). Di build daily-driver
          # satu hung task 60 detik saja akan me-reboot ponsel. Eksplisit =n agar default defconfig tak bocor.
          if [ "$DEBUG_PANIC" = "true" ]; then PANIC_VAL=y; else PANIC_VAL=n; fi
          echo "[+] debug_panic=$DEBUG_PANIC -> panic-on-oops/hung/softlockup=$PANIC_VAL"
          cd "$CONFIG"

          DEFCONFIG="./arch/arm64/configs/${{ inputs.codename }}_defconfig"

          # LTO tetap NONE (default gki_defconfig/gs201_defconfig). ThinLTO mematikan
          # GENDWARFKSYMS -> mematikan CONFIG_RUST -> mematikan CONFIG_ASHMEM.
          sed -i 's/CONFIG_LTO_GCC=y/# CONFIG_LTO_GCC is not set/' "$DEFCONFIG" 2>/dev/null || true
          {
            echo "CONFIG_LTO_NONE=y"
            echo "CONFIG_GENDWARFKSYMS=y"
            echo "CONFIG_TMPFS_XATTR=y"
            echo "CONFIG_TMPFS_POSIX_ACL=y"
            echo "CONFIG_IP_NF_TARGET_TTL=y"
