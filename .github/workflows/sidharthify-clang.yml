            echo "CONFIG_NOMOUNT=y"

            # --- ColorOS port bring-up: crash capture + required filesystems ---
            # pstore/ramoops: hang -> hung_task panic -> dmesg dumped to DT ramoops
            echo "CONFIG_PSTORE=y"
            echo "CONFIG_PSTORE_RAM=y"
