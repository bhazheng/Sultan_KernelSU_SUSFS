name: Sidharthify (Clang)
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      codename:
        description: "Device codename (e.g. gs201)"
        required: true
        default: "gs201"
        type: string
      variants:
        description: "Varian yang di-build"
        required: false
        default: '["KernelSU-Next"]'
        type: choice
        options:
          - '["KernelSU-Next"]'
          - '["KernelSU-Next", "NoRoot"]'
          - '["NoRoot"]'
  workflow_call:
    inputs:
      codename:
        required: true
        type: string
      variants:
        description: "Varian yang di-build (JSON array)"
        required: false
        type: string
        default: '["KernelSU-Next"]'

jobs:
  build-kernel-sidharthify-kernelsu-susfs:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}

    steps:
      - name: Validate Inputs
        shell: bash
        run: |
          # Validasi awal: tree kernel sidharthify untuk gs201
          case "${{ inputs.codename }}" in
            gs201)
              echo "[+] Codename gs201 valid (tree sidharthify gs201-only)."
              ;;
            *)
              echo "::error::Codename '${{ inputs.codename }}' tidak didukung! Tree kernel sidharthify hanya untuk gs201."
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
          sudo docker image prune --all --force
          echo "[+] Disk space cleaned up"

      - name: Install Essential Build Tools
        shell: bash
        run: |
          sudo apt-get update
          # dwarves      -> pahole >= 1.24, wajib untuk CONFIG_DEBUG_INFO_BTF + Rust (PAHOLE_HAS_LANG_EXCLUDE)
          # libclang-18  -> libclang.so untuk bindgen. Kernel meneruskan CC_FLAGS_CFI
          #                 (-fsanitize=kcfi, -fsanitize-cfi-icall-experimental-normalize-integers)
          #                 ke bindgen; flag itu baru dikenal LLVM >= 17. libclang 16
          #                 (default libclang-dev di noble) menolaknya dan bindgen panic.
          sudo apt-get install -y --no-install-recommends libssl-dev libelf-dev libdw-dev elfutils bc bison flex perl lz4 ccache zlib1g-dev binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi cmake zstd dwarves libclang-18-dev

      - name: Setup Rust 1.82.0 & Bindgen (Android 16 6.12)
        shell: bash
        run: |
          set -euo pipefail
          echo "[+] Setting up Rust 1.82.0 and bindgen for kernel Rust support (ashmem)..."
          rustup toolchain install 1.82.0 --profile minimal
          rustup default 1.82.0
          rustup component add rust-src --toolchain 1.82.0
          rustup target add aarch64-unknown-none --toolchain 1.82.0 2>/dev/null || true

          RUST_SYSROOT=$(rustc +1.82.0 --print sysroot)
          echo "RUST_SYSROOT=$RUST_SYSROOT" >> "$GITHUB_ENV"
          echo "RUSTC_PATH=$RUST_SYSROOT/bin/rustc" >> "$GITHUB_ENV"

          # bindgen 0.69.5 (bukan 0.69.4): libclang >= 19.1 punya bug kompatibilitas
          # dengan bindgen < 0.69.5 (rust-lang/rust-bindgen#2824), yang dideteksi
          # oleh scripts/rust_is_available.sh di tree ini.
          # Arsip berisi satu direktori pembungkus, jadi --strip-components=1 wajib:
          # tanpa itu binary ada di bindgen-bin/bindgen-cli-x86_64-unknown-linux-gnu/bindgen
          mkdir -p "$GITHUB_WORKSPACE/bindgen-bin"
          curl -fsSL https://github.com/rust-lang/rust-bindgen/releases/download/v0.69.5/bindgen-cli-x86_64-unknown-linux-gnu.tar.xz \
            | tar -xJ --strip-components=1 -C "$GITHUB_WORKSPACE/bindgen-bin"
          test -f "$GITHUB_WORKSPACE/bindgen-bin/bindgen" || {
            echo "::error::bindgen tidak ditemukan setelah ekstraksi (layout arsip berubah?)"
            ls -la "$GITHUB_WORKSPACE/bindgen-bin"
            exit 1
          }
          chmod +x "$GITHUB_WORKSPACE/bindgen-bin/bindgen"
          echo "BINDGEN_PATH=$GITHUB_WORKSPACE/bindgen-bin/bindgen" >> "$GITHUB_ENV"

          # bindgen memuat libclang.so saat runtime. Neutron Clang hanya membawa
          # lib/clang/<ver>/lib/libclang_rt.* (runtime compiler-rt), BUKAN libclang.so,
          # jadi LIBCLANG_PATH harus menunjuk ke libclang sistem.
          #
          # PENTING: pilih libclang TERBARU, bukan yang pertama ketemu. Kernel
          # meneruskan CC_FLAGS_CFI (termasuk
          # -fsanitize-cfi-icall-experimental-normalize-integers) ke bindgen lewat
          # `bindgen_c_flags = $(c_flags)`. Flag itu baru dikenal LLVM >= 17;
          # libclang 16 di Ubuntu 24.04 menolaknya dengan
          # "error: unknown argument" dan bindgen panic.
          LIBCLANG_DIR=""
          LIBCLANG_MAJOR=0
          for d in $(ls -d /usr/lib/llvm-*/lib 2>/dev/null | sort -V -r); do
            compgen -G "$d/libclang.so*" > /dev/null || continue
            ver="$(basename "$(dirname "$d")" | sed -n 's/^llvm-\([0-9]\+\)$/\1/p')"
            [ -n "$ver" ] || continue
            if [ "$ver" -gt "$LIBCLANG_MAJOR" ]; then
              LIBCLANG_DIR="$d"
              LIBCLANG_MAJOR="$ver"
            fi
          done
          if [ -z "$LIBCLANG_DIR" ]; then
            # Fallback: libclang di path sistem tanpa direktori llvm-<N>.
            for d in /usr/lib/x86_64-linux-gnu /usr/lib64 /usr/lib; do
              compgen -G "$d/libclang.so*" > /dev/null || continue
              LIBCLANG_DIR="$d"
              LIBCLANG_MAJOR="$(basename "$(readlink -f "$d"/libclang.so* 2>/dev/null | head -1)" 2>/dev/null | sed -n 's/^libclang\.so\.\([0-9]\+\).*/\1/p')"
              [ -n "$LIBCLANG_MAJOR" ] || LIBCLANG_MAJOR=0
              break
            done
          fi
          if [ -z "$LIBCLANG_DIR" ]; then
            echo "::error::libclang.so tidak ditemukan — pasang libclang-dev."
            exit 1
          fi
          # Guard: libclang < 17 tidak bisa mem-parse CC_FLAGS_CFI kernel ini.
          if [ "$LIBCLANG_MAJOR" -lt 17 ]; then
            echo "::error::libclang $LIBCLANG_MAJOR terlalu tua (< 17) untuk flag CFI kernel; pasang libclang-18-dev."
            exit 1
          fi
          echo "LIBCLANG_PATH=$LIBCLANG_DIR" >> "$GITHUB_ENV"
          echo "[+] libclang dir: $LIBCLANG_DIR (major $LIBCLANG_MAJOR)"

          echo "[+] Tool versions:"
          "$RUST_SYSROOT/bin/rustc" --version
          "$GITHUB_WORKSPACE/bindgen-bin/bindgen" --version
          LIBCLANG_PATH="$LIBCLANG_DIR" "$GITHUB_WORKSPACE/bindgen-bin/bindgen" --version
      - name: Download and extract Neutron Clang (06092026)
        shell: bash
        run: |
          set -euo pipefail
          echo "Fetching Neutron Clang 06092026 (Neutron-Toolchains/clang-build-catalogue)..."
          mkdir -p $GITHUB_WORKSPACE/clang
          CLANG_URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst"
          for i in 1 2 3; do
            echo "Attempt $i: $CLANG_URL"
            HTTP_CODE="$(curl -sSL -o /tmp/clang.tar.zst -w "%{http_code}" "$CLANG_URL" || true)"
            echo "HTTP code: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] && [ -s /tmp/clang.tar.zst ]; then
              if head -c 4 /tmp/clang.tar.zst | od -An -tx1 | grep -qi "28 b5 2f fd"; then
                if tar -I zstd -tf /tmp/clang.tar.zst >/dev/null 2>&1; then
                  tar -I zstd -xf /tmp/clang.tar.zst -C $GITHUB_WORKSPACE/clang
                  rm -f /tmp/clang.tar.zst
                  echo "[+] Neutron Clang extracted successfully"
                  break
                else
                  echo "Arsip zst rusak, retry..." >&2
                fi
              else
                echo "File bukan zstd valid (awal):" >&2
                head -c 200 /tmp/clang.tar.zst >&2 || true
              fi
            else
              echo "retry $i failed (http=$HTTP_CODE)" >&2
            fi
            rm -f /tmp/clang.tar.zst
            sleep 5
            if [ "$i" -eq 3 ]; then
              echo "::error::Failed to download Neutron Clang after 3 attempts"
              exit 1
            fi
          done
          chmod +x $GITHUB_WORKSPACE/clang/bin/* 2>/dev/null || true
          $GITHUB_WORKSPACE/clang/bin/clang --version
          $GITHUB_WORKSPACE/clang/bin/ld.lld --version

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ inputs.codename }}-${{ matrix.variant }}-sidharthify-6.12-clang-v2
          restore-keys: |
            ccache-${{ inputs.codename }}-${{ matrix.variant }}-sidharthify-6.12-clang-
            ccache-${{ inputs.codename }}-sidharthify-6.12-clang-

      - name: Set up Zig Compiler
        uses: jetsung/setup-zig@v0.0.4
        with:
          version: 0.13.0

      - name: Set CONFIG Environment Variable
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="android_kernel_google_gs201"
          echo "CONFIG=$CONFIG" >> "$GITHUB_ENV"

      - name: Clone AnyKernel3 and Dependencies (Parallel)
        shell: bash
        run: |
          set -euo pipefail
          echo "[+] Cloning dependencies in parallel (shallow + partial)..."
          KERNEL_BRANCH="6.12-test"
          if git ls-remote --exit-code --heads https://github.com/sidharthify/android_kernel_google_gs201 6.12 >/dev/null 2>&1; then
            KERNEL_BRANCH="6.12"
          fi
          echo "[+] Target kernel branch: $KERNEL_BRANCH (Sidharthify 6.12)"

          clone_kernel() {
            local n=0
            until [ "$n" -ge 2 ]; do
              if git -c protocol.version=2 clone --depth=1 --single-branch --no-tags --filter=blob:none https://github.com/sidharthify/android_kernel_google_gs201 -b "$KERNEL_BRANCH" android_kernel_google_gs201; then
                return 0
              fi
              n=$((n+1))
              echo "retry $n/2 partial clone kernel gagal, membersihkan..." >&2
              rm -rf android_kernel_google_gs201
              sleep 5
            done
            echo "[*] Partial clone ditolak server — fallback ke shallow penuh." >&2
            git -c protocol.version=2 clone --depth=1 --single-branch --no-tags https://github.com/sidharthify/android_kernel_google_gs201 -b "$KERNEL_BRANCH" android_kernel_google_gs201
          }
          # AnyKernel3 sama seperti build 6.1: gs201 adalah perangkat yang sama,
          # jadi layout partisi (boot + vendor_kernel_boot untuk dtb) tidak
          # berubah antar versi kernel. Branch sultan-gs201 sudah menangani
          # Image.lz4 dan menghapusnya setelah flash boot (commit b71ca5d
          # "Remove Image.lz4 after boot flash") supaya kernel tidak ikut
          # ditulis ke vendor_kernel_boot -- hanya dtb yang masuk ke sana.
          git -c protocol.version=2 clone --depth=1 --single-branch --no-tags https://github.com/TheWildJames/AnyKernel3.git -b "sultan-${{ inputs.codename }}" AnyKernel3 &

          clone_kernel &

          # SuSFS upstream dari simonpunk (branch gki-android16-6.12)
          # Di-pin ke commit 9c9f19d: inilah versi yang cocok dengan
          # patches/50_add_susfs_in_gki-android16-6.12-sidharthify.patch
          # (commit 415d955 men-sync patch ke 9c9f19d).
          # Tanpa pin, branch HEAD bergerak dan kombinasi patch+lib bisa tidak
          # konsisten -> build rusak tanpa peringatan.
          SUSFS_COMMIT="9c9f19d8395693327c78df36569b44e94c187b8a"
          git -c protocol.version=2 clone --depth=1 --single-branch --no-tags \
            https://gitlab.com/simonpunk/susfs4ksu.git -b "gki-android16-6.12" susfs4ksu &

          for pid in $(jobs -p); do
            wait "$pid"
          done

          # Fetch commit target bila tidak ikut dalam shallow clone, lalu checkout.
          if ! git -C susfs4ksu cat-file -e "${SUSFS_COMMIT}^{commit}" 2>/dev/null; then
            git -C susfs4ksu fetch --depth=1 origin "$SUSFS_COMMIT"
          fi
          git -C susfs4ksu checkout --detach "$SUSFS_COMMIT"
          echo "[+] susfs4ksu pinned at $(git -C susfs4ksu rev-parse HEAD)"

      - name: Record Upstream SHAs
        shell: bash
        run: |
          set -euo pipefail
          python3 - << 'EOF'
          import json, os, subprocess

          def ls_remote(url, ref):
              try:
                  out = subprocess.run(
                      ["git", "ls-remote", url, ref],
                      capture_output=True, text=True, timeout=60, check=True,
                  ).stdout.strip()
                  return out.split()[0] if out else "unknown"
              except Exception as e:
                  print(f"::warning::ls-remote gagal untuk {url} {ref}: {e}")
                  return "unknown"

          def local_head(path):
              try:
                  out = subprocess.run(
                      ["git", "-C", path, "rev-parse", "HEAD"],
                      capture_output=True, text=True, timeout=30, check=True,
                  ).stdout.strip()
                  return out if out else "unknown"
              except Exception as e:
                  print(f"::warning::rev-parse gagal untuk {path}: {e}")
                  return "unknown"

          config = os.environ.get("CONFIG", "android_kernel_google_gs201")
          # susfs4ksu & kernel tree sudah ada di disk (di-pin / di-clone di step sebelumnya),
          # jadi pakai HEAD lokal. KernelSU-Next baru di-clone setelah step ini, jadi
          # masih memakai ls-remote (nilai yang akan di-clone).
          shas = {
              "kernel_tree_sidharthify_6.12": local_head(config),
              "KernelSU-Next_pershoot": ls_remote("https://github.com/pershoot/KernelSU-Next.git", "refs/heads/dev-susfs"),
              "susfs4ksu_simonpunk_6.12": local_head("susfs4ksu"),
              "nomount_dev": ls_remote("https://github.com/maxsteeel/nomount.git", "refs/heads/dev"),
          }
          with open("upstream-shas.json", "w") as f:
              json.dump(shas, f, indent=2)
          for k, v in shas.items():
              print(f"[+] {k} = {v}")
          EOF
          cp upstream-shas.json "$GITHUB_WORKSPACE/upstream-shas-${{ matrix.variant }}-6.12-clang.json"
          {
            echo "### Upstream SHAs (6.12 Sidharthify)"
            echo ""
            python3 -c "import json; [print('- ' + k + ': ' + v) for k, v in json.load(open('upstream-shas.json')).items()]"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Upstream SHAs
        uses: actions/upload-artifact@v4
        with:
          name: upstream-shas-${{ inputs.codename }}-${{ matrix.variant }}-6.12-clang
          path: |
            ${{ github.workspace }}/upstream-shas-${{ matrix.variant }}-6.12-clang.json

      - name: Add Root Implementation & Version Anchoring
        if: ${{ matrix.variant == 'KernelSU-Next' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"

          rm -rf KernelSU KernelSU-Next drivers/kernelsu drivers/KernelSU
          sed -i '/kernelsu/d' drivers/Makefile 2>/dev/null || true
          sed -i '/kernelsu/d' drivers/Kconfig 2>/dev/null || true

          retry() {
            local n=0
            until [ "$n" -ge 5 ]; do
              "$@" && return 0
              n=$((n+1))
              echo "retry $n/5 failed for: $*" >&2
              sleep 5
            done
            return 1
          }

          if [ "${{ matrix.variant }}" == "KernelSU-Next" ]; then
            echo "[+] Adding KernelSU-Next dari fork pershoot (branch dev-susfs)..."
            retry git clone --depth=1 https://github.com/pershoot/KernelSU-Next.git -b dev-susfs KernelSU-Next
            ln -sf ../KernelSU-Next/kernel drivers/kernelsu
            # Fix Linux 6.12 header cleanup: sertakan <linux/pid.h> untuk task_pid_nr
            sed -i '1i#include <linux/pid.h>' KernelSU-Next/kernel/compat/samsung_kdp.c 2>/dev/null || true
            sed -i '1i#include <linux/pid.h>' KernelSU-Next/kernel/sulog/event.c 2>/dev/null || true
            sed -i '1i#include <linux/pid.h>' KernelSU-Next/kernel/include/ksu_samsung_kdp.h 2>/dev/null || true
            sed -i '1i#include <linux/pid.h>' KernelSU-Next/kernel/include/klog.h 2>/dev/null || true

            # Salin header uapi dan include langsung ke semua direktori target agar selalu ditemukan di out-of-tree build 6.12
            cp -a KernelSU-Next/uapi KernelSU-Next/kernel/ 2>/dev/null || true
            cp -a KernelSU-Next/uapi KernelSU-Next/kernel/core/ 2>/dev/null || true
            cp -a KernelSU-Next/uapi KernelSU-Next/kernel/policy/ 2>/dev/null || true
            cp -a KernelSU-Next/uapi drivers/ 2>/dev/null || true
            cp -f KernelSU-Next/kernel/include/* KernelSU-Next/kernel/compat/ 2>/dev/null || true
            cp -f KernelSU-Next/kernel/include/* KernelSU-Next/kernel/core/ 2>/dev/null || true
            cp -f KernelSU-Next/kernel/include/* KernelSU-Next/kernel/policy/ 2>/dev/null || true
            cp -f KernelSU-Next/kernel/include/* KernelSU-Next/kernel/ 2>/dev/null || true
            ln -sf ../uapi KernelSU-Next/kernel/uapi 2>/dev/null || true

            echo "[+] Menerapkan patch KernelSU-Next hook build..."
            # Patch ini hanya menambah subdir-ccflags-y + memperbaiki endif KPROBES.
            # Jangan di-`|| true`: bila upstream Kbuild berubah, kita ingin tahu di sini
            # (dengan fuzz besar) daripada gagal jauh di tahap compile.
            if ! patch -p1 -d KernelSU-Next < "$GITHUB_WORKSPACE/patches/02_ksun_sultan.patch"; then
              echo "::error::Patch 02_ksun_sultan.patch gagal — upstream KernelSU-Next/Kbuild berubah?"
              exit 1
            fi
            if grep -q "subdir-ccflags-y.*KernelSU-Next" KernelSU-Next/kernel/Kbuild; then
              echo "[+] subdir-ccflags-y terpasang di kernel/Kbuild."
            else
              echo "::warning::subdir-ccflags-y tidak ditemukan di kernel/Kbuild (hunk hanya fuzz)."
            fi

            # Perbaiki resolusi KSU_KERNEL_DIR untuk build out-of-tree (6.12).
            # scripts/Makefile.build di ACK 6.12 men-set
            #   src := $(if $(VPATH),$(VPATH)/)$(obj)
            # sehingga src SUDAH membawa prefiks srctree ("../drivers/kernelsu").
            # kernel/Kbuild lalu melakukan KSU_KERNEL_DIR := $(srctree)/$(src)
            # -> "../../drivers/kernelsu", yang dari objtree menunjuk ke LUAR tree:
            #   No rule to make target '../../drivers/kernelsu/preinit/runner/runner.c'
            # Di 6.1 tidak kena karena scripts/Makefile.build-nya masih
            #   src := $(obj)
            # $(abspath $(src)) benar untuk ketiga kasus: in-tree, objtree di dalam
            # source tree, dan O= absolut. Pola dibuat toleran CRLF karena file
            # dari git bisa punya line ending CRLF.
            sed -i 's|^KSU_KERNEL_DIR := \$(srctree)/\$(src)\r\?$|KSU_KERNEL_DIR := $(abspath $(src))|' \
              KernelSU-Next/kernel/Kbuild
            grep -q 'KSU_KERNEL_DIR := \$(abspath \$(src))' KernelSU-Next/kernel/Kbuild || {
              echo "::error::Gagal memperbaiki KSU_KERNEL_DIR di KernelSU-Next/kernel/Kbuild."
              grep -n "KSU_KERNEL_DIR" KernelSU-Next/kernel/Kbuild || true
              exit 1
            }
            echo "[+] KSU_KERNEL_DIR di-patch ke \$(abspath \$(src)) untuk build out-of-tree."
          fi
          if ! grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
            sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi
          if ! grep -q 'kernelsu' drivers/Makefile; then
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          fi

          for kf in KernelSU-Next/kernel/Kbuild KernelSU-Next/kernel/Makefile; do
            if [ -f "$kf" ]; then
              if ! grep -q "Wno-misleading-indentation" "$kf"; then
                echo "subdir-ccflags-y += -Wno-misleading-indentation" >> "$kf"
              fi
              if ! grep -q "subdir-ccflags-y.*KernelSU-Next" "$kf"; then
                echo "subdir-ccflags-y += -I\$(srctree)/drivers/kernelsu -I\$(srctree)/drivers/kernelsu/include -I\$(srctree)/KernelSU-Next -I\$(srctree)/KernelSU-Next/kernel -I\$(srctree)/KernelSU-Next/kernel/include" >> "$kf"
              fi
            fi
          done

          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || {
            echo "::error::Gagal mendaftarkan drivers/kernelsu/Kconfig ke drivers/Kconfig!"
            exit 1
          }
          test -e drivers/kernelsu
          test -f drivers/kernelsu/Kconfig || {
            echo "::error::File drivers/kernelsu/Kconfig tidak ditemukan!"
            exit 1
          }

      - name: Apply SUSFS Patches
        if: ${{ matrix.variant == 'KernelSU-Next' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"

          SUSFS_DIR="../susfs4ksu/kernel_patches"
          KSUN_DIR="KernelSU-Next"

          # SUSFS Common (libs)
          cp "$SUSFS_DIR/fs/"* ./fs/
          cp "$SUSFS_DIR/include/linux/"* ./include/linux/

          SIDHARTHIFY_PATCH="$GITHUB_WORKSPACE/patches/50_add_susfs_in_gki-android16-6.12-sidharthify.patch"
          if [ -f "$SIDHARTHIFY_PATCH" ]; then
            echo "[+] Menerapkan patch SuSFS adaptasi Sidharthify 6.12..."
            patch -p1 < "$SIDHARTHIFY_PATCH" || {
              echo "::error::Patch SuSFS adaptasi Sidharthify 6.12 gagal diterapkan!"
              exit 1
            }
          else
            echo "[-] Patch lokal tidak ditemukan, fallback ke upstream gki-android16-6.12..."
            patch -p1 < "$SUSFS_DIR/50_add_susfs_in_gki-android16-6.12.patch" || {
              echo "::error::Patch SuSFS upstream gagal diterapkan!"
              exit 1
            }
          fi

          echo "=== Pemeriksaan file .rej ==="
          REJ_COUNT=$(find . -name "*.rej" | wc -l)
          if [ "$REJ_COUNT" -gt 0 ]; then
            echo "::error::Ditemukan $REJ_COUNT file .rej pasca-patch SuSFS!"
            find . -name "*.rej" -print
            exit 1
          fi

          echo "=== Verifikasi konsistensi patch SUSFS/KSU ==="
          if ! grep -rq "susfs_init" "$KSUN_DIR/kernel/" 2>/dev/null; then
            echo "::error::susfs_init tidak ditemukan di $KSUN_DIR/kernel/ — wiring SUSFS hilang."
            exit 1
          fi
          echo "[+] Konsistensi patch SUSFS/KSU OK (pershoot dev-susfs native)."

      - name: Integrate NoMount
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          KERNEL_DIR="$(pwd)"
          curl -fsSL --retry 3 https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -s dev
          actual_commit="$(git -C "$KERNEL_DIR/NoMount" rev-parse HEAD)"
          # setup.sh membuat symlink fs/nomount -> NoMount/kernel/src.
          # Cek harus positif: symlink ADA = sukses. Versi lama memakai
          # `[ ! -L ... ] && exit 1` yang justru menggagalkan step saat setup BERHASIL.
          if [ ! -L "$KERNEL_DIR/fs/nomount" ]; then
            echo "::error::Symlink fs/nomount tidak dibuat oleh setup.sh NoMount."
            ls -la "$KERNEL_DIR/fs/" | grep -i nomount || true
            exit 1
          fi
          if ! grep -q "CONFIG_NOMOUNT" "$KERNEL_DIR/fs/Makefile"; then
            echo "::error::fs/Makefile tidak mendaftarkan CONFIG_NOMOUNT."
            exit 1
          fi
          echo "[+] NoMount terpasang: fs/nomount -> $(readlink "$KERNEL_DIR/fs/nomount")"
          echo "NOMOUNT_COMMIT=$actual_commit" >> "$GITHUB_ENV"

      - name: Build and Package NoMount Metamodule
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          COMMIT_HASH="${NOMOUNT_COMMIT:-$(git ls-remote https://github.com/maxsteeel/nomount.git refs/heads/dev | cut -f1)}"
          SRC_DIR="nomount_src"
          MOD_DIR="nomount_mod"
          ZIP_OUT="NoMount.zip"

          rm -rf "$SRC_DIR" "$MOD_DIR"
          git clone --depth=1 https://github.com/maxsteeel/nomount.git -b dev "$SRC_DIR"
          git -C "$SRC_DIR" checkout "$COMMIT_HASH" || true

          mkdir -p "$SRC_DIR/bin" "$MOD_DIR/bin"
          (
            cd "$SRC_DIR/userspace/src"
            zig cc -target aarch64-linux -Oz -mcmodel=tiny -static -nostdlib -ffreestanding -fno-unwind-tables -fno-ident -Wno-invalid-noreturn -Wl,--entry=_start nm.c -o ../../bin/nm-arm64
            zig cc -target arm-linux -Oz -static -nostdlib -ffreestanding -fno-unwind-tables -fno-ident -Wno-invalid-noreturn -ffunction-sections -fdata-sections -Wl,--gc-sections -Wl,--entry=_start nm.c -o ../../bin/nm-arm
          )
          cp -a "$SRC_DIR/module/." "$MOD_DIR/"
          install -m 0755 "$SRC_DIR/bin/nm-arm64" "$MOD_DIR/bin/nm-arm64"
          install -m 0755 "$SRC_DIR/bin/nm-arm" "$MOD_DIR/bin/nm-arm"
          sed -i "s/^versionCode=.*/versionCode=1/" "$MOD_DIR/module.prop"
          printf '%s\n' "$COMMIT_HASH" > "$MOD_DIR/NOMOUNT_SOURCE_COMMIT"
          (cd "$MOD_DIR" && zip -qr9 "../$ZIP_OUT" .)
          sha256sum "$ZIP_OUT" > "${ZIP_OUT}.sha256"
          rm -rf "$SRC_DIR" "$MOD_DIR"

      - name: Apply Kernel Defconfig Flags
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"

          DEFCONFIG="./arch/arm64/configs/${{ inputs.codename }}_defconfig"

          # LTO tetap NONE (default gki_defconfig/gs201_defconfig). ThinLTO mematikan
          # GENDWARFKSYMS -> mematikan CONFIG_RUST -> mematikan CONFIG_ASHMEM.
          sed -i 's/CONFIG_LTO_GCC=y/# CONFIG_LTO_GCC is not set/' "$DEFCONFIG" 2>/dev/null || true
